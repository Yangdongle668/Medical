name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contracts:
    name: 契约 —— 类型 · 产物一致 · 破坏性变更门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }          # check:breaking 需要 HEAD 作基线
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm run typecheck

      # 产物必须与 zod 定义一致：openapi.yaml 是生成出来的，不允许手改
      - name: 重新生成并确认无差异
        run: |
          npm run contracts:build
          if ! git diff --quiet -- packages/contracts/openapi.yaml packages/contracts/mocks; then
            echo "::error::openapi.yaml / mocks 与 zod 定义不一致。请运行 npm run contracts:build 后提交产物。"
            git --no-pager diff --stat -- packages/contracts/openapi.yaml packages/contracts/mocks
            exit 1
          fi

      # 破坏性变更不是不能做，是不能悄悄做
      - run: npm run contracts:check
      - run: npm run test -w @sitedesk/contracts

  database:
    name: 数据库 —— 迁移可重复 · RLS · 审计不可变
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    env:
      PGPASSWORD: postgres
      TEST_DATABASE_URL: postgres://sitedesk:sitedesk@127.0.0.1:5432/sitedesk_test
      APP_TEST_DATABASE_URL: postgres://sitedesk_app:sitedesk_app@127.0.0.1:5432/sitedesk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - name: 引导角色与扩展
        run: |
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE sitedesk_test;"
          psql -h 127.0.0.1 -U postgres -d sitedesk_test -f db/scripts/bootstrap.sql
          psql -h 127.0.0.1 -U postgres -d sitedesk_test -c "ALTER DATABASE sitedesk_test OWNER TO sitedesk;"
      - name: 写入 .env（测试库连接）
        run: |
          printf 'TEST_DATABASE_URL=%s\nAPP_TEST_DATABASE_URL=%s\n' \
            "$TEST_DATABASE_URL" "$APP_TEST_DATABASE_URL" > .env
      - run: npm run test -w db
