name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contracts:
    name: 契约与口径 —— 类型 · 产物一致 · 破坏性变更门禁 · I8' 基线
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # 门禁要取 PR 的 base.sha 作基线 —— 浅克隆里通常没有那个提交
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run arch:check

      # 产物必须与 zod 定义一致：openapi.yaml 是生成出来的，不允许手改
      - name: 重新生成并确认无差异
        run: |
          npm run contracts:build
          if ! git diff --quiet -- packages/contracts/openapi.yaml packages/contracts/mocks; then
            echo "::error::openapi.yaml / mocks 与 zod 定义不一致。请运行 npm run contracts:build 后提交产物。"
            git --no-pager diff --stat -- packages/contracts/openapi.yaml packages/contracts/mocks
            exit 1
          fi

      # 破坏性变更不是不能做，是不能悄悄做。
      #
      # 基线必须显式给：pull_request 检出的是**合并提交**，
      # HEAD 里的 openapi.yaml 就是本 PR 提议的那一份 ——
      # 用它当基线等于拿文件跟自己比，门禁会一直绿着而什么也没验。
      # （脚本在 CI 下已拒绝回退到 HEAD，这里是它的另一半。）
      #
      # 基线走**环境变量**，不走命令行参数。第一版写的是
      #   npm run contracts:check -- --baseline-ref "$BASE"
      # 结果 npm 把 `--baseline-ref` 这个名字自己吃掉了，只透传了值：
      #   > tsx scripts/check-breaking.ts 2586482…
      # 脚本看到一个没有名字的裸参数，判定"没给基线"，按规矩停下。
      # 根脚本外面还套了一层 `npm run … -w`，参数每过一层都可能被重新解析；
      # 环境变量不经过任何一层的参数解析。
      - name: 破坏性变更门禁
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          [ -n "$BASE" ] || BASE="$(git rev-parse HEAD^)"   # push 到 main：与上一次提交比
          echo "基线 = $BASE"
          SITEDESK_BASELINE_REF="$BASE" npm run contracts:check
      - run: npm run test -w @sitedesk/contracts
      # 计算引擎是纯函数，不需要数据库 —— 与契约同一个 job，失败得更早
      - run: npm run test -w @sitedesk/calc
      # 设计令牌的对比度实测：明暗双模式逐对量，不靠肉眼
      - run: npm run test -w @sitedesk/ui

  database:
    name: 数据库与后端 —— 迁移 · RLS · 等价性 · 权限矩阵
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    env:
      PGPASSWORD: postgres
      TEST_DATABASE_URL: postgres://sitedesk:sitedesk@127.0.0.1:5432/sitedesk_test
      APP_TEST_DATABASE_URL: postgres://sitedesk_app:sitedesk_app@127.0.0.1:5432/sitedesk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - name: 引导角色与扩展
        run: |
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE sitedesk_test;"
          psql -h 127.0.0.1 -U postgres -d sitedesk_test -f db/scripts/bootstrap.sql
          psql -h 127.0.0.1 -U postgres -d sitedesk_test -c "ALTER DATABASE sitedesk_test OWNER TO sitedesk;"
      - name: 写入 .env（测试库连接）
        run: |
          printf 'TEST_DATABASE_URL=%s\nAPP_TEST_DATABASE_URL=%s\nAPP_DATABASE_URL=%s\n' \
            "$TEST_DATABASE_URL" "$APP_TEST_DATABASE_URL" "$APP_TEST_DATABASE_URL" > .env
      - run: npm run test -w db
      - run: npm run test -w @sitedesk/policy
      # api 的每个测试文件会自建一个独立数据库（见 test/harness.ts），
      # 需要 owner 角色有 CREATEDB —— bootstrap.sql 里已给
      - run: npm run test -w @sitedesk/api

      # 生产产物：打包 → 真的起起来 → 真的打一个请求。
      # `node build/server.mjs` 这条路径在 Phase 9 之前从来没有被走过
      # （测试走 vitest，开发走 @swc-node/register，两者都有转译），
      # 于是它断了整整五个阶段都没人发现。没人走的路径不会自己报警。
      - run: npm run smoke -w @sitedesk/api

  web:
    name: 前端 —— 构建 · 三个断点零横向溢出 · mock 走通业务流
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci

      # 生产包里不能带上 MSW —— 开关写成方括号访问就会静默失效，
      # 所以这里量的是产物本身，不是相信那行代码
      - name: 生产构建不含 mock
        run: |
          npm run build -w @sitedesk/web
          if grep -rlq "msw" apps/web/dist/assets/*.js; then
            echo "::error::生产构建里出现了 MSW —— 检查 main.tsx 的构建期开关"
            exit 1
          fi

      # 队列逻辑的单元测试：e2e 结构上验不到"重复入队会被折叠"——
      # 界面在第一次入队后就把那一格锁住了，人点不了第二次。
      - run: npm run test -w @sitedesk/web

      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -w @sitedesk/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trace
          path: apps/web/test-results/
          retention-days: 7

  image:
    name: 部署镜像 —— 真的构建，真的起容器
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }

      - name: 准备数据库
        run: |
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE sitedesk_test;"
          psql -h 127.0.0.1 -U postgres -d sitedesk_test -f db/scripts/bootstrap.sql
          psql -h 127.0.0.1 -U postgres -d sitedesk_test -c "ALTER DATABASE sitedesk_test OWNER TO sitedesk;"
          npm ci
          DATABASE_URL=postgres://sitedesk:sitedesk@127.0.0.1:5432/sitedesk_test \
            npx node-pg-migrate --migrations-dir db/migrations --migrations-table schema_migration up
          DATABASE_URL=postgres://sitedesk:sitedesk@127.0.0.1:5432/sitedesk_test \
            node db/scripts/seed.mjs

      - run: docker build -t sitedesk-api:ci .

      # 起容器、打探针、打一个真实请求。
      # 只构建不运行的镜像检查，和"编译通过就算能跑"是同一种自欺。
      - name: 起容器并验探针
        run: |
          docker run -d --name api --network host \
            -e APP_DATABASE_URL=postgres://sitedesk_app:sitedesk_app@127.0.0.1:5432/sitedesk_test \
            -e PORT=3000 -e SITEDESK_DEV_LOGIN=1 -e NODE_ENV=test \
            sitedesk-api:ci
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:3000/v1/health >/dev/null && break
            sleep 1
          done
          echo "存活：$(curl -s -w ' [%{http_code}]' http://127.0.0.1:3000/v1/health)"
          echo "就绪：$(curl -s -w ' [%{http_code}]' http://127.0.0.1:3000/v1/health/ready)"
          curl -fsS http://127.0.0.1:3000/v1/health/ready >/dev/null

          TOKEN=$(curl -fsS -X POST http://127.0.0.1:3000/v1/auth/dev-session \
            -H 'Content-Type: application/json' -d '{"login":"lingyuan"}' \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).token))")
          N=$(curl -fsS "http://127.0.0.1:3000/v1/study-sites?limit=3" \
            -H "Authorization: Bearer $TOKEN" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).items.length))")
          echo "取到 $N 个中心"
          [ "$N" -gt 0 ] || { echo '::error::容器起来了，但取不到数据'; docker logs api; exit 1; }

          # 未认证必须被挡 —— 守卫也要在镜像里
          CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/v1/study-sites)
          [ "$CODE" = "401" ] || { echo "::error::未认证请求返回 $CODE，应为 401"; exit 1; }

      # ── 前端镜像：起在 API 前面，把同源反代真的走一遍 ──────────────
      # 只 curl 静态文件是不够的：前端上线之后最容易坏的那件事是
      # "页面出来了，但一个接口都打不通" —— 那是反代的问题，
      # 只有把两个容器摆在一起才看得见。
      - run: docker build -f Dockerfile.web -t sitedesk-web:ci .

      - name: 起前端容器，验托管与反代
        run: |
          docker run -d --name web --network host \
            -e PORT=8080 -e SITEDESK_API_ORIGIN=http://127.0.0.1:3000 \
            sitedesk-web:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz >/dev/null && break
            sleep 1
          done

          # ① 首页
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">' \
            || { echo '::error::首页不是构建产物'; docker logs web; exit 1; }

          # ② SPA 回退 —— 刷新深链接不该 404
          CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/sites/whatever)
          [ "$CODE" = "200" ] || { echo "::error::深链接返回 $CODE，SPA 回退没生效"; exit 1; }

          # ③ 缺文件必须 404，不许回退成 HTML
          CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/assets/nope.js)
          [ "$CODE" = "404" ] || { echo "::error::缺失的 js 返回 $CODE，应为 404"; exit 1; }

          # ④ 安全头
          curl -sI http://127.0.0.1:8080/ | grep -qi '^content-security-policy:' \
            || { echo '::error::没有 CSP 头'; exit 1; }

          # ⑤ 同源反代：经前端打到 API 的探针
          curl -fsS http://127.0.0.1:8080/v1/health >/dev/null \
            || { echo '::error::经前端反代打不通 API'; docker logs web; exit 1; }

          # ⑥ 反代要能带认证 —— 令牌是从前端这一侧取的
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:8080/v1/auth/dev-session \
            -H 'Content-Type: application/json' -d '{"login":"lingyuan"}' \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).token))")
          N=$(curl -fsS "http://127.0.0.1:8080/v1/study-sites?limit=3" \
            -H "Authorization: Bearer $TOKEN" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).items.length))")
          echo "经前端反代取到 $N 个中心"
          [ "$N" -gt 0 ] || { echo '::error::反代通了，但取不到数据'; docker logs web; exit 1; }

      - if: failure()
        run: docker logs api || true

      - if: failure()
        run: docker logs web || true

  plans:
    name: 性能 —— 真数据量下的执行计划
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    env:
      PGPASSWORD: postgres
      TEST_DATABASE_URL: postgres://sitedesk:sitedesk@127.0.0.1:5432/sitedesk_test
      APP_TEST_DATABASE_URL: postgres://sitedesk_app:sitedesk_app@127.0.0.1:5432/sitedesk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - name: 引导角色与扩展
        run: |
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE sitedesk_test;"
          psql -h 127.0.0.1 -U postgres -d sitedesk_test -f db/scripts/bootstrap.sql
          psql -h 127.0.0.1 -U postgres -d sitedesk_test -c "ALTER DATABASE sitedesk_test OWNER TO sitedesk;"
      - name: 写入 .env
        run: |
          printf 'TEST_DATABASE_URL=%s\nAPP_TEST_DATABASE_URL=%s\n' \
            "$TEST_DATABASE_URL" "$APP_TEST_DATABASE_URL" > .env

      # 这一步自己建库、灌到 18 万行访视、以应用角色（RLS 生效）量执行计划。
      # 慢，但这是唯一能挡住计划退化的地方：
      # 小库上 Seq Scan 和 Index Scan 一样快，EXPLAIN 长得都对。
      - run: npm run perf:plans

  integration:
    name: 集成 —— 前端打真实后端与真实数据库
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    env:
      PGPASSWORD: postgres
      TEST_DATABASE_URL: postgres://sitedesk:sitedesk@127.0.0.1:5432/sitedesk_test
      APP_TEST_DATABASE_URL: postgres://sitedesk_app:sitedesk_app@127.0.0.1:5432/sitedesk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - name: 引导角色与扩展
        run: |
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE sitedesk_test;"
          psql -h 127.0.0.1 -U postgres -d sitedesk_test -f db/scripts/bootstrap.sql
          psql -h 127.0.0.1 -U postgres -d sitedesk_test -c "ALTER DATABASE sitedesk_test OWNER TO sitedesk;"
      - name: 写入 .env
        run: |
          printf 'TEST_DATABASE_URL=%s\nAPP_TEST_DATABASE_URL=%s\nAPP_DATABASE_URL=%s\n' \
            "$TEST_DATABASE_URL" "$APP_TEST_DATABASE_URL" "$APP_TEST_DATABASE_URL" > .env
      - run: npx playwright install --with-deps chromium
      - run: npm run integration -w @sitedesk/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: integration-trace
          path: apps/web/test-results/
          retention-days: 7
