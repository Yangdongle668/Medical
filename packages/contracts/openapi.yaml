    get:
      operationId: listEnrollment
      tags:
        - clinical
      summary: 全部中心的入组漏斗
      description: |-
        `getSiteFunnel` 的列表形态。**存在的理由是不让前端做 fan-out**：
        「入组进度」和「筛选漏斗」两页要的都是全部中心的同一组数，
        让前端按中心逐个去打 funnel，那就是把 N+1 从服务端搬到了浏览器上 ——
        15 个中心时看不出来，1500 个时那一页永远打不开。

        和 `getSiteFunnel` 一样**只返回计数，不返回受试者明细**，
        所以不需要 `subjRead`（I10）。行范围照常生效。

        排序：达成率升序 —— 落后的排在最前面。这是这两页唯一要回答的问题。
