  /v1/site-staff:
    get:
      operationId: listSiteStaff
      tags:
        - site
      summary: 中心人员备案名册
      description: |-
        `listStaff` 的**另一个问题**，不是它的一个筛子。

        `/v1/staff` 是我方的人事账（职级、带教、继任、共带几个中心），外部方一行也看不到，那条策略要保留。
        但机构办有一件必须做的事：备案 —— 我院这几个中心上出现的 CRC 是谁、他的 GCP 证书还有效吗。证书过期的人不得开展工作，这不是我方的内部管理，是机构履行监管职责的一部分。

        所以走一个只开这几列的口子（`app.site_staff_registry()`），行范围照旧由登录身份推导 —— **SECURITY DEFINER 绕开的是表策略，不是行范围**。
        `sites` 只列本范围内的中心：那个 CRC 在别家医院还带着几个，与本院无关。
      x-layer: L1
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - name: limit
          in: query
          required: false
          schema:
            default: 50
            type: integer
            minimum: 1
            maximum: 200
        - name: roleKind
          in: query
          required: false
          schema:
            allOf:
              - $ref: '#/components/schemas/RoleKind'
        - name: gcpProblem
          in: query
          required: false
          description: 只看 GCP 已过期或 60 天内到期的
          schema:
            anyOf:
              - type: boolean
              - type: string
                enum:
                  - '1'
                  - 'true'
                  - 'yes'
                  - 'on'
              - type: string
                enum:
                  - '0'
                  - 'false'
                  - 'no'
                  - 'off'
