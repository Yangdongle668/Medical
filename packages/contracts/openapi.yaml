  /v1/audit-entries:
    get:
      operationId: listAuditEntries
      tags:
        - identity
      summary: 审计轨迹
      description: 只追加、不可改删。外部方只看得到本院中心相关的条目。
      x-layer: L1
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - name: limit
          in: query
          required: false
          schema:
            default: 50
            type: integer
            minimum: 1
            maximum: 200
        - name: studySiteId
          in: query
          required: false
          schema:
            type: string
            format: uuid
            pattern: >-
              ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        - name: actorLogin
          in: query
          required: false
          schema:
            type: string
        - name: targetType
          in: query
          required: false
          schema:
            type: string
        - name: targetId
          in: query
          required: false
          schema:
            type: string
        - name: sensitiveOnly
          in: query
          required: false
          description: 只看权限类变更
          schema:
            anyOf:
              - type: boolean
              - type: string
                enum:
                  - '1'
                  - 'true'
                  - 'yes'
                  - 'on'
              - type: string
                enum:
                  - '0'
                  - 'false'
                  - 'no'
                  - 'off'
        - name: since
          in: query
          required: false
          schema:
            type: string
