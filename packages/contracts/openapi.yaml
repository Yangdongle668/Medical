    post:
      operationId: completeSubjectVisit
      tags:
        - clinical
      summary: 完成一次访视
      description: |-
        **本系统最重要的一个命令。** 一次调用触发一串后果，拆成多个 REST 调用任何一个失败都会留下不一致的状态：

        | 后果 | 副作用 type | 交付于 |
        |---|---|---|
        | 按 SOA 生成下一次访视窗口 | `NextVisitScheduled` | 本阶段 |
