  /v1/accounts/{id}:
    patch:
      operationId: updateAccount
      tags:
        - identity
      summary: 改账号的角色 / 分组 / 所属机构
      description: |-
        **改角色是权限变更**，写审计且 isSensitive=true —— 「谁把谁调成了什么」是核查必查项。

        改成 `row_rule=hospital` 的角色而没有 orgRef，会被拦下：
        那种账号登得进来却一行数据都看不到，而界面上没有任何东西说得出为什么。

        登录名与姓名不在这里改：登录名是审计轨迹里的那个标识，改掉等于把历史记录指向别人。
      x-layer: L1
      x-required-action: manage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: >-
              ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        - name: Idempotency-Key
          in: header
          required: false
          description: 幂等键（uuid）。可选；带上之后 24 小时内重放同一键返回首次结果，离线重放因此不会写两笔。
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
      responses:
        '200':
          description: 改账号的角色 / 分组 / 所属机构
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          description: 未认证
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
