          type: string
          minLength: 1
          maxLength: 128
        dept:
          type: string
          minLength: 1
          maxLength: 64
        city:
          type: string
          minLength: 1
          maxLength: 32
        piName:
          type: string
          minLength: 1
          maxLength: 64
        piAccountId:
          nullable: true
          type: string
          format: uuid
          pattern: >-
            ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        contracted:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          maximum: 9007199254740991
        unitPriceCents:
          type: integer
          minimum: 0
          maximum: 1000000000000
          description: 金额，单位：分（整数）
        startupFeeCents:
          default: 0
          type: integer
          minimum: 0
          maximum: 1000000000000
          description: 金额，单位：分（整数）
        sivPlannedOn:
          nullable: true
          type: string
          format: date
          pattern: >-
            ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
      required:
        - studyId
        - code
        - hospital
        - dept
        - city
        - piName
        - contracted
        - unitPriceCents
        - startupFeeCents
      additionalProperties: false
