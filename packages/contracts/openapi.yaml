  /v1/accounts/{id}:enable:
    post:
      operationId: enableAccount
      tags:
        - identity
      summary: 启用账号
      description: |-
        停用是可逆的 —— 请长假、借调、误停都会走到这里。
        **但派工不会自己回来**：停用时交接出去的中心仍然在接手人名下，
        要还回去得再发起一次交接。这条不是遗漏，是刻意的：
        让派工随启用自动回滚，会把接手人这段时间做的事变成无主的。
      x-layer: L2
      x-required-action: manage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: >-
              ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        - name: Idempotency-Key
