        这一页问的是「哪几个中心卡住了」，不是「某个中心还差哪几项」。
        带上 items 的话，15 个中心就是 15 × 16 项，而这一页一项都不画。

        排序：先未完成的阻塞项数（降序），再距计划 SIV 的天数 ——
        **启动慢一个月，这个中心的整条收入曲线右移一个月。**
