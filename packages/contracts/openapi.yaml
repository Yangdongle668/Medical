    post:
      operationId: voidTimesheet
      tags:
        - cost
      summary: 作废工时
      description: |-
        **工时不能删，只能作废。** 作废写下时间、人与原因，成本随即从统计里退出。
        只能作废自己填的；作废别人的需要 `approve` 权限。
        自动生成的工时（来自完成访视）同样可作废 —— 访视填错了，成本得能退回来。
