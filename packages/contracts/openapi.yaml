components:
  schemas:
    FieldIssue:
      type: object
      properties:
        path:
          type: string
          description: JSON Pointer，如 /hours
        message:
          type: string
      required:
        - path
        - message
      additionalProperties: false
    GateUnmet:
      type: object
      properties:
        code:
          type: string
          description: 如 open-queries / ip-imbalance
        message:
          type: string
          description: 面向人的说明，如「3 条数据质疑未关闭」
        module:
          description: 处理入口所属模块，供前端给出「去处理」跳转
          type: string
      required:
        - code
        - message
      additionalProperties: false
    Problem:
      type: object
      properties:
        type:
          type: string
          description: https://sitedesk.dev/problems/{code}
        title:
          type: string
        status:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        code:
          type: string
          enum:
            - validation-failed
            - unauthenticated
            - forbidden-action
            - not-found
            - conflict-version
            - idempotency-key-reused
            - invariant-violated
            - gate-not-satisfied
            - rate-limited
            - service-unavailable
            - request-timeout
            - internal
        detail:
          type: string
        instance:
          description: 出错的请求路径
          type: string
        traceId:
          type: string
        issues:
          type: array
          items:
            $ref: '#/components/schemas/FieldIssue'
        unmet:
          type: array
          items:
            $ref: '#/components/schemas/GateUnmet'
        invariant:
          type: string
      required:
        - type
        - title
        - status
        - code
      additionalProperties: false
      description: RFC 9457 Problem Details。所有非 2xx 响应都是这个形状。
    ActionKey:
      type: string
      enum:
        - advance
        - approve
        - bid
        - closeQ
        - closeQA
        - ethics
