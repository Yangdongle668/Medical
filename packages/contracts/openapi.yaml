      tags:
        - auth
      summary: 改自己的口令
      description: |-
        要验旧口令 —— 会话被偷走时，改密是攻击者第一件想做的事。
        没有旧口令的账号（只用一次性链接登录的人）传空串即可：
        他是靠一个真实会话进来的，那本身就是身份证明。

        改完**撤销本人其余会话**，只留当前这一个：改密的常见理由就是「号可能被人拿了」，
        而改完不踢掉别的会话，等于把这件事做了一半。
