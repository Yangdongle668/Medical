  /v1/study-sites/{id}:advance:
    post:
      operationId: advanceStudySite
      tags:
        - site
      summary: 推进中心阶段
      description: |-
        **本系统 L2 命令层的样板。**

        推进不是给一个字段赋值，而是断言一组前置条件已经成立：
        · 推进到 siv：启动清单的阻塞项必须清零
        · 推进到 closed：七项前置条件全部满足（在组受试者、未关闭质疑与质量事件、药品数量平衡、回收药品已销毁、样本链闭环、补偿已发放且有凭证、结题报告已获批）

        未满足时返回 422 `gate-not-satisfied`，`unmet` 里逐条说明还差什么、去哪里处理 —— 而不是一个被禁用的按钮。
      x-layer: L2
      x-required-action: advance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: >-
              ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        - name: Idempotency-Key
          in: header
          required: true
          description: 幂等键（uuid）。24 小时内重放同一键返回首次结果。
          schema:
            type: string
            format: uuid
