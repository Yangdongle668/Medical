openapi: 3.0.3
info:
  title: 临床中心台 SiteDesk API
  version: 0.2.0
  description: |-
    **本文件是产物。** 契约的唯一定义源是 `packages/contracts/src` 下的 zod schema。

    分层：L1 资源层（CRUD 与列表）· L2 命令层（领域动作，返回 sideEffects）· L3 投影层（只读聚合，永不返回明细）。

    带 `x-gated-by` 的字段受列维度权限管辖：**无权限时该字段从响应中消失，不是返回 null**。

    行范围之外的资源一律返回 404 而非 403 —— 403 等于确认「它存在，只是你不能碰」，这个确认本身就是泄漏。
servers:
  - url: https://api.sitedesk.example
    description: 生产
tags:
  - name: auth
    description: 认证：内部 OIDC / 外部一次性链接
  - name: identity
    description: 身份与权限：行 × 列 × 动作
  - name: site
    description: 项目与中心：StudySite 是最小作业单元
paths:
  /v1/accounts:
    get:
      operationId: listAccounts
      tags:
        - identity
      summary: 账号列表
      description: 外部角色只看得到自己 —— 由行级安全强制，不靠调用方传参过滤。
      x-layer: L1
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - name: limit
          in: query
          required: false
          schema:
            default: 50
            type: integer
            minimum: 1
            maximum: 200
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - active
              - disabled
        - name: roleCode
          in: query
          required: false
          schema:
            type: string
        - name: q
          in: query
          required: false
          description: 按姓名或登录名模糊匹配
          schema:
            type: string
            maxLength: 64
      responses:
        '200':
          description: 账号列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAccountsResponse'
        '401':
          description: 未认证
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://sitedesk.dev/problems/unauthenticated
                title: 未认证
                status: 401
                code: unauthenticated
        '403':
          description: 无此动作权限
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://sitedesk.dev/problems/forbidden-action
                title: 无此动作权限
                status: 403
                code: forbidden-action
        '404':
          description: 资源不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://sitedesk.dev/problems/not-found
                title: 资源不存在
                status: 404
                code: not-found
        '422':
          description: 请求校验未通过
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://sitedesk.dev/problems/validation-failed
                title: 请求校验未通过
                status: 422
                code: validation-failed
        '429':
          description: 请求过于频繁
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://sitedesk.dev/problems/rate-limited
                title: 请求过于频繁
                status: 429
                code: rate-limited
        '500':
          description: 服务内部错误
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://sitedesk.dev/problems/internal
                title: 服务内部错误
                status: 500
                code: internal
    post:
      operationId: createAccount
      tags:
        - identity
      summary: 新增账号
      description: |-
        不设密码：内部走 OIDC（企业微信 / 飞书），外部走一次性魔法链接。
        row_rule=hospital 的角色必须同时给出 orgRef，否则账号能登录却一行数据都看不到。
      x-layer: L1
      x-required-action: manage
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: 新增账号
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          description: 未认证
