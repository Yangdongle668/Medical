  /v1/accounts/{id}:disable:
    post:
      operationId: disableAccount
      tags:
        - identity
      summary: 停用账号
      description: |-
        停用不删除 —— 审计轨迹必须能追溯到人。
        **仍带着中心的人不能直接停用**：必须先发起交接，否则那些中心会失去负责人而无人察觉。
      x-layer: L2
      x-required-action: manage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: >-
              ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        - name: Idempotency-Key
          in: header
          required: true
          description: 幂等键（uuid）。24 小时内重放同一键返回首次结果。
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisableAccountRequest'
      responses:
        '200':
          description: 停用账号
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisableAccountResponse'
        '401':
          description: 未认证
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://sitedesk.dev/problems/unauthenticated
                title: 未认证
                status: 401
                code: unauthenticated
        '403':
          description: 无此动作权限
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://sitedesk.dev/problems/forbidden-action
                title: 无此动作权限
                status: 403
                code: forbidden-action
        '404':
          description: 资源不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
