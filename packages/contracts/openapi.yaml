    post:
      operationId: redeemMagicLink
      tags:
        - auth
      summary: 兑换登录链接，换取会话
      description: |-
        兑换在数据库里原子完成：并发的两次兑换只有一次能成功。
        放在应用层做「先查再改」，两个请求同时到达就会双双成功。
