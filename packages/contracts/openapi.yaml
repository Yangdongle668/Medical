  /v1/accounts/{id}:set-password:
    post:
      operationId: setAccountPassword
      tags:
        - identity
      summary: 给账号设一个初始口令
      description: |-
        新建的内部账号需要一条进得来的路。一次性链接要求先登记收件地址
        （那要有人上服务器跑脚本），在通道配好之前，管理员当面给一个初始口令更实际。

        设出来的口令**标成初始口令**：本人登录后顶上会挂一条改不掉的红条，
        改掉之后才消失，而且翻不回去。管理员知道别人的口令是个短期状态，
        这个标记是让它保持短期的唯一办法。

        改自己的口令走 `changePassword`，那条要验旧口令；这条是管理员对别人，
        验的是 `manage` 权限。**不能对自己用** —— 那等于绕过验旧口令那道门。
      x-layer: L1
      x-required-action: manage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: >-
              ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        - name: Idempotency-Key
          in: header
          required: false
          description: 幂等键（uuid）。可选；带上之后 24 小时内重放同一键返回首次结果，离线重放因此不会写两笔。
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAccountPasswordRequest'
      responses:
        '204':
          description: 给账号设一个初始口令
        '401':
          description: 未认证
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://sitedesk.dev/problems/unauthenticated
                title: 未认证
                status: 401
                code: unauthenticated
        '403':
          description: 无此动作权限
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://sitedesk.dev/problems/forbidden-action
                title: 无此动作权限
                status: 403
                code: forbidden-action
        '404':
          description: 资源不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://sitedesk.dev/problems/not-found
                title: 资源不存在
                status: 404
                code: not-found
        '422':
          description: 请求校验未通过
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://sitedesk.dev/problems/validation-failed
                title: 请求校验未通过
                status: 422
                code: validation-failed
        '429':
