        三者任一被区分出来，这个接口就成了账号枚举器；
        耗时不同也一样能读出来 —— 所以验证失败时服务端照样烧掉一次 scrypt。

        连续失败会锁定，锁定时长随失败次数指数增长（封顶 15 分钟）。
        固定阈值对撞库没用而对本人很痛：打错三次的人被关半小时，脚本换个账号继续跑。
