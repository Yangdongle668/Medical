  /v1/timesheets/{id}:approve:
    post:
      operationId: approveTimesheet
      tags:
        - cost
      summary: 审批一条工时
      description: |-
        **审批不改变任何金额** —— 人已经干了活，成本已经发生。
        它只回答一个问题：这笔工时有没有被第二个人看过。
        **不能审自己填的**：自审等于没有审批流，只是多了一次点击，而多出来的那次点击会让人以为这里已经有把关了。
        审过不能撤回：审错了请作废这一笔并重报。
      x-layer: L2
      x-required-action: approve
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: >-
              ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        - name: Idempotency-Key
          in: header
          required: true
          description: 幂等键（uuid）。24 小时内重放同一键返回首次结果。
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
