        | 超窗 → **必须**生成方案偏离（I4） | `DeviationDetected` | 本阶段 |
        | 生成受试者补偿待发放单 | `CompensationDue` | 本阶段 |
        | 置 EDC 待录入，起算 5 个工作日 | — | 本阶段 |
        | 进入 PI 待确认队列（I3） | — | 本阶段 |
        | 按费率卡生成工时与成本快照 | `TimesheetPosted` `CostPosted` | Timesheet & Cost |

