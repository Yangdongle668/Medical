      summary: 入选或拒绝一个候选中心
      description: |-
        **系统不阻止低分入选** —— 它拦不住，也不该拦：商务上的取舍本来就不归一套评分决定（申办方指定 PI、为赶 FPI 凑中心数，都发生过）。

