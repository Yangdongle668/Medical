  /v1/subject-visits/{id}:complete:
    post:
      operationId: completeSubjectVisit
      tags:
        - clinical
      summary: 完成一次访视
      description: |-
        **本系统最重要的一个命令。** 一次调用触发一串后果，拆成多个 REST 调用任何一个失败都会留下不一致的状态：

        | 后果 | 副作用 type | 交付于 |
        |---|---|---|
        | 按 SOA 生成下一次访视窗口 | `NextVisitScheduled` | 本阶段 |
        | 筛选期访视完成 → 受试者进入待入组 | — | 本阶段 |
        | 超窗 → **必须**生成方案偏离（I4） | `DeviationDetected` | 本阶段 |
        | 生成受试者补偿待发放单 | `CompensationDue` | 本阶段 |
        | 置 EDC 待录入，起算 5 个工作日 | — | 本阶段 |
        | 进入 PI 待确认队列（I3） | — | 本阶段 |
        | 按费率卡生成工时与成本快照 | `TimesheetPosted` `CostPosted` | Timesheet & Cost |

        **任务未逐项完成不得提交** —— 打勾了事等于没做。
      x-layer: L2
      x-required-action: subjWrite
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
