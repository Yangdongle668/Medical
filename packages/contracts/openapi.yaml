              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://sitedesk.dev/problems/unauthenticated
                title: 未认证
                status: 401
                code: unauthenticated
        '403':
          description: 无此动作权限
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://sitedesk.dev/problems/forbidden-action
                title: 无此动作权限
                status: 403
                code: forbidden-action
        '404':
