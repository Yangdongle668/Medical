      summary: 质疑负荷与中心分布
      description: |-
        **平均挂起天数把未关闭的也算进去。** 只算已关闭的话，一条永远不关的质疑就永远不进分母 —— 越拖越好看，而「平均 4.2 天，目标 5 天」底下压着一条挂了 21 天没人管的。

        每中心给的是密度**和集中度**：扎堆在一个表单上是方案难填（改 eCRF 或培训材料），散在七八个表单上才是这家中心的录入质量（改人）。只给密度，「高不一定是中心差」就只是一句免责声明。
