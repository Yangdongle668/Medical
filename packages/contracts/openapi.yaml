  /v1/auth/magic-link:
    post:
      operationId: requestMagicLink
      tags:
        - auth
      summary: 申请一次性登录链接
      description: |-
        **无论账号是否存在都返回同样的 202。** 区别对待会让这个接口变成账号枚举器。
        链接由邮件 / 短信通道直接发给本人，绝不回显给调用方。
      x-layer: L1
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestMagicLinkRequest'
      responses:
        '202':
          description: 申请一次性登录链接
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkAccepted'
        '401':
