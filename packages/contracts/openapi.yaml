components:
  schemas:
    FieldIssue:
      type: object
      properties:
        path:
          type: string
          description: JSON Pointer，如 /hours
        message:
          type: string
      required:
        - path
        - message
      additionalProperties: false
    GateUnmet:
      type: object
      properties:
        code:
          type: string
          description: 如 open-queries / ip-imbalance
        message:
          type: string
          description: 面向人的说明，如「3 条数据质疑未关闭」
        module:
          description: 处理入口所属模块，供前端给出「去处理」跳转
          type: string
      required:
        - code
        - message
      additionalProperties: false
    Problem:
      type: object
      properties:
        type:
          type: string
          description: https://sitedesk.dev/problems/{code}
        title:
          type: string
        status:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        code:
          type: string
          enum:
            - validation-failed
            - unauthenticated
            - forbidden-action
            - not-found
            - conflict-version
            - idempotency-key-reused
            - invariant-violated
            - gate-not-satisfied
            - rate-limited
            - service-unavailable
            - request-timeout
            - internal
        detail:
          type: string
        instance:
          description: 出错的请求路径
          type: string
        traceId:
          type: string
        issues:
          type: array
          items:
            $ref: '#/components/schemas/FieldIssue'
        unmet:
          type: array
          items:
            $ref: '#/components/schemas/GateUnmet'
        invariant:
          type: string
      required:
        - type
        - title
        - status
        - code
      additionalProperties: false
      description: RFC 9457 Problem Details。所有非 2xx 响应都是这个形状。
    ActionKey:
      type: string
      enum:
        - advance
        - approve
        - bid
        - closeQ
        - closeQA
        - ethics
        - manage
        - piConfirm
        - raiseQ
        - rateWrite
        - subjRead
        - subjWrite
        - timeWrite
    SideEffectType:
      type: string
      enum:
        - TimesheetPosted
        - CostPosted
        - CompensationDue
        - DeviationDetected
        - QualityEventOpened
        - NextVisitScheduled
        - SubjectEnrolled
        - MilestoneReached
        - EthicsTaskCreated
        - SiteStateChanged
      x-extensible: true
      description: 副作用类型。**新增取值是非破坏性变更** —— 客户端必须忽略不认识的 type。破坏性变更门禁据此放行本枚举的新增。
    SideEffect:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/SideEffectType'
        summary:
          type: string
        ref:
          type: string
          format: uuid
          pattern: >-
            ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        amountCents:
          type: integer
          minimum: 0
          maximum: 1000000000000
          description: 金额，单位：分（整数）
        studySiteId:
          type: string
          format: uuid
          pattern: >-
            ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      required:
        - type
        - summary
      additionalProperties: false
      description: 命令执行时被连带触发的领域事件。客户端必须忽略不认识的 type。
    Liveness:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
