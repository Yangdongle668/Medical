                type: https://sitedesk.dev/problems/not-found
                title: 资源不存在
                status: 404
                code: not-found
        '409':
          description: 版本冲突：资源已被他人修改
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
