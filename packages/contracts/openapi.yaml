  /v1/cash-forecast:
    get:
      operationId: getCashForecast
      tags:
        - finance
      summary: 现金流预测
      description: |-
        **系统此前只有后视镜。** 收入按已入组的例数确认、成本按已填的工时 ——两者都只回答「已经发生了什么」。

        而现金是另一回事：人力成本每月刚性支出，回款是里程碑制 + 账期。
        一个毛利率 30% 的项目，完全可能在第四个月付不出工资。

        三样东西必须分开给，混起来这套数就开始骗人：
        · **已开票未回款** —— 按到期日落月；
        · **预计达成** —— 按入组速度推，达成月 + 账期；
        · **记录缺口**（已达成但没进开票队列）—— **单列，不进现金**。它不是未来收入，钱本来就该收到了。

        另给一份压力情景：逾期的再拖 3 个月、预计的延后 1 个月。不是悲观 —— 逾期之所以逾期，恰恰是因为对方还没打算付。
      x-layer: L1
      parameters:
        - name: months
          in: query
          required: false
          description: 默认 6
          schema:
            type: integer
            minimum: 1
            maximum: 12
      responses:
        '200':
          description: 现金流预测
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashForecast'
        '401':
          description: 未认证
