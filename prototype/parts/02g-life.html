   此前 06-sites 的推进按钮只有一句 ss.st=next，没有任何前置校验。 */
function closeGate(ss){
  const id = ss.id, g = [];
  const inTrial = SUBJ.filter(s=>s.ss===id && s.st!=="已出组" && s.st!=="筛败" && s.st!=="已脱落");
  if(inTrial.length) g.push({t:`仍有 ${inTrial.length} 例受试者在组未出组`, v:"subj"});
  const q = QUERIES.filter(x=>x.ss===id && x.st!=="已关闭");
  if(q.length) g.push({t:`${q.length} 条数据质疑未关闭`, v:"query"});
  const qi = ISSUES.filter(x=>x.ss===id && x.st!=="已关闭");
  if(qi.length) g.push({t:`${qi.length} 项质量事件未关闭`, v:"qa"});
  const ip = (typeof IP!=="undefined"? IP:[]).filter(r=>r.ss===id);
  const unbal = ip.filter(r=>ipM(r).diff!==0);
  if(unbal.length) g.push({t:`${unbal.length} 批药品数量不平衡`, v:"material"});
  const undest = ip.filter(r=>r.ret > r.dest);
  if(undest.length) g.push({t:`${undest.length} 批回收药品未完成销毁登记`, v:"material"});
  const sp = (typeof SPEC!=="undefined"? SPEC:[]).filter(r=>r.ss===id && r.st!=="已回执");
  if(sp.length) g.push({t:`${sp.length} 份生物样本链未闭环`, v:"material"});
  const pay = PAY.filter(p=>p.ss===id && (p.st!=="已发放" || !p.rc));
  if(pay.length) g.push({t:`${pay.length} 笔受试者补偿未发放或缺签收凭证`, v:"pay"});
  const eth = ETHICS.filter(e=>e.ss===id && e.kind==="结题报告" && e.st!=="已批准");
  if(!ETHICS.some(e=>e.ss===id && e.kind==="结题报告")) g.push({t:"未向伦理递交结题报告", v:"ethics"});
  else if(eth.length) g.push({t:"结题报告尚未获伦理批准", v:"ethics"});
  return g;
}
