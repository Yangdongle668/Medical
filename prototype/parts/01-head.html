<title>临床中心台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* ── Tokens ───────────────────────────────────────────────────────── */
:root{
  --ground:#F1F4F6; --surface:#FFFFFF; --surface-2:#F7F9FA; --surface-3:#ECF1F4;
  --ink:#12222D; --ink-2:#46596A; --ink-3:#5D7382;
  --line:#DBE3E9; --line-2:#C4D1DA; --grid:rgba(22,103,176,.055);
  --accent:#1667B0; --accent-ink:#FFFFFF; --accent-soft:#E7F0F8; --accent-line:#B9D3E9;
  --good:#1D7A4F; --good-soft:#E4F1EA; --warn:#A66A0B; --warn-soft:#FAF0DE;
  --crit:#C0342E; --crit-soft:#FBE9E8;
  --s1:#1667B0; --s2:#C85A24; --s3:#1A8F7A; --s4:#7E4FC0; --s5:#B8244A;
  --plan:#8DA3B2;
  --shadow:0 1px 2px rgba(18,34,45,.05), 0 8px 24px -12px rgba(18,34,45,.18);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ground:#0D171E; --surface:#16232C; --surface-2:#1B2A34; --surface-3:#22323E;
  --ink:#E6EDF2; --ink-2:#B3C4D0; --ink-3:#8CA1B0;
  --line:#263846; --line-2:#33495A; --grid:rgba(120,180,230,.05);
  --accent:#4A9AE0; --accent-ink:#0B1319; --accent-soft:#17313F; --accent-line:#2C516A;
  --good:#3FA875; --good-soft:#13291F; --warn:#D19A2E; --warn-soft:#2B2314;
  --crit:#E0655E; --crit-soft:#301B1A;
  --s1:#3D93E0; --s2:#D46F30; --s3:#1B9C81; --s4:#9B72DC; --s5:#D9506B;
  --plan:#6B8494;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#0D171E; --surface:#16232C; --surface-2:#1B2A34; --surface-3:#22323E;
  --ink:#E6EDF2; --ink-2:#B3C4D0; --ink-3:#8CA1B0;
  --line:#263846; --line-2:#33495A; --grid:rgba(120,180,230,.05);
  --accent:#4A9AE0; --accent-ink:#0B1319; --accent-soft:#17313F; --accent-line:#2C516A;
  --good:#3FA875; --good-soft:#13291F; --warn:#D19A2E; --warn-soft:#2B2314;
  --crit:#E0655E; --crit-soft:#301B1A;
  --s1:#3D93E0; --s2:#D46F30; --s3:#1B9C81; --s4:#9B72DC; --s5:#D9506B;
  --plan:#6B8494;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}

/* ── Base ─────────────────────────────────────────────────────────── */
*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans","PingFang SC","Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC",sans-serif;
  font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.01em}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
::selection{background:var(--accent-soft);color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ── Shell ────────────────────────────────────────────────────────── */
.app{position:relative;z-index:1;display:grid;grid-template-columns:224px 1fr;min-height:100vh}
.rail{
  border-right:1px solid var(--line);background:var(--surface);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{padding:16px 16px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.brand-mark{
  width:26px;height:26px;flex:none;border:1.5px solid var(--accent);border-radius:3px;
  display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--accent);
  font-family:"IBM Plex Mono",monospace;background:var(--accent-soft);
}
.brand-name{font-size:14.5px;font-weight:700;letter-spacing:.01em;line-height:1.3}
.brand-sub{font-size:10px;color:var(--ink-3);letter-spacing:.09em;text-transform:uppercase;font-family:"IBM Plex Mono",monospace}
.nav{padding:10px 8px;flex:1}
.nav-group{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);padding:12px 10px 5px}
.nav-item{
  display:flex;align-items:center;gap:9px;width:100%;padding:7px 10px;border:0;background:none;
  border-radius:3px;cursor:pointer;text-align:left;color:var(--ink-2);font-size:13.5px;position:relative;
}
.nav-item:hover{background:var(--surface-3);color:var(--ink)}
.nav-item[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item[aria-current="true"]::before{content:"";position:absolute;left:-8px;top:6px;bottom:6px;width:2px;background:var(--accent)}
.nav-ic{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.nav-badge{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:10px;padding:1px 5px;border-radius:2px;background:var(--crit-soft);color:var(--crit);font-weight:600}
.rail-foot{padding:10px 14px 14px;border-top:1px solid var(--line);font-size:10.5px;color:var(--ink-3);line-height:1.5}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  padding:10px 22px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;
}
.crumb{font-size:12px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
.crumb b{color:var(--ink);font-weight:600}
.topbar-sp{flex:1}
.demo-tag{
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 8px;border:1px dashed var(--warn);color:var(--warn);border-radius:2px;background:var(--warn-soft);
}
.content{padding:20px 22px 60px;max-width:1560px;width:100%}
.view-head{margin-bottom:18px}
.view-head h1{font-size:21px}
.view-head p{margin:5px 0 0;color:var(--ink-3);font-size:13px;max-width:76ch}

/* ── Controls ─────────────────────────────────────────────────────── */
.sel,.inp{
  font:inherit;font-size:12.5px;padding:5px 9px;border:1px solid var(--line-2);border-radius:3px;
  background:var(--surface);color:var(--ink);
}
.inp::placeholder{color:var(--ink-3)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:3px;overflow:hidden;background:var(--surface)}
.seg button{
  border:0;background:none;padding:5px 11px;font-size:12px;cursor:pointer;color:var(--ink-2);
  border-right:1px solid var(--line);font-family:"IBM Plex Mono",monospace;
}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.seg button:not([aria-pressed="true"]):hover{background:var(--surface-3)}
.btn{
  border:1px solid var(--line-2);background:var(--surface);border-radius:3px;padding:5px 11px;
  font-size:12.5px;cursor:pointer;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{background:var(--surface-3);color:var(--ink)}
.btn-p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn-p:hover{background:var(--accent);filter:brightness(1.08);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{
  border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:3px 10px;
  font-size:11.5px;cursor:pointer;color:var(--ink-2);font-family:"IBM Plex Mono",monospace;
}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.chip:not([aria-pressed="true"]):hover{background:var(--surface-3)}

/* ── Cards & grid ─────────────────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:3px}
.card-h{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-h h3{font-size:13.5px;white-space:nowrap}
.card-h .sub{font-size:11px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
.card-h .sp{flex:1}
.card-b{padding:14px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:2fr 1fr}
.g12{grid-template-columns:1fr 2fr}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ── KPI tiles ────────────────────────────────────────────────────── */
.kpi{
  background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:12px 13px;
  cursor:pointer;text-align:left;width:100%;display:block;position:relative;transition:border-color .12s;
}
.kpi:hover{border-color:var(--accent-line)}
.kpi-l{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;display:flex;align-items:center;gap:5px}
.kpi-v{font-size:27px;font-weight:600;margin-top:5px;line-height:1.05;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi-v small{font-size:13px;font-weight:400;color:var(--ink-3);margin-left:2px}
.kpi-f{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:7px}
.kpi-d{font-size:11px;font-family:"IBM Plex Mono",monospace;display:flex;align-items:center;gap:3px}
.kpi-note{font-size:10.5px;color:var(--ink-3);margin-top:3px}

/* ── Status atoms ─────────────────────────────────────────────────── */
.pill{
  display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1.5px 7px;border-radius:2px;
  font-family:"IBM Plex Mono",monospace;font-weight:500;white-space:nowrap;border:1px solid transparent;
}
.p-good{background:var(--good-soft);color:var(--good);border-color:color-mix(in srgb,var(--good) 28%,transparent)}
.p-warn{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 28%,transparent)}
.p-crit{background:var(--crit-soft);color:var(--crit);border-color:color-mix(in srgb,var(--crit) 28%,transparent)}
.p-neut{background:var(--surface-3);color:var(--ink-2);border-color:var(--line)}
.p-acc{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.dot{width:6px;height:6px;border-radius:99px;flex:none;display:inline-block}
.t-good{color:var(--good)} .t-warn{color:var(--warn)} .t-crit{color:var(--crit)} .t-mut{color:var(--ink-3)}
.stripe{position:absolute;left:0;top:0;bottom:0;width:2px}

/* ── Tables ───────────────────────────────────────────────────────── */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:640px}
th{
  text-align:left;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-3);font-weight:500;padding:7px 10px;
  border-bottom:1px solid var(--line-2);white-space:nowrap;position:sticky;top:0;background:var(--surface);
}
th.s{cursor:pointer;user-select:none}
th.s:hover{color:var(--ink)}
th .ar{opacity:.4;margin-left:2px}
th[aria-sort] .ar{opacity:1;color:var(--accent)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.clk{cursor:pointer}
tr.clk:hover td{background:var(--surface-2)}
.ta-r{text-align:right}
.tnum{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.t-main{font-weight:500}
.t-sub{font-size:11px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}

/* ── Charts ───────────────────────────────────────────────────────── */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.gridline{stroke:var(--line);stroke-width:1}
.axis-t{fill:var(--ink-3);font-size:10px;font-family:"IBM Plex Mono",monospace}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2);align-items:center}
.legend i{width:11px;height:3px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:middle}
.legend .dash{height:0;border-top:2px dashed currentColor;opacity:.7}
.tip{
  position:fixed;z-index:200;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);
  border-radius:3px;padding:7px 9px;font-size:11.5px;box-shadow:var(--shadow);opacity:0;transition:opacity .1s;
  max-width:250px;
}
.tip.on{opacity:1}
.tip-t{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.tip-r{display:flex;align-items:center;gap:7px;justify-content:space-between;line-height:1.7}
.tip-r b{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-weight:600}
.bartrack{background:var(--surface-3);border-radius:2px;overflow:hidden;position:relative}
.barfill{height:100%;border-radius:0 2px 2px 0}

/* ── Drawer / modal ───────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(10,20,28,.42);z-index:100;opacity:0;transition:opacity .16s}
.scrim.on{opacity:1}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(560px,94vw);background:var(--surface);z-index:101;
  border-left:1px solid var(--line-2);transform:translateX(100%);transition:transform .2s cubic-bezier(.3,.7,.3,1);
  display:flex;flex-direction:column;box-shadow:var(--shadow);
}
.drawer.on{transform:translateX(0)}
.drawer-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.drawer-b{padding:16px 18px 40px;overflow-y:auto;flex:1}
.modal{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-48%) scale(.98);z-index:101;
  width:min(460px,94vw);background:var(--surface);border:1px solid var(--line-2);border-radius:4px;
  opacity:0;transition:opacity .14s,transform .14s;box-shadow:var(--shadow);
}
.modal.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.x{border:0;background:none;cursor:pointer;color:var(--ink-3);font-size:18px;line-height:1;padding:2px 5px;border-radius:2px}
.x:hover{background:var(--surface-3);color:var(--ink)}

/* ── Toast ────────────────────────────────────────────────────────── */
.toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:7px;align-items:center}
.toast{
  background:var(--ink);color:var(--ground);padding:8px 14px;border-radius:3px;font-size:12.5px;
  box-shadow:var(--shadow);animation:tin .22s ease-out;display:flex;gap:8px;align-items:center;max-width:88vw;
}
.toast i{width:6px;height:6px;border-radius:99px;background:var(--good);flex:none}
.toast.warn i{background:var(--warn)} .toast.crit i{background:var(--crit)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ── Misc ─────────────────────────────────────────────────────────── */
.section-t{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
.hr{height:1px;background:var(--line);border:0;margin:14px 0}
.kv{display:grid;grid-template-columns:88px 1fr;gap:5px 12px;font-size:12.5px}
.kv dt{color:var(--ink-3);font-size:11.5px}
.kv dd{margin:0;font-family:"IBM Plex Mono",monospace}
.empty{padding:28px;text-align:center;color:var(--ink-3);font-size:12.5px}
.note{font-size:11.5px;color:var(--ink-3);line-height:1.6}
.formula{
  background:var(--surface-2);border:1px solid var(--line);border-left:2px solid var(--accent);
  padding:9px 11px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-2);
  line-height:1.75;overflow-x:auto;border-radius:0 3px 3px 0;white-space:pre-wrap;
}
input[type=range]{width:100%;accent-color:var(--accent);height:18px}
.slider-h{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;margin-bottom:1px}
.slider-h b{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--accent);font-weight:600}
.field{margin-bottom:13px}
.cbx{display:flex;gap:9px;align-items:flex-start;padding:7px 0;cursor:pointer;font-size:12.5px;line-height:1.5}
.cbx input{margin:3px 0 0;accent-color:var(--accent);flex:none;width:14px;height:14px}
.cbx.done span{color:var(--ink-3);text-decoration:line-through}

@media(max-width:1180px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g21,.g12,.g3{grid-template-columns:1fr}
}
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .brand{border-bottom:0;border-right:1px solid var(--line);white-space:nowrap}
  .nav{display:flex;gap:4px;padding:8px}
  .nav-group,.rail-foot{display:none}
  .nav-item{white-space:nowrap;padding:6px 9px}
  .nav-item[aria-current="true"]::before{display:none}
  .g4,.g2{grid-template-columns:1fr}
  .content{padding:14px 12px 50px}
  .topbar{padding:9px 12px}
}
</style>
