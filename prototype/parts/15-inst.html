<script>
"use strict";
/* ════════════════════════════════════════════════════════════════════
   机构端 —— 医院药物临床试验机构办公室的「机构老师」。
   他不是 CRO/SMO 的员工，是医院方的守门人与质量责任人：
   立项受理 · 机构质控 · 人员备案准入 · 文件归档。

   权限边界比内部员工更窄，不是更宽：
   只看本院、只看质量与合规，看不到任何成本、毛利、人天与利用率。
   ════════════════════════════════════════════════════════════════════ */

const instSites = ()=>SITES.filter(s=>s.hosp===PERSONA().hosp);
const instIds   = ()=>new Set(instSites().map(s=>s.id));
const qcOpen    = ()=>QC.filter(q=>instIds().has(q.ss)&&q.st!=="已关闭");
const qcFindOpen= ()=>qcOpen().flatMap(q=>q.findings.filter(f=>f.st!=="已关闭"));
const acOpen    = ()=>ACCEPT.filter(a=>a.hosp===PERSONA().hosp&&a.st!=="已受理");
const regOpen   = ()=>REG.filter(r=>instIds().has(r.ss)&&r.st!=="已准入");

const NOTICE = `<div style="border:1px dashed var(--line-2);background:var(--surface-2);padding:9px 12px;border-radius:3px;font-size:11.5px;color:var(--ink-3);line-height:1.6">
  <b style="color:var(--ink-2)">机构端可见范围</b>：仅本机构承接的项目与中心，内容限于质量、合规、人员资质与文件。
  受托方（CRO/SMO）的成本、毛利、人天与人员利用率<b>不对机构开放</b> —— 那是受托方的商业信息，
  与机构履行监管职责无关。同样，机构的内部质控底稿也不向受托方开放全文，只发送质控意见与整改要求。</div>`;

/* ── 机构工作台 ── */
VIEWS.inst = box=>{
  const ss=instSites(), fo=qcFindOpen(), ac=acOpen(), rg=regOpen();
  const iss=ISSUES.filter(i=>instIds().has(i.ss)&&i.st!=="已关闭");
  const bySrc={};
  ISSUES.filter(i=>instIds().has(i.ss)).forEach(i=>bySrc[i.src]=(bySrc[i.src]||0)+1);
  const overdue=fo.filter(f=>days(TODAY,f.due)<0);

  box.innerHTML=`
  <div class="grid g4" style="gap:10px;margin-bottom:12px">
    ${[["本院在研项目",new Set(ss.map(s=>s.sid)).size,"个","var(--ink)"],
       ["待受理立项",ac.length,"项",ac.length?"var(--warn)":"var(--good)"],
       ["质控待整改",fo.length,"项",overdue.length?"var(--crit)":fo.length?"var(--warn)":"var(--good)"],
       ["人员资质异常",rg.length,"人",rg.length?"var(--crit)":"var(--good)"]
     ].map(([l,v,u,c])=>`<div class="card" style="padding:12px 13px">
        <div class="kpi-l">${esc(l)}</div>
        <div class="num" style="font-size:24px;margin-top:3px;color:${c}">${v}<small style="font-size:12px;color:var(--ink-3);margin-left:2px">${u}</small></div></div>`).join("")}
  </div>
  <div class="grid g21" style="gap:12px;margin-bottom:12px">
    <div class="card">
      <div class="card-h"><h3>本院在研中心</h3><span class="sub">仅显示质量与进度，不含受托方财务信息</span></div>
      <div class="tw"><table style="min-width:640px">
        <thead><tr><th>项目 / 科室</th><th>PI</th><th>状态</th><th class="ta-r">已入组</th>
          <th class="ta-r">未关闭事件</th><th>最近机构质控</th></tr></thead>
        <tbody>${ss.map(s=>{const q=QC.filter(x=>x.ss===s.id).sort((a,b)=>b.date.localeCompare(a.date))[0];
          const n=ISSUES.filter(i=>i.ss===s.id&&i.st!=="已关闭").length;
          return `<tr><td><div class="t-main">${esc(S[s.sid].short)}</div>
              <div class="t-sub">${esc(s.dept)} · ${esc(S[s.sid].phase)} · ${esc(s.sid)}</div></td>
            <td>${esc(s.pi)}</td>
            <td><span class="pill ${s.st==="入组中"?"p-acc":"p-neut"}">${esc(s.st)}</span></td>
            <td class="tnum">${s.enrolled}<span class="t-mut"> / ${s.contracted}</span></td>
            <td class="ta-r">${n?`<span class="pill p-crit">${n}</span>`:`<span class="pill p-good">0</span>`}</td>
            <td class="t-sub">${q?`${esc(q.date)}<div class="t-sub">${esc(q.round)} · ${esc(q.st)}</div>`
              :`<span class="t-mut">未开展</span>`}</td></tr>`;}).join("")}</tbody>
      </table></div>
    </div>
    <div class="card">
      <div class="card-h"><h3>问题发现来源</h3><span class="sub">分布本身就是质量指标</span></div>
      <div class="card-b">
        <div id="c-src"></div>
        <div class="note" style="margin-top:11px;border-top:1px solid var(--line);padding-top:9px">
          机构质控与中心自查发现得越多，说明前置防线在起作用；如果问题主要由<b>申办方稽查或药监核查</b>发现，
          说明一级、二级质控形同虚设 —— 那时代价已经不是整改，而是数据被剔除。</div>
      </div>
    </div>
  </div>
  <div class="grid g2" style="gap:12px;margin-bottom:12px">
    <div class="card">
      <div class="card-h"><h3>待办：整改跟踪</h3><span class="sp"></span>
        <button class="btn" data-nav="instqc">机构质控 →</button></div>
      <div class="card-b" style="padding:0">
        ${fo.length? fo.map(f=>{const od=days(TODAY,f.due)<0;
          return `<div style="padding:10px 14px 10px 16px;border-bottom:1px solid var(--line);position:relative">
            <span class="stripe" style="background:var(--${od?"crit":SEV[f.sev].k})"></span>
            <div class="row" style="gap:6px"><span class="pill p-${SEV[f.sev].k}">${esc(f.sev)}</span>
              <b style="font-size:12.5px;font-weight:500">${esc(f.item)}</b>
              ${od?`<span class="pill p-crit">整改逾期 ${Math.abs(days(TODAY,f.due))} 天</span>`:""}</div>
            <div class="note" style="margin-top:3px;color:var(--ink-2)">${esc(f.desc)}</div>
            <div class="note" style="margin-top:2px">责任人 ${esc(f.resp)}｜整改期限 ${esc(f.due)}｜${esc(f.st)}</div>
          </div>`;}).join("") : `<div class="empty">无待整改项</div>`}
      </div>
    </div>
    <div class="card">
      <div class="card-h"><h3>待办：受理与备案</h3><span class="sp"></span>
        <button class="btn" data-nav="instac">立项受理 →</button>
        <button class="btn" data-nav="instreg">人员备案 →</button></div>
      <div class="card-b" style="padding:0">
        ${ac.map(a=>`<div style="padding:10px 14px;border-bottom:1px solid var(--line)">
          <div class="row" style="gap:6px"><span class="pill p-warn">${esc(a.st)}</span>
            <b style="font-size:12.5px;font-weight:500">${esc(a.drug)}</b></div>
          <div class="note" style="margin-top:3px">${esc(a.sponsor)}｜递交 ${esc(a.sub)} · ${esc(a.by)}｜
            材料 ${a.docs.filter(d=>d[1]).length}/${a.docs.length} 齐备</div></div>`).join("")}
        ${rg.map(r=>`<div style="padding:10px 14px;border-bottom:1px solid var(--line)">
          <div class="row" style="gap:6px"><span class="pill ${r.st==="资质缺失"?"p-crit":"p-warn"}">${esc(r.st)}</span>
            <b style="font-size:12.5px;font-weight:500">${esc(r.who)}</b>
            <span class="t-sub">${esc(r.role)} · ${esc(r.org)}</span></div>
          <div class="note" style="margin-top:3px">${esc(r.note)}</div></div>`).join("")}
        ${!ac.length&&!rg.length?`<div class="empty">无待办</div>`:""}
      </div>
    </div>
  </div>
  ${NOTICE}`;

  const order=["机构质控","中心自查","内部监查","申办方稽查","药监核查"];
  const cols={"机构质控":"var(--s1)","中心自查":"var(--s3)","内部监查":"var(--s2)",
              "申办方稽查":"var(--s4)","药监核查":"var(--s5)"};
  stacked($("#c-src"), order.filter(k=>bySrc[k]).map(k=>({n:k,v:bySrc[k],c:cols[k]})),
    {h:28, fmt:v=>v+" 项"});
};

/* ── 立项受理：医院侧的形式审查 ── */
VIEWS.instac = box=>{
  const list=ACCEPT.filter(a=>a.hosp===PERSONA().hosp);
  box.innerHTML=`
  <div class="stack" style="gap:12px">
    ${list.length? list.map(a=>{const ok=a.docs.filter(d=>d[1]).length, miss=a.docs.filter(d=>!d[1]);
      return `<div class="card">
        <div class="card-h"><span class="mono" style="font-size:11px;color:var(--ink-3)">${esc(a.id)}</span>
          <h3>${esc(a.drug)}</h3>
          <span class="sub">${esc(a.sponsor)} · ${esc(S[a.sid]?S[a.sid].phase:"—")}</span>
          <span class="sp"></span>
          <span class="pill ${a.st==="已受理"?"p-good":miss.length?"p-warn":"p-acc"}">${esc(a.st)}</span></div>
        <div class="card-b">
          <div class="row" style="justify-content:space-between;margin-bottom:10px">
            <span class="note">递交方 ${esc(a.by)}（受托方）｜递交日期 ${esc(a.sub)}</span>
            <span class="note">材料齐备 ${ok} / ${a.docs.length}</span></div>
          <div class="bartrack" style="height:5px;margin-bottom:12px">
            <div class="barfill" style="width:${ok/a.docs.length*100}%;background:${miss.length?"var(--warn)":"var(--good)"};height:100%"></div></div>
          <div class="section-t">立项材料形式审查</div>
          <div class="grid g2" style="gap:0 16px">
            ${a.docs.map((d,k)=>`<label class="cbx ${d[1]?"done":""}" style="border-bottom:1px solid var(--line)">
              <input type="checkbox" data-doc="${esc(a.id)}:${k}" ${d[1]?"checked":""}><span>${esc(d[0])}</span></label>`).join("")}
          </div>
          ${a.st!=="已受理"?`<div class="row" style="margin-top:12px">
            <button class="btn btn-p" data-acok="${esc(a.id)}" ${miss.length?"disabled":""}>予以受理</button>
            <button class="btn" data-acno="${esc(a.id)}">补正通知</button>
            <span class="note">${miss.length?`尚缺 ${miss.length} 项材料，不予受理：${esc(miss.map(d=>d[0]).join("、"))}`
              :"材料齐备，可出具受理通知并转伦理审查"}</span></div>`
          :`<div class="row" style="margin-top:12px"><span class="pill p-good">已受理，受理号 ${esc(a.id)}｜已转伦理委员会</span></div>`}
        </div>
      </div>`;}).join("") : `<div class="card"><div class="empty">当前无递交待受理的项目</div></div>`}
  </div>
  <p class="note" style="margin-top:12px">形式审查只看材料是否齐备与合规，不评价科学性 —— 科学性由伦理委员会与专业组判断。
    受理是医院承接项目的第一道闸门：材料不齐就受理，后面所有环节都会带着这个缺口往下走。</p>
  ${NOTICE}`;
  box.addEventListener("change",e=>{
    const c=e.target.closest("[data-doc]"); if(!c) return;
    const [id,k]=c.dataset.doc.split(":"); const a=ACCEPT.find(x=>x.id===id);
    a.docs[+k][1]=c.checked?1:0; render();
  });
  box.addEventListener("click",e=>{
    const ok=e.target.closest("[data-acok]"), no=e.target.closest("[data-acno]");
    if(ok){ const a=ACCEPT.find(x=>x.id===ok.dataset.acok); a.st="已受理";
      toast(`${a.drug} 已受理（${a.id}），已出具受理通知并转伦理审查`); render(); return; }
    if(no){ const a=ACCEPT.find(x=>x.id===no.dataset.acno);
      const miss=a.docs.filter(d=>!d[1]).map(d=>d[0]);
      a.st="待补正";
      toast(`已向 ${a.by} 发出补正通知：${miss.join("、")||"无缺项"}`,"warn"); render(); }
  });
};

/* ── 机构质控：医院方对项目的质量反馈闭环 ── */
VIEWS.instqc = box=>{
  const list=QC.filter(q=>instIds().has(q.ss)).sort((a,b)=>b.date.localeCompare(a.date));
  const fo=qcFindOpen();
  box.innerHTML=`
  <div class="grid g4" style="gap:10px;margin-bottom:12px">
    ${[["累计质控",list.length,"轮","var(--ink)"],
       ["待整改发现",fo.length,"项",fo.length?"var(--warn)":"var(--good)"],
       ["整改逾期",fo.filter(f=>days(TODAY,f.due)<0).length,"项",fo.filter(f=>days(TODAY,f.due)<0).length?"var(--crit)":"var(--good)"],
       ["严重及以上",fo.filter(f=>f.sev!=="一般").length,"项",fo.filter(f=>f.sev!=="一般").length?"var(--crit)":"var(--good)"]
     ].map(([l,v,u,c])=>`<div class="card" style="padding:12px 13px">
        <div class="kpi-l">${esc(l)}</div>
        <div class="num" style="font-size:24px;margin-top:3px;color:${c}">${v}<small style="font-size:12px;color:var(--ink-3);margin-left:2px">${u}</small></div></div>`).join("")}
  </div>
  <div class="row" style="margin-bottom:12px">
    <button class="btn btn-p" id="qc-new">+ 发起新一轮机构质控</button>
    <span class="note">质控分三级：一级为研究者自查，二级为机构抽查，三级为申办方稽查与药监核查</span>
  </div>
  <div class="stack" style="gap:12px">
    ${list.map(q=>{const s=site(q.ss), open=q.findings.filter(f=>f.st!=="已关闭").length;
      return `<div class="card">
        <div class="card-h"><span class="mono" style="font-size:11px;color:var(--ink-3)">${esc(q.id)}</span>
          <h3>${esc(q.round)}</h3>
          <span class="sub">${esc(S[s.sid].short)} · ${esc(s.dept)} · ${esc(q.date)} · 质控员 ${esc(q.by)}</span>
          <span class="sp"></span>
          <span class="pill ${q.st==="已关闭"?"p-good":open?"p-warn":"p-acc"}">${esc(q.st)}${open?` · ${open} 项待整改`:""}</span></div>
        <div class="card-b">
          <div class="note" style="margin-bottom:10px"><b>质控范围</b>：${esc(q.scope)}</div>
          <div class="section-t">质控意见与整改跟踪</div>
          ${q.findings.map((f,k)=>{const od=f.st!=="已关闭"&&days(TODAY,f.due)<0;
            return `<div style="border:1px solid var(--line);border-left:2px solid var(--${f.st==="已关闭"?"good":od?"crit":SEV[f.sev].k});border-radius:0 3px 3px 0;padding:10px 12px;margin-bottom:8px">
              <div class="row" style="gap:6px">
                <span class="pill p-${f.st==="已关闭"?"good":SEV[f.sev].k}">${esc(f.sev)}</span>
                <b style="font-size:12.5px">${esc(f.item)}</b>
                ${f.iss?`<span class="mono" style="font-size:10.5px;color:var(--ink-3)">→ ${esc(f.iss)}</span>`:""}
                <span class="sp"></span>
                <span class="pill ${f.st==="已关闭"?"p-good":od?"p-crit":"p-neut"}">${esc(f.st)}${od?` · 逾期 ${Math.abs(days(TODAY,f.due))} 天`:""}</span></div>
              <div style="font-size:12.5px;margin-top:5px;color:var(--ink-2);line-height:1.6">${esc(f.desc)}</div>
              <div class="note" style="margin-top:3px">责任人 ${esc(f.resp)}（受托方）｜整改期限 ${esc(f.due)}</div>
              ${f.reply?`<div style="margin-top:8px;background:var(--surface-2);border:1px solid var(--line);padding:8px 10px;border-radius:3px;font-size:12px;color:var(--ink-2);line-height:1.6">
                <b style="color:var(--ink)">整改回复（${esc(f.resp)}）</b><br>${esc(f.reply)}</div>`:""}
              ${f.st==="待复核"?`<div class="row" style="margin-top:9px">
                <button class="btn btn-p" data-qcok="${esc(q.id)}:${k}">复核通过并关闭</button>
                <button class="btn" data-qcno="${esc(q.id)}:${k}">整改不充分，退回</button></div>`:""}
              ${f.st==="待整改"?`<div class="note" style="margin-top:7px">等待受托方提交整改回复 —— 该发现已同步到责任人的「我的整改」待办。</div>`:""}
            </div>`;}).join("")}
        </div>
      </div>`;}).join("")||`<div class="card"><div class="empty">尚未开展机构质控</div></div>`}
  </div>
  ${NOTICE}`;
  $("#qc-new").addEventListener("click", qcModal);
  box.addEventListener("click",e=>{
    const ok=e.target.closest("[data-qcok]"), no=e.target.closest("[data-qcno]");
    if(!ok&&!no) return;
    const [qid,k]=((ok||no).dataset.qcok||(ok||no).dataset.qcno).split(":");
    const q=QC.find(x=>x.id===qid), f=q.findings[+k];
    if(ok){ f.st="已关闭";
      if(f.iss){ const i=ISSUES.find(x=>x.id===f.iss); if(i) i.st="已关闭"; }
      if(q.findings.every(x=>x.st==="已关闭")) q.st="已关闭";
      toast(`${f.item} 整改复核通过，已关闭`);
    } else { f.st="待整改"; f.reply=null;
      toast(`${f.item} 整改不充分已退回 ${f.resp}，需重新提交`,"warn"); }
    render();
  });
};

/* ── 发起机构质控 ── */
function qcModal(){
  const ss=instSites();
  openLayer($("#drawer"),`
    <div class="drawer-h"><div style="flex:1">
      <div class="section-t" style="margin:0 0 3px">机构办公室</div>
      <h2 style="font-size:17px">发起机构质控</h2>
      <div class="note" style="margin-top:3px">逐项标记「符合 / 不符合」，不符合项将生成质控意见并派发整改</div>
    </div><button class="x" data-close aria-label="关闭">✕</button></div>
    <div class="drawer-b">
      <div class="field"><div class="slider-h"><label for="q-ss">受控中心</label></div>
        <select class="sel" id="q-ss" style="width:100%">${ss.map(s=>
          `<option value="${s.id}">${esc(S[s.sid].short)} · ${esc(s.dept)} · PI ${esc(s.pi)}</option>`).join("")}</select></div>
      <div class="field"><div class="slider-h"><label for="q-r">质控级别</label></div>
        <select class="sel" id="q-r" style="width:100%">
          <option>二级质控（机构抽查）</option><option>一级质控（研究者自查）</option>
          <option>专项质控（针对既往发现）</option></select></div>
      <div class="field"><div class="slider-h"><label for="q-n">抽查例数</label><b id="q-nv">5 例</b></div>
        <input type="range" id="q-n" min="1" max="20" step="1" value="5"></div>
      <div class="section-t">检查项</div>
      <div id="q-items">${QC_ITEMS.map((t,k)=>`
        <div style="border-bottom:1px solid var(--line);padding:9px 0">
          <div class="row" style="justify-content:space-between;gap:10px;align-items:flex-start">
            <div style="flex:1;font-size:12.5px;line-height:1.55">${esc(t)}</div>
            <div class="seg" style="flex:none">
              <button data-qi="${k}:ok" aria-pressed="true">符合</button>
              <button data-qi="${k}:no" aria-pressed="false">不符合</button></div>
          </div>
          <div id="qf-${k}" hidden style="margin-top:8px">
            <div class="row" style="gap:8px;margin-bottom:6px">
              <select class="sel" id="qs-${k}"><option>一般</option><option>严重</option><option>重大</option></select>
              <select class="sel" id="qr-${k}">${STAFF.filter(x=>x.role==="CRC"||x.role==="CRA")
                .map(x=>`<option>${esc(x.n)}</option>`).join("")}</select>
              <span class="note">严重程度 · 责任人</span>
            </div>
            <textarea class="qbox" id="qd-${k}" placeholder="写清发现的事实、涉及例数与依据，避免笼统表述。"></textarea>
          </div>
        </div>`).join("")}</div>
      <div class="row" style="margin-top:14px;justify-content:flex-end">
        <button class="btn" data-close>取消</button>
        <button class="btn btn-p" id="q-go">出具质控意见</button></div>
    </div>`);
  $("#q-n").addEventListener("input",e=>$("#q-nv").textContent=e.target.value+" 例");
  $("#q-items").addEventListener("click",e=>{
    const b=e.target.closest("[data-qi]"); if(!b) return;
    const [k,v]=b.dataset.qi.split(":");
    b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));
    $("#qf-"+k).hidden = v!=="no";
  });
  $("#q-go").addEventListener("click",()=>{
    const ssid=$("#q-ss").value, round=$("#q-r").value, n=+$("#q-n").value;
    const finds=[];
    QC_ITEMS.forEach((t,k)=>{
      const bad=$("#qf-"+k).hidden===false; if(!bad) return;
      const desc=$("#qd-"+k).value.trim();
      if(!desc) return;
      const sev=$("#qs-"+k).value, resp=$("#qr-"+k).value;
      const iid="QI-2026-0"+(160+ISSUES.length+finds.length);
      finds.push({item:t.split("：")[0], sev, desc, resp,
        due:new Date(Date.now()+14*864e5).toISOString().slice(0,10), st:"待整改", iss:iid});
      ISSUES.unshift({id:iid, src:"机构质控", ss:ssid, sev, type:"机构质控发现 · "+t.split("：")[0],
        found:TODAY, desc, capa:"（待受托方提交整改措施）", own:resp,
        due:new Date(Date.now()+14*864e5).toISOString().slice(0,10), st:"待整改", sla:null});
    });
    const qid="QC-2026-0"+(qcSeq++);
    QC.unshift({id:qid, ss:ssid, round, date:TODAY, by:PERSONA().n,
      scope:`随机抽取 ${n} 例受试者，覆盖 ${QC_ITEMS.length} 项检查内容`,
      st: finds.length? "待整改" : "已关闭", findings:finds});
    closeLayer();
    toast(finds.length
      ? `${qid} 质控意见已出具：${finds.length} 项不符合，已派发整改并同步至质量事件台账`
      : `${qid} 质控完成：全部检查项符合要求`, finds.length?"warn":"");
    setTimeout(render,220);
  });
}

/* ── 人员备案与准入：谁能进这家医院工作，由机构说了算 ── */
VIEWS.instreg = box=>{
  const list=REG.filter(r=>instIds().has(r.ss));
  box.innerHTML=`
  <div class="grid g4" style="gap:10px;margin-bottom:12px">
    ${[["备案人员",list.length,"人","var(--ink)"],
       ["已准入",list.filter(r=>r.st==="已准入").length,"人","var(--good)"],
       ["备案中",list.filter(r=>r.st==="备案中").length,"人",list.filter(r=>r.st==="备案中").length?"var(--warn)":"var(--good)"],
       ["资质缺失",list.filter(r=>r.st==="资质缺失").length,"人",list.filter(r=>r.st==="资质缺失").length?"var(--crit)":"var(--good)"]
     ].map(([l,v,u,c])=>`<div class="card" style="padding:12px 13px">
        <div class="kpi-l">${esc(l)}</div>
        <div class="num" style="font-size:24px;margin-top:3px;color:${c}">${v}<small style="font-size:12px;color:var(--ink-3);margin-left:2px">${u}</small></div></div>`).join("")}
  </div>
  <div class="card" style="margin-bottom:12px">
    <div class="card-h"><h3>人员备案台账</h3><span class="sp"></span>
      <span class="sub">GCP 证书、方案培训、授权分工表 —— 核查必查的三件套</span></div>
    <div class="tw"><table style="min-width:900px">
      <thead><tr><th>姓名</th><th>所属单位</th><th>角色</th><th>项目 / 科室</th><th>GCP 证书</th>
        <th>方案培训</th><th>门禁编号</th><th>状态</th><th></th></tr></thead>
      <tbody>${list.map((r,k)=>{const s=site(r.ss);
        const left=r.gcp!=="—"?days(TODAY,r.gcp):null;
        return `<tr>
          <td class="t-main">${esc(r.who)}</td>
          <td class="t-sub">${esc(r.org)}</td>
          <td><span class="pill p-neut">${esc(r.role)}</span></td>
          <td class="t-sub">${esc(S[s.sid].short)}<div class="t-sub">${esc(s.dept)}</div></td>
          <td>${r.gcp==="—"?`<span class="pill p-crit">未提供</span>`
            :`<span class="pill ${left<70?"p-crit":left<180?"p-warn":"p-neut"}">${esc(r.gcp)}</span>`}</td>
          <td class="t-sub">${r.train==="—"?`<span class="pill p-warn">未完成</span>`:esc(r.train)}</td>
          <td class="mono" style="font-size:11.5px">${esc(r.badge)}</td>
          <td><span class="pill ${r.st==="已准入"?"p-good":r.st==="资质缺失"?"p-crit":"p-warn"}">${esc(r.st)}</span></td>
          <td class="ta-r">${r.st==="已准入"
            ? `<button class="btn" data-sus="${k}">暂停权限</button>`
            : `<button class="btn btn-p" data-adm="${k}">准予准入</button>
               <button class="btn" data-ask="${k}">要求补材料</button>`}</td>
        </tr>`;}).join("")}</tbody>
    </table></div>
  </div>
  <div class="card" style="margin-bottom:12px">
    <div class="card-b">
      <div class="section-t">为什么这一页在机构端而不在受托方</div>
      <div class="note" style="line-height:1.75">
        CRC 由 SMO 派驻、CRA 由 CRO 派驻，但他们进的是<b>医院</b>的门、看的是<b>医院</b>的病历。
        谁能接触受试者源数据，是医院的责任，不是受托方能自行决定的事。<br>
        所以准入权在机构：GCP 证书未提供、方案培训未完成、未列入授权分工表的人员，
        机构有权拒绝其开展受试者相关工作 —— 上表中<b>周琳</b>就是典型：她已参与 3 例访视，
        但资质材料缺失，这在药监核查中属于必查且必然被记录的严重发现。
      </div>
    </div>
  </div>
  ${NOTICE}`;
  box.addEventListener("click",e=>{
    const a=e.target.closest("[data-adm]"), s=e.target.closest("[data-sus]"), q=e.target.closest("[data-ask]");
    if(a){ const r=list[+a.dataset.adm];
      if(r.gcp==="—"||r.train==="—"){ toast(`${r.who} 的 GCP 证书或方案培训记录缺失，不予准入`,"crit"); return; }
      r.st="已准入"; r.badge=r.badge==="—"?"XH-C-0"+(500+Math.floor(Math.random()*99)):r.badge;
      toast(`${r.who} 已准予准入，门禁编号 ${r.badge}`); render(); return; }
    if(s){ const r=list[+s.dataset.sus]; r.st="备案中";
      toast(`${r.who} 的中心权限已暂停，已通知受托方`,"warn"); render(); return; }
    if(q){ const r=list[+q.dataset.ask];
      toast(`已向 ${r.org} 发出材料补充通知：${r.gcp==="—"?"GCP 证书、":""}${r.train==="—"?"方案培训记录、":""}授权分工表`,"warn"); }
  });
};

/* ── 受托方侧的对侧：我的整改（CRC/CRA 收到机构质控意见后回复） ── */
VIEWS.capa = box=>{
  const me=PERSONA().n;
  const mine=ISSUES.filter(i=>i.own===me&&i.st!=="已关闭");
  const fromQC=QC.flatMap(q=>q.findings.map(f=>({q,f}))).filter(({f})=>f.resp===me&&f.st!=="已关闭");
  const overdue=mine.filter(i=>days(TODAY,i.due)<0);
  box.innerHTML=`
  <div class="grid g4" style="gap:10px;margin-bottom:12px">
    ${[["待我整改",mine.length,"项",mine.length?"var(--warn)":"var(--good)"],
       ["其中机构质控",fromQC.length,"项",fromQC.length?"var(--crit)":"var(--good)"],
       ["整改逾期",overdue.length,"项",overdue.length?"var(--crit)":"var(--good)"],
       ["最近到期",mine.length?mine.map(i=>i.due).sort()[0]:"—","","var(--ink)"]
     ].map(([l,v,u,c])=>`<div class="card" style="padding:12px 13px">
        <div class="kpi-l">${esc(l)}</div>
        <div class="num" style="font-size:${String(v).length>6?"15":"24"}px;margin-top:3px;color:${c}">${v}<small style="font-size:12px;color:var(--ink-3);margin-left:2px">${u}</small></div></div>`).join("")}
  </div>
  <div class="stack" style="gap:10px">
    ${fromQC.length? fromQC.map(({q,f},k)=>{const od=days(TODAY,f.due)<0;
      return `<div class="tcard ${od?"crit":SEV[f.sev].k}">
        <div class="tcard-h">
          <div style="flex:1;min-width:0">
            <div class="row" style="gap:6px">
              <span class="pill p-${SEV[f.sev].k}">${esc(f.sev)}</span>
              <b style="font-size:13px">${esc(f.item)}</b>
              <span class="mono" style="font-size:10.5px;color:var(--ink-3)">${esc(q.id)}</span>
              ${od?`<span class="pill p-crit">逾期 ${Math.abs(days(TODAY,f.due))} 天</span>`:""}</div>
            <div class="note" style="margin-top:4px;color:var(--ink-2)">${esc(f.desc)}</div>
            <div class="note" style="margin-top:2px">来源：${esc(q.round)} · ${esc(site(q.ss).hosp)}机构办 ${esc(q.by)}｜整改期限 ${esc(f.due)}</div>
          </div>
          <span class="pill ${f.st==="待复核"?"p-acc":"p-warn"}" style="flex:none">${esc(f.st)}</span>
        </div>
        <div style="padding:0 12px 12px 14px">
          ${f.st==="待整改"?`
            <textarea class="qbox" id="cp-${k}" placeholder="写清已采取的纠正措施、预防措施与完成证据，例如：3 例受试者已于 2026-08-25 重新签署 ICF V3.0 并上报伦理；中心 ICF 版本控制表已上墙，CRC 每周核对。"></textarea>
            <div class="row" style="margin-top:8px">
              <button class="btn btn-p" data-cp="${k}">提交整改回复</button>
              <span class="note">提交后转机构复核，复核通过才算关闭</span></div>`
          :`<div style="background:var(--surface-2);border:1px solid var(--line);padding:8px 10px;border-radius:3px;font-size:12px;color:var(--ink-2);line-height:1.6">
              <b style="color:var(--ink)">已提交整改回复</b><br>${esc(f.reply||"")}</div>
            <div class="note" style="margin-top:6px">等待 ${esc(site(q.ss).hosp)}机构办复核</div>`}
        </div></div>`;}).join("")
      : `<div class="card"><div class="empty">当前没有来自机构质控的整改要求</div></div>`}
  </div>
  ${mine.filter(i=>i.src!=="机构质控").length?`
    <div class="section-t" style="margin-top:16px">其他来源的质量事件（${mine.filter(i=>i.src!=="机构质控").length}）</div>
    <div class="card"><div class="card-b" style="padding:0">
      ${mine.filter(i=>i.src!=="机构质控").map(i=>`
        <div style="padding:10px 14px 10px 16px;border-bottom:1px solid var(--line);position:relative">
          <span class="stripe" style="background:var(--${SEV[i.sev].k})"></span>
          <div class="row" style="gap:6px"><span class="pill p-${SEV[i.sev].k}">${esc(i.sev)}</span>
            <b style="font-size:12.5px;font-weight:500">${esc(i.type)}</b>
            <span class="pill p-neut">来源 ${esc(i.src)}</span></div>
          <div class="note" style="margin-top:3px;color:var(--ink-2)">${esc(i.desc)}</div>
          <div class="note" style="margin-top:2px">CAPA 到期 ${esc(i.due)}｜${esc(i.st)}</div>
        </div>`).join("")}
    </div></div>`:""}`;
  box.addEventListener("click",e=>{
    const b=e.target.closest("[data-cp]"); if(!b) return;
    const {q,f}=fromQC[+b.dataset.cp], v=$("#cp-"+b.dataset.cp).value.trim();
    if(v.length<15){ toast("整改回复需写清纠正措施、预防措施与完成证据（至少 15 个字）","crit"); return; }
    f.reply=v; f.st="待复核";
    if(f.iss){ const i=ISSUES.find(x=>x.id===f.iss); if(i){ i.st="待验证"; i.capa=v; } }
    toast(`整改回复已提交，转 ${site(q.ss).hosp}机构办复核`); render();
  });
};
</script>
