};
function PERSONA(){
  const m = ME();
  if(!m) return {k:"boss", n:"—", title:"未登录", role:"—", scope:"—"};
  const r = ROLE_DEF[m.role];
  return {k:m.role, n:m.n, title:r.t, role:r.t.replace(/\s*[（(].*/,"").split(" ").pop() || r.t,
          scope:(SCOPE_DESC[r.rows]||SCOPE_DESC.none)(m), hosp:m.hosp, u:m.u};
}

/* 行维度权限：ROLE_DEF[role].rows 是唯一判定处，改权限立刻改数据范围 */
function myScope(){
  const m = ME(); if(!m) return [];
  const r = ROLE_DEF[m.role];
  switch(r.rows){
    case "all":      return SITES;
    case "team":   { const g = groupOf(m.n); return g ? SITES.filter(s=>g.studies.includes(s.sid)) : []; }
    case "hospital": return SITES.filter(s=>s.hosp===m.hosp);
    case "pi":       return SITES.filter(s=>s.pi===m.n);
    case "assigned":{ const st = staff(m.n); return st ? SITES.filter(s=>st.sites.includes(s.id)) : []; }
    default:         return [];
  }
}
function scope(){
  const base = myScope();
  return state.study==="all" ? base : base.filter(s=>s.sid===state.study);
}
function scopeIds(){ return new Set(scope().map(s=>s.id)); }
function myTeam(){ return TEAM.members.map(staff); }

const myMenu = ()=>{
  const r = RD(); if(!r) return [];
  const out = [];
  GROUP_ORDER.forEach(g=>{
    const items = r.mods.filter(v=>N[v] && (MOD_GROUP[v]||"系统")===g);
    if(items.length) out.push({g, items});
  });
  const rest = r.mods.filter(v=>N[v] && !GROUP_ORDER.includes(MOD_GROUP[v]||"系统"));
  if(rest.length) out.push({g:"其他", items:rest});
  return out;
};
function renderNav(){
  const p = PERSONA();
  $("#nav").innerHTML = myMenu().map(g=>
    `<div class="nav-group">${esc(g.g)}</div>` + g.items.map(k=>{
      let b = 0;
      try { b = BADGE[k] ? BADGE[k]() : 0; } catch(_) { b = 0; }
      const d = N[k];
      return `<button class="nav-item" data-nav="${k}" aria-current="${state.view===k}">
        <svg class="nav-ic" viewBox="0 0 24 24">${d.ic}</svg><span>${esc(typeof d.t==="function"?d.t():d.t)}</span>
        ${b?`<span class="nav-badge">${b}</span>`:""}</button>`;
    }).join("")).join("");
  const per = $("#persona");
  if(per) per.innerHTML =
    `<div class="avatar">${esc(p.n.slice(0,1))}</div>
     <div><div class="n">${esc(p.n)}</div><div class="d">${esc(p.title)}</div></div>`;
}
const titleOf = v=>{ const t=TITLES[v]; return typeof t==="function"? t() : t; };
function renderTop(){
  const p = PERSONA(), [t] = titleOf(state.view);
  const studies = [...new Set(myScope().map(s=>s.sid))];
  $("#crumb").innerHTML = `恒济临床研究 / <b>${esc(t)}</b>`;
  $("#who").innerHTML =
    `<div class="avatar">${esc(p.n.slice(0,1))}</div>
     <div><b>${esc(p.n)}</b> <span class="r">${esc(p.role)}</span><br>
     <span class="r">${esc(p.scope)}</span></div>`;
  const sel = $("#gstudy");
  sel.innerHTML = `<option value="all">全部项目（${studies.length}）</option>` +
    studies.map(id=>`<option value="${id}">${esc(id)} · ${esc(S[id].short)}</option>`).join("");
  sel.value = studies.includes(state.study) ? state.study : "all";
  state.study = sel.value;
  sel.disabled = studies.length < 2;
}
const VIEWS = {};
function render(){
  if(!ME()){ showLogin(); return; }
  state.persona = ME().role;
  /* 模块权限在渲染入口强制一次：地址栏、旧状态、被收回的权限都拦在这里 */
  if(!canMod(state.view) || !VIEWS[state.view]){
    const r = RD();
    state.view = canMod(HOME[state.persona]) ? HOME[state.persona]
               : (r.mods.find(v=>VIEWS[v]) || null);
    if(!state.view){
      $("#content").innerHTML = `<div class="view-head"><h1>没有可访问的模块</h1>
        <p>当前角色「${esc(RD().t)}」未被授予任何模块权限。请联系管理员在「组织与权限」中调整。</p></div>`;
      renderNav(); renderTop(); return;
    }
  }
  renderNav(); renderTop(); clearTimers();
  const [t,sub] = titleOf(state.view);
  $("#content").innerHTML = `<div class="view-head"><h1>${esc(t)}</h1><p>${esc(sub)}</p></div><div id="vbody"></div>`;
  VIEWS[state.view]($("#vbody"));
  scrollTo({top:0, behavior:"instant"});
}
function go(v,opts={}){ Object.assign(state,opts); state.view=v; render(); }

let timers=[];
const clearTimers=()=>{timers.forEach(clearInterval);timers=[];};

document.addEventListener("click",e=>{
  const nav=e.target.closest("[data-nav]");  if(nav){ go(nav.dataset.nav); return; }
  const gt =e.target.closest("[data-goto]"); if(gt){ const [v,k,val]=gt.dataset.goto.split(":");
    go(v, k?{[k]:val}:{}); return; }
  const cl =e.target.closest("[data-close]"); if(cl){ closeLayer(); return; }
});
$("#glogout").addEventListener("click",()=>logout());
$("#gstudy").addEventListener("change",e=>{ state.study=e.target.value;
  if(state.study!=="all") state.enrStudy=state.study; render(); });
addEventListener("resize",()=>{ clearTimeout(window.__rz);
  window.__rz=setTimeout(()=>{ if(["dash","enr","pm","cra"].includes(state.view)) render(); },250); });
</script>
