<script>
"use strict";
/* ════════ 图标 ════════ */
const IC = {

  query:'<path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M12 13v.01M12 7a2 2 0 0 1 1.5 3.3c-.6.6-1.5 1-1.5 1.7"/>',
  isf:'<path d="M4 4h6l2 2h8v13a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M8 13l2 2 4-4"/>',
  approve:'<path d="M9 11l3 3 7-7"/><path d="M20 12v7a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h9"/>',
  team:'<circle cx="8" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M2 20a6 6 0 0 1 12 0"/><path d="M15 20a4.5 4.5 0 0 1 7-3.7"/>',
  intake:'<path d="M12 5v10M8 11l4 4 4-4"/><path d="M4 17v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2"/>',
  capa:'<path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/>',
  inst:'<path d="M3 21h18M5 21V10l7-5 7 5v11"/><path d="M9 21v-6h6v6"/>',
  reg:'<rect x="3" y="4" width="18" height="16" rx="1"/><circle cx="9" cy="10" r="2.2"/><path d="M5.5 17a3.8 3.8 0 0 1 7 0"/><path d="M15 9h4M15 13h4"/>',
  screen:'<path d="M3 4h18l-7 8v7l-4 2v-9z"/>',
  feas:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4.3-4.3"/><path d="M8.5 11h5M11 8.5v5"/>',
  mat:'<path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
  pay:'<rect x="2" y="6" width="20" height="12" rx="1"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/>',
  pi:'<path d="M12 3l2.2 4.6 5 .7-3.6 3.5.9 5-4.5-2.4L7.5 16.8l.9-5L4.8 8.3l5-.7z"/>',
  audit:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.9-4.9"/><path d="M8 10.5l2 2 3.5-3.5"/>'
};

/* ════════ 每个角色只看得到自己该看的 ════════ */
const N = {
  dash:{t:"经营驾驶舱",ic:IC.dash}, sites:{t:"项目 · 中心台账",ic:IC.sites},
  mysites:{t:"我的中心",ic:IC.sites}, enr:{t:"入组进度",ic:IC.enr},
  staff:{t:"派工与产能",ic:IC.staff}, time:{t:"工时与差旅",ic:IC.time},
  pnl:{t:"成本与毛利",ic:IC.pnl}, bill:{t:"里程碑 · 结算",ic:IC.bill},
  qa:{t:"质量事件与 CAPA",ic:IC.qa}, mon:{t:"监查访视",ic:IC.mon},
  price:{t:"报价模型",ic:IC.price},
  crc:{t:"我的一天",ic:IC.me}, cra:{t:"我的一天",ic:IC.me}, pm:{t:"团队工作台",ic:IC.me},
  subj:{t:"受试者访视窗口",ic:IC.subj}, query:{t:"数据质疑",ic:IC.query},
  isf:{t:"中心文件与物资",ic:IC.isf}, approve:{t:"待我审批",ic:IC.approve},
  team:{t:"我的团队",ic:IC.team},
  intake:{t:()=>PERSONA().k==="boss"?"立项审批":"立项与建档", ic:IC.intake},
  capa:{t:"我的整改",ic:IC.capa},
  inst:{t:"机构工作台",ic:IC.inst}, instac:{t:"立项受理",ic:IC.intake},
  instqc:{t:"机构质控",ic:IC.qa}, instreg:{t:"人员备案与准入",ic:IC.reg},
  screen:{t:"筛选漏斗与筛败",ic:IC.screen}, feas:{t:"中心可行性调查",ic:IC.feas},
  material:{t:"药品与样本",ic:IC.mat}, pay:{t:"受试者补偿",ic:IC.pay},
  pi:{t:"研究者工作台",ic:IC.pi}, audit:{t:"内部稽查",ic:IC.audit}
};
const openQ  = who=>QUERIES.filter(q=>q.owner===who&&q.st==="待中心回复").length;
const myQ    = ()=>QUERIES.filter(q=>q.by.startsWith(PERSONA().n)&&q.st==="待中心回复").length;
const badQA  = ()=>ISSUES.filter(i=>i.st!=="已关闭"&&i.sev!=="一般").length;
const myCapa = ()=>ISSUES.filter(i=>i.own===PERSONA().n&&i.st!=="已关闭").length;
const myEdc  = ()=>SUBJ.filter(s=>s.crc===PERSONA().n&&edcLate(s)).length;
const myPay  = ()=>PAY.filter(p=>staff(PERSONA().n)?.sites.includes(p.ss)&&p.st!=="已发放").length;
const ipBad  = ()=>IP.filter(r=>ipM(r).diff!==0).length;
const piPend = ()=>{const ids=new Set(SITES.filter(s=>s.pi===PERSONA().n).map(s=>s.id));
  return SUBJ.filter(s=>ids.has(s.ss)&&!s.piOk&&subjDone(s)===s.tasks.length).length;};
const auOpen = ()=>AUDIT.flatMap(a=>a.findings).filter(f=>f.st!=="已关闭").length;

const NAV_BY_ROLE = {
  boss:[
    {g:"经营", items:["dash",["intake",()=>INTAKE.length],"sites","enr","screen"]},
    {g:"资源", items:["staff","time"]},
    {g:"财务", items:["pnl","bill"]},
    {g:"质量", items:[["qa",badQA],"mon"]},
    {g:"工具", items:["price"]}
  ],
  pm:[
    {g:"团队", items:["pm","team",["approve",()=>APPROVALS.length]]},
    {g:"项目", items:["intake","feas","sites","enr","screen","mon"]},
    {g:"质量", items:[["qa",badQA]]},
    {g:"财务", items:["pnl"]}
  ],
  cra:[
    {g:"我的工作", items:["cra","mysites","mon",["query",()=>myQ()],"screen","feas"]},
    {g:"现场", items:[["material",ipBad]]},
    {g:"记录", items:["time"]},
    {g:"质量", items:[["qa",badQA],["capa",myCapa]]}
  ],
  crc:[
    {g:"我的工作", items:["crc",["subj",()=>SUBJ.filter(s=>s.crc===PERSONA().n&&winState(s).k!=="good").length],
                          ["query",()=>openQ(PERSONA().n)],["capa",myCapa]]},
    {g:"现场", items:["isf",["material",ipBad],["pay",myPay]]},
    {g:"记录", items:["time"]}
  ],
  inst:[
    {g:"机构办公室", items:["inst",["instac",()=>acOpen().length],
                            ["instqc",()=>qcFindOpen().length],
                            ["instreg",()=>regOpen().length]]}
  ],
  pi:[
    {g:"研究者", items:[["pi",piPend],["qa",badQA]]}
  ],
  qa:[
    {g:"质量保证", items:[["audit",auOpen],["qa",badQA],"screen","mon"]}
  ]
};
const HOME = {boss:"dash", pm:"pm", cra:"cra", crc:"crc", inst:"inst", pi:"pi", qa:"audit"};

const TITLES = {
  dash:["经营驾驶舱","一页看清人效、毛利、入组与风险。每个数字后面都对应一个具体的人和一个具体的动作。"],
  sites:["项目 · 中心台账","StudySite（项目 × 中心）是本系统的最小作业单元 —— 收入按中心计、成本按人落在中心上、核查风险按中心暴露。"],
  mysites:["我的中心","你负责监查的中心。风险分由入组达成、未关闭事件、SDV 缺口三项合成，决定下次监查的密度。"],
  enr:["入组进度","计划曲线 vs 实际曲线。入组延迟是临床试验项目亏损的第一大原因，这张图必须每天有人看。"],
  staff:["派工与产能","谁、在哪个项目中心、什么角色、FTE 占比多少。闲置与超载都是问题，所以按状态着色而不是按高低。"],
  time:["工时与差旅","一线在医院用手机填报，目标 30 秒内提交。可计费与不可计费强制区分 —— 不区分，利用率就是假的。"],
  pnl:["成本与毛利","单中心 P&L。「项目毛利 15%」没有经营价值，「A 院 40% / B 院 -20%」才能据以行动。"],
  bill:["里程碑 · 开票 · 回款","里程碑达成 → 证据链 → 开票 → 回款。断在哪一环，现金流就卡在哪一环。"],
  qa:["质量事件与 CAPA","把风险信号提前到日常作业里，而不是等稽查时第一次看见。"],
  mon:["监查访视","访视排期与 MVR 跟进项闭环。跟进项没关闭，等于这次监查没做。"],
  price:["报价模型","用历史真实人天反推报价。对手报价靠经验，你靠自己的成本数据库 —— 这是抄不走的护城河。"],
  crc:["我的一天","CRC 在医院现场、手机操作、时间碎片。这一页只回答一件事：现在最该做哪一件。"],
  cra:["我的一天","CRA 常年在路上。这一页把四个中心的风险、监查排期、待办跟进项收在一屏内。"],
  pm:["团队工作台","小团队管理者要同时对人和项目负责。左手是组员负载与审批，右手是项目进度与风险。"],
  subj:["受试者访视窗口","访视超窗即方案偏离。窗口由日期算出并倒计时，不靠人记 —— 这是 CRC 最该被系统兜住的地方。"],
  query:["数据质疑","Query 关闭时长直接反映数据质量与中心战斗力。超过 7 天未回复的，通常已经变成 CRA 的电话催办。"],
  isf:["中心文件与物资","研究者文件夹、人员资质、药品效期与温控。核查现场翻的就是这几摞东西。"],
  approve:["待我审批","审批不是盖章。每条都附带风险提示 —— 批准之前先看它背后是不是一个该解决的管理问题。"],
  team:["我的团队","组员负载、派驻中心、本周排班与调配。看到超载与闲置同时存在，就该动手调人。"],
  intake:()=>PERSONA().k==="boss"
    ? ["立项审批","毛利率低于门槛的项目必须过这一关。在立项时就算账，而不是做完半年后财务才告诉你亏了。"]
    : ["立项与建档","系统的入口：项目怎么进来、中心怎么建档。测算口径与报价模型完全一致，不做两套账。"],
  capa:["我的整改","机构质控、内部监查、稽查发现最终都落到具体的人。整改回复要写清措施与证据，机构复核通过才算关闭。"],
  inst:["机构工作台","医院药物临床试验机构办公室视角。机构对本院承接的每一个项目负质量与合规的最终责任。"],
  instac:["立项受理","受托方递交 → 机构形式审查 → 受理并转伦理。材料不齐就受理，后面每个环节都带着这个缺口往下走。"],
  instqc:["机构质控","医院方对项目的质量反馈闭环：质控发现 → 出具意见 → 派发整改 → 受托方回复 → 机构复核关闭。"],
  instreg:["人员备案与准入","谁能进这家医院接触受试者源数据，是医院的责任，不是受托方能自行决定的事。"],
  screen:["筛选漏斗与筛败","入组数只是漏斗最后一格。「入组落后」没有行动价值，「为什么落后」才有 —— 而答案藏在前面三格。"],
  feas:["中心可行性调查","报价模型算「要花多少人天」，可行性库算「这家能不能出病人」。事后把亏损中心标红是最便宜也最没用的功能。"],
  material:["药品与样本","接收 − 发放 = 账面库存，实盘对不上就是严重发现；样本采集→离心→转运→回执，断一环即失效。"],
  pay:["受试者补偿","CRC 每周固定要花时间的事，也是稽查必查三件套：发放与访视是否对应、有无签收凭证、现金发放是否合规。"],
  pi:["研究者工作台","方案偏离要 PI 签字、SAE 由 PI 上报、授权分工表由 PI 签署 —— 研究者是法定责任人，不该只是系统里的一个字符串。"],
  audit:["内部稽查与 CAPA 有效性","机构质控是医院查我们，QA 是我们自己查自己。QA 真正的价值不是再发现一批问题，而是验证 CAPA 到底有没有防住复发。"]
};

const state = {view:"dash", persona:"boss", study:"all", enrStudy:"HJ-2024-017", dashRange:"12m",
  sortKey:"rate", sortDir:1, q:"", stFilter:new Set(), roleFilter:"all",
  sevFilter:new Set(), pnlSort:"gp", visitSel:0, tsWho:"吴桐", subjSel:null, qTab:"open"};

const PERSONA = ()=>P_OF[state.persona];

/* 数据范围由身份决定：看得到什么，取决于你是谁 */
function myScope(){
  const p = PERSONA();
  if(p.k==="boss") return SITES;
  if(p.k==="pm")   return SITES.filter(s=>TEAM.studies.includes(s.sid));
  if(p.k==="inst") return SITES.filter(s=>s.hosp===p.hosp);   // 机构只看本院
  if(p.k==="pi")   return SITES.filter(s=>s.pi===p.n);        // 研究者只看自己负责的中心
  if(p.k==="qa")   return SITES;                              // QA 覆盖全公司，但只有质量视图
  const me = staff(p.n);
  return SITES.filter(s=>me.sites.includes(s.id));
}
function scope(){
  const base = myScope();
  return state.study==="all" ? base : base.filter(s=>s.sid===state.study);
}
function scopeIds(){ return new Set(scope().map(s=>s.id)); }
function myTeam(){ return TEAM.members.map(staff); }

function renderNav(){
  const p = PERSONA();
  $("#nav").innerHTML = NAV_BY_ROLE[p.k].map(g=>
    `<div class="nav-group">${esc(g.g)}</div>` + g.items.map(it=>{
      const [k,badge] = Array.isArray(it)? it : [it,null];
      const b = badge? badge():0, d = N[k];
      return `<button class="nav-item" data-nav="${k}" aria-current="${state.view===k}">
        <svg class="nav-ic" viewBox="0 0 24 24">${d.ic}</svg><span>${esc(typeof d.t==="function"?d.t():d.t)}</span>
        ${b?`<span class="nav-badge">${b}</span>`:""}</button>`;
    }).join("")).join("");
  const per = $("#persona");
  if(per) per.innerHTML =
    `<div class="avatar">${esc(p.n.slice(0,1))}</div>
     <div><div class="n">${esc(p.n)}</div><div class="d">${esc(p.title)}</div></div>`;
}
const titleOf = v=>{ const t=TITLES[v]; return typeof t==="function"? t() : t; };
function renderTop(){
  const p = PERSONA(), [t] = titleOf(state.view);
  const studies = [...new Set(myScope().map(s=>s.sid))];
  $("#crumb").innerHTML = `恒济临床研究 / <b>${esc(t)}</b>`;
  $("#who").innerHTML =
    `<div class="avatar">${esc(p.n.slice(0,1))}</div>
     <div><b>${esc(p.n)}</b> <span class="r">${esc(p.role)}</span><br>
     <span class="r">${esc(p.scope)}</span></div>`;
  const rs = $("#grole");
  if(!rs.options.length) rs.innerHTML = PERSONAS.map(x=>
    `<option value="${x.k}">${esc(x.title)} · ${esc(x.n)}</option>`).join("");
  rs.value = state.persona;
  const sel = $("#gstudy");
  sel.innerHTML = `<option value="all">全部项目（${studies.length}）</option>` +
    studies.map(id=>`<option value="${id}">${esc(id)} · ${esc(S[id].short)}</option>`).join("");
  sel.value = studies.includes(state.study) ? state.study : "all";
  state.study = sel.value;
  sel.disabled = studies.length < 2;
}
const VIEWS = {};
function render(){
  if(!NAV_BY_ROLE[state.persona].some(g=>g.items.some(it=>(Array.isArray(it)?it[0]:it)===state.view)))
    state.view = HOME[state.persona];
  renderNav(); renderTop(); clearTimers();
  const [t,sub] = titleOf(state.view);
  $("#content").innerHTML = `<div class="view-head"><h1>${esc(t)}</h1><p>${esc(sub)}</p></div><div id="vbody"></div>`;
  VIEWS[state.view]($("#vbody"));
  scrollTo({top:0, behavior:"instant"});
}
function go(v,opts={}){ Object.assign(state,opts); state.view=v; render(); }

let timers=[];
const clearTimers=()=>{timers.forEach(clearInterval);timers=[];};

document.addEventListener("click",e=>{
  const nav=e.target.closest("[data-nav]");  if(nav){ go(nav.dataset.nav); return; }
  const gt =e.target.closest("[data-goto]"); if(gt){ const [v,k,val]=gt.dataset.goto.split(":");
    go(v, k?{[k]:val}:{}); return; }
  const cl =e.target.closest("[data-close]"); if(cl){ closeLayer(); return; }
});
$("#grole").addEventListener("change",e=>{
  state.persona = e.target.value; state.study="all"; state.view = HOME[state.persona];
  state.stFilter.clear(); state.sevFilter.clear(); state.q=""; state.subjSel=null;
  const p=PERSONA(); if(p.k==="cra"||p.k==="crc") state.tsWho=p.n;
  render(); toast(`已切换到 ${p.title} ${p.n} 的视角`);
});
$("#gstudy").addEventListener("change",e=>{ state.study=e.target.value;
  if(state.study!=="all") state.enrStudy=state.study; render(); });
addEventListener("resize",()=>{ clearTimeout(window.__rz);
  window.__rz=setTimeout(()=>{ if(["dash","enr","pm","cra"].includes(state.view)) render(); },250); });
</script>
