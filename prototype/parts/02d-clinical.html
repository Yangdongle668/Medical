const FN = id => FUNNEL[id] || {pre:0,icf:0,sf:0,sfr:[0,0,0,0,0,0]};
function funnelM(ss){
  const f=FN(ss.id), inScr=Math.max(0, f.icf - ss.enrolled - f.sf);
  return {
    pre:f.pre, icf:f.icf, sf:f.sf, enr:ss.enrolled, inScr, sfr:f.sfr,
    sfRate: f.icf ? f.sf/f.icf : null,          // 筛败率
    icfRate: f.pre ? f.icf/f.pre : null,        // 预筛转化率
    yield: f.pre ? ss.enrolled/f.pre : null     // 预筛→入组总转化率
  };
}
/* 落后中心的根因判定：三种失败模式，指向完全不同的行动 */
function enrollDiag(ss){
  const m=siteM(ss), f=funnelM(ss);
  if(m.rate===null || m.rate>=0.9) return null;
  if(f.pre>0 && f.icf/Math.max(f.pre,1)>=0.5 && f.sfRate>0.5)
    return {k:"筛败率过高", c:"var(--s5)",
      d:`筛败 ${f.sf}/${f.icf}（${pct(f.sfRate)}），远高于同项目其他中心`,
      a:"入排标准与该中心病源不匹配 → 与申办方谈方案修订，或降低该中心的合同例数"};
  if(f.pre>0 && f.pre < ss.contracted*1.8)
    return {k:"预筛量不足", c:"var(--s2)",
      d:`累计预筛仅 ${f.pre} 人，合同 ${ss.contracted} 例，按当前筛败率至少需预筛 ${Math.ceil(ss.contracted/Math.max(f.yield||0.3,0.15))} 人`,
      a:"病源本身不够 → 这是可行性调查该拦下的中心；现阶段只能加招募渠道或减例数"};
  if(f.pre<=6)
    return {k:"中心未真正启动", c:"var(--crit)",

      a:"PI 参与度问题 → 需 PM 出面沟通，否则应考虑关闭该中心止损"};
