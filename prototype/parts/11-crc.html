<script>
"use strict";
/* ════════════════════════════════════════════════════════════════════
   CRC 端 —— 现场协调员。手机为主、时间碎片、最怕访视超窗。
   ════════════════════════════════════════════════════════════════════ */

const mySubj = ()=>SUBJ.filter(s=>s.crc===PERSONA().n)
  .sort((a,b)=>winState(a).rem-winState(b).rem);

/* 窗口条：把 [due-win, due+win] 画出来，并标出今天在哪 —— 不靠人记 */
function winBar(s){
  const w=winState(s), pad=3, span=s.win*2+pad*2;
  const l=(pad/span*100), width=((s.win*2)/span*100);
  const off=days(new Date(new Date(s.due).getTime()-(s.win+pad)*864e5).toISOString().slice(0,10),TODAY);
  const now=clamp(off/span*100,0,100);
  return `<div class="winbar" title="窗口 ${w.first} ～ ${w.last}">
    <div class="ok" style="left:${l}%;width:${width}%"></div>
    <div class="now" style="left:${now}%"></div>
    <div class="lbl">${esc(w.first)} ～ ${esc(w.last)}</div></div>`;
}
function subjCard(s,{open=false}={}){
  const w=winState(s), ss=site(s.ss), d=subjDone(s);
  return `<div class="tcard ${w.k==="good"?"":w.k}" data-sc="${s.id}">
    <div class="tcard-h">
      <div style="flex:1;min-width:0">
        <div class="row" style="gap:6px">
          <span class="subjid">${esc(s.id)}</span>
          <span class="pill p-${w.k}">${esc(w.t)}</span>
          ${w.dev?`<span class="pill p-crit">已构成方案偏离</span>`:""}
        </div>
        <div style="font-size:13px;font-weight:600;margin-top:5px">${esc(s.v)}</div>
        <div class="note">${esc(ss.hosp)} · ${esc(S[ss.sid].short)}｜目标日 ${esc(s.due)} ± ${s.win} 天</div>
      </div>
      <div class="ta-r" style="flex:none">
        <div class="cd" style="font-size:19px;color:var(--${w.k==="good"?"good":w.k})">${w.rem<0?w.rem:"+"+w.rem}<span style="font-size:10px;font-weight:400"> 天</span></div>
        <div class="note">${w.rem<0?"已超窗":"窗口剩余"}</div>
      </div>
    </div>
    <div style="padding:0 12px 10px 14px">
      ${winBar(s)}
      <div class="row" style="justify-content:space-between;margin-top:8px">
        <span class="note">访视任务 ${d} / ${s.tasks.length}</span>
        <button class="btn" data-sx="${s.id}">${open?"收起":"展开任务"}</button>
      </div>
      <div class="bartrack" style="height:4px;margin-top:5px"><div class="barfill" style="width:${d/s.tasks.length*100}%;background:${d===s.tasks.length?"var(--good)":"var(--accent)"};height:100%"></div></div>
      <div id="sx-${s.id}" ${open?"":"hidden"} style="margin-top:8px">
        ${s.tasks.map((t,k)=>`<label class="cbx ${t[1]?"done":""}" style="border-bottom:1px solid var(--line)">
          <input type="checkbox" data-st="${s.id}:${k}" ${t[1]?"checked":""}><span>${esc(t[0])}</span></label>`).join("")}
        <div class="row" style="margin-top:9px">
          <button class="btn btn-p" data-sdone="${s.id}">标记访视完成</button>
          <button class="btn" data-goto4="${s.ss}">中心详情</button>
        </div>
      </div>
    </div></div>`;
}

/* ── CRC 我的一天 ── */
VIEWS.crc = box=>{
  const me=PERSONA().n, list=mySubj();
  const alert=list.filter(s=>winState(s).k!=="good");
  const qs=QUERIES.filter(q=>q.owner===me&&q.st==="待中心回复");
  const myTs=TIMESHEET.filter(t=>t.who===me);
  const h=sum(myTs,t=>t.h), bill=sum(myTs.filter(t=>WORKTYPES.find(w=>w.k===t.type).bill),t=>t.h);
  const isf=ISF.filter(i=>staff(me).sites.includes(i.ss)&&i.st!=="good");
  const p=staff(me), us=utilState(p.util);

  box.innerHTML=`
  <div class="mini" style="margin-bottom:14px">
    ${[["窗口告警",alert.length,"例",alert.length?"var(--crit)":"var(--good)"],
       ["待我回复质疑",qs.length,"条",qs.length?"var(--warn)":"var(--good)"],
       ["现场清单异常",isf.length,"项",isf.length?"var(--warn)":"var(--good)"],
       ["本期工时",n1(h),"小时","var(--ink)"],
       ["可计费率",h?pct(bill/h):"—","",bill/h<0.85?"var(--warn)":"var(--good)"],
       ["我的利用率",p.util+"%","",us.c]
     ].map(([l,v,u,c])=>`<div><div class="kpi-l">${esc(l)}</div>
        <div class="v" style="color:${c}">${v}<small style="font-size:11px;color:var(--ink-3);margin-left:2px">${u}</small></div></div>`).join("")}
  </div>
  <div class="grid g21" style="gap:12px">
    <div class="stack">
      <div class="card">
        <div class="card-h"><h3>现在最该做的</h3><span class="sub">按窗口剩余时间排序，不按录入顺序</span>
          <span class="sp"></span><button class="btn" data-nav="subj">全部 ${list.length} 例 →</button></div>
        <div class="card-b"><div class="stack" style="gap:9px">
          ${list.slice(0,3).map(s=>subjCard(s,{open:winState(s).k==="crit"})).join("")||`<div class="empty">今日无待办访视</div>`}
        </div></div>
      </div>
      <div class="card">
        <div class="card-h"><h3>待我回复的数据质疑</h3><span class="sp"></span>
          <button class="btn" data-nav="query">全部 →</button></div>
        <div class="card-b" style="padding:0">
          ${qs.slice(0,3).map(q=>`<div style="padding:10px 14px;border-bottom:1px solid var(--line)">
            <div class="row" style="gap:6px"><span class="mono" style="font-size:11px;color:var(--ink-3)">${esc(q.id)}</span>
              <span class="subjid">${esc(q.subj)}</span>
              <span class="pill ${q.age>7?"p-crit":"p-warn"}">已挂起 ${q.age} 天</span></div>
            <div style="font-size:12.5px;margin-top:4px;color:var(--ink-2)">${esc(q.txt)}</div>
            <div class="note" style="margin-top:2px">${esc(site(q.ss).hosp)} · ${esc(q.form)} / ${esc(q.field)}｜发起 ${esc(q.by)}</div>
          </div>`).join("")||`<div class="empty">没有待回复的质疑</div>`}
        </div>
      </div>
    </div>
    <div class="stack">
      <div class="card">
        <div class="card-h"><h3>快速打卡</h3><span class="sub">30 秒</span></div>
        <div class="card-b">
          <div class="field"><div class="slider-h"><label for="qk-s">中心</label></div>
            <select class="sel" id="qk-s" style="width:100%">${staff(me).sites.map(id=>
              `<option value="${id}">${esc(site(id).hosp)}</option>`).join("")}</select></div>
          <div class="field"><div class="slider-h"><label>类型</label></div>
            <div class="row" style="gap:4px" id="qk-t">${WORKTYPES.slice(0,3).concat(WORKTYPES.slice(5,7)).map((w,i)=>
              `<button class="chip" data-t="${esc(w.k)}" aria-pressed="${i===0}" style="font-size:10.5px;padding:2px 7px">${esc(w.k)}</button>`).join("")}</div></div>
          <div class="field"><div class="slider-h"><label for="qk-h">工时</label><b id="qk-hv">8.0 小时</b></div>
            <input type="range" id="qk-h" min="0.5" max="12" step="0.5" value="8"></div>
          <div id="qk-b" style="margin-bottom:10px"></div>
          <button class="btn btn-p" id="qk-go" style="width:100%;justify-content:center">提交</button>
        </div>
      </div>
      <div class="card">
        <div class="card-h"><h3>现场清单异常</h3><span class="sp"></span>
          <button class="btn" data-nav="isf">全部 →</button></div>
        <div class="card-b" style="padding:0">
          ${isf.map(i=>`<div style="padding:9px 14px 9px 16px;border-bottom:1px solid var(--line);position:relative">
            <span class="stripe" style="background:var(--${i.st})"></span>
            <div class="row" style="gap:6px"><span class="pill p-${i.st}">${i.st==="crit"?"缺失/过期":"临期"}</span>
              <b style="font-size:12.5px;font-weight:500">${esc(i.item)}</b></div>
            <div class="note" style="margin-top:2px">${esc(site(i.ss).hosp)} · ${esc(i.cat)}｜${esc(i.note)}</div>
          </div>`).join("")||`<div class="empty">清单齐备</div>`}
        </div>
      </div>
    </div>
  </div>`;
  wireSubj(box); wireQuick(box, me);
};

/* ── 受试者访视窗口（完整列表） ── */
VIEWS.subj = box=>{
  const list=mySubj();
  const g={crit:list.filter(s=>winState(s).k==="crit"),
           warn:list.filter(s=>winState(s).k==="warn"),
           good:list.filter(s=>winState(s).k==="good")};
  box.innerHTML=`
  <div class="grid g4" style="gap:10px;margin-bottom:14px">
    ${[["已超窗 / 今明到期",g.crit.length,"例","var(--crit)","超窗即方案偏离，必须当天处理"],
       ["窗口临期",g.warn.length,"例","var(--warn)","3 天内必须完成"],
       ["窗口内",g.good.length,"例","var(--good)","按计划推进"],
       ["在管受试者",list.length,"例","var(--ink)","仅筛选号，无身份信息"]
     ].map(([l,v,u,c,n])=>`<div class="card" style="padding:12px 13px">
        <div class="kpi-l">${esc(l)}</div>
        <div class="num" style="font-size:24px;margin-top:3px;color:${c}">${v}<small style="font-size:12px;color:var(--ink-3);margin-left:2px">${u}</small></div>
        <div class="note">${esc(n)}</div></div>`).join("")}
  </div>
  ${["crit","warn","good"].map(k=>g[k].length?`
    <div class="section-t">${k==="crit"?"立即处理":k==="warn"?"三天内":"窗口内"}（${g[k].length}）</div>
    <div class="grid g2" style="gap:10px;margin-bottom:16px">${g[k].map(s=>subjCard(s,{open:k==="crit"})).join("")}</div>`:"").join("")}
  <div class="formula">窗口状态由日期算出，不是人工标注：
剩余 = (目标日 + 窗口天数) − 今天
剩余 &lt; 0 → 已超窗（自动生成方案偏离待办）
剩余 ≤ 1 → 今明到期    剩余 ≤ 3 → 窗口临期</div>`;
  wireSubj(box);
};

function wireSubj(box){
  box.addEventListener("click",e=>{
    const x=e.target.closest("[data-sx]");
    if(x){ const d=$("#sx-"+x.dataset.sx); if(d){ d.hidden=!d.hidden; x.textContent=d.hidden?"展开任务":"收起"; } return; }
    const g=e.target.closest("[data-goto4]"); if(g){ openSite(g.dataset.goto4); return; }
    const dn=e.target.closest("[data-sdone]");
    if(dn){
      const s=SUBJ.find(x=>x.id===dn.dataset.sdone), left=s.tasks.filter(t=>!t[1]).length;
      if(left){ toast(`还有 ${left} 项访视任务未完成，无法标记完成`,"crit"); return; }
      const w=winState(s);
      if(w.dev){
        ISSUES.unshift({id:"QI-2026-0"+(160+ISSUES.length), ss:s.ss, sev:"严重", type:"方案偏离",
          found:TODAY, desc:`受试者 ${s.id}「${s.v}」实际完成日期超出方案窗口 ${Math.abs(w.rem)} 天（窗口 ${w.first} ～ ${w.last}）。`,
          capa:"填写方案偏离表并由 PI 签字；上报伦理委员会；复盘窗口提醒是否生效。",
          own:PERSONA().n, due:new Date(Date.now()+7*864e5).toISOString().slice(0,10), st:"待验证", sla:null});
        toast(`${s.id} 访视已完成，但超窗 ${Math.abs(w.rem)} 天 —— 已自动生成方案偏离事件`,"crit");
      } else toast(`${s.id}「${s.v}」已标记完成，窗口内`);
      const i=SUBJ.indexOf(s); SUBJ.splice(i,1); render();
    }
  });
  box.addEventListener("change",e=>{
    const c=e.target.closest("[data-st]"); if(!c) return;
    const [id,k]=c.dataset.st.split(":");
    const s=SUBJ.find(x=>x.id===id); s.tasks[+k][1]=c.checked?1:0;
    c.closest("label").classList.toggle("done",c.checked);
    const card=c.closest(".tcard"), d=subjDone(s);
    card.querySelector(".bartrack .barfill").style.width=d/s.tasks.length*100+"%";
    card.querySelector(".bartrack .barfill").style.background=d===s.tasks.length?"var(--good)":"var(--accent)";
    card.querySelector(".note").textContent=`访视任务 ${d} / ${s.tasks.length}`;
  });
}
function wireQuick(box, me){
  const note=()=>{ const t=box.querySelector('#qk-t [aria-pressed="true"]')?.dataset.t;
    const w=WORKTYPES.find(x=>x.k===t);
    $("#qk-b").innerHTML = w.bill? `<span class="pill p-good">✓ 可计费</span>`
      : `<span class="pill p-crit">✗ 不可计费 — 由公司承担</span>`; };
  note();
  $("#qk-h").addEventListener("input",e=>$("#qk-hv").textContent=(+e.target.value).toFixed(1)+" 小时");
  $("#qk-t").addEventListener("click",e=>{const b=e.target.closest("[data-t]"); if(!b)return;
    box.querySelectorAll("#qk-t .chip").forEach(c=>c.setAttribute("aria-pressed",c===b)); note();});
  $("#qk-go").addEventListener("click",()=>{
    const ss=$("#qk-s").value, type=box.querySelector('#qk-t [aria-pressed="true"]').dataset.t;
    const h=+$("#qk-h").value, p=staff(me);
    TIMESHEET.unshift({id:tsSeq++, d:TODAY, who:me, ss, type, h, travel:0});
    const c=h/8*(p.role==="CRA"?RATE.craDay:RATE.crcDay), s=site(ss);
    s.cost=+(s.cost+c).toFixed(1); s.md+=Math.round(h/8*10)/10;
    toast(`已打卡 ${n1(h)} 小时 · 成本 ${n1(c)} 万归集到 ${s.hosp}`); render();
  });
}

/* ── 数据质疑（CRC 回复 / CRA 跟进，同一页两种视角） ── */
VIEWS.query = box=>{
  const p=PERSONA(), isCRC=p.k==="crc";
  const all = isCRC ? QUERIES.filter(q=>q.owner===p.n)
                    : QUERIES.filter(q=>q.by.startsWith(p.n)||staff(p.n).sites.includes(q.ss));
  const open=all.filter(q=>q.st==="待中心回复"), waiting=all.filter(q=>q.st!=="待中心回复");
  const shown = state.qTab==="open"? open : waiting;
  const avg = all.length? sum(all,q=>q.age)/all.length : 0;

  box.innerHTML=`
  <div class="grid g4" style="gap:10px;margin-bottom:14px">
    ${[[isCRC?"待我回复":"待中心回复",open.length,"条",open.length?"var(--warn)":"var(--good)"],
       ["挂起超 7 天",open.filter(q=>q.age>7).length,"条",open.filter(q=>q.age>7).length?"var(--crit)":"var(--good)"],
       ["平均挂起",n1(avg),"天",avg>7?"var(--crit)":avg>5?"var(--warn)":"var(--good)"],
       ["已回复待关闭",waiting.length,"条","var(--ink)"]
     ].map(([l,v,u,c])=>`<div class="card" style="padding:12px 13px">
        <div class="kpi-l">${esc(l)}</div>
        <div class="num" style="font-size:24px;margin-top:3px;color:${c}">${v}<small style="font-size:12px;color:var(--ink-3);margin-left:2px">${u}</small></div></div>`).join("")}
  </div>
  <div class="card">
    <div class="card-h">
      <div class="seg" id="qt">
        <button data-q="open" aria-pressed="${state.qTab==="open"}">${isCRC?"待我回复":"待中心回复"} ${open.length}</button>
        <button data-q="wait" aria-pressed="${state.qTab!=="open"}">已回复待关闭 ${waiting.length}</button>
      </div><span class="sp"></span>
      <span class="sub">目标平均关闭 ≤ 5 天</span></div>
    <div class="card-b" style="padding:0">
      ${shown.length? shown.map(q=>`
        <div style="padding:12px 16px 12px 18px;border-bottom:1px solid var(--line);position:relative">
          <span class="stripe" style="background:var(--${q.age>7?"crit":q.st==="待中心回复"?"warn":"good"})"></span>
          <div class="row" style="gap:6px">
            <span class="mono" style="font-size:11px;color:var(--ink-3)">${esc(q.id)}</span>
            <span class="subjid">${esc(q.subj)}</span>
            <span class="pill p-neut">${esc(q.form)}</span>
            <span class="sp"></span>
            <span class="pill ${q.age>7?"p-crit":"p-warn"}">挂起 ${q.age} 天</span></div>
          <div style="font-size:12.5px;margin-top:5px;color:var(--ink-2);line-height:1.6">${esc(q.txt)}</div>
          <div class="note" style="margin-top:3px">${esc(site(q.ss).hosp)} · 字段「${esc(q.field)}」｜发起方 ${esc(q.by)}｜责任 CRC ${esc(q.owner)}</div>
          ${isCRC&&q.st==="待中心回复"?`
            <div style="margin-top:9px">
              <textarea class="qbox" id="qr-${q.id}" placeholder="填写核实结果与源数据依据，例如：已核对原始病历，AE 开始日期录入错误，已更正为 2026-08-09，源文件第 12 页。"></textarea>
              <div class="row" style="margin-top:7px">
                <button class="btn btn-p" data-qr="${q.id}">提交回复</button>
                <button class="btn" data-goto4="${q.ss}">中心详情</button></div>
            </div>`:""}
          ${!isCRC&&q.st==="待中心回复"&&q.age>7?`
            <div class="row" style="margin-top:9px">
              <button class="btn btn-p" data-qp="${q.id}">电话催办并记录</button>
              <span class="note">超 7 天未回复，靠系统提醒已经不够了</span></div>`:""}
        </div>`).join("") : `<div class="empty">这一栏是空的</div>`}
    </div>
  </div>`;
  box.addEventListener("click",e=>{
    const t=e.target.closest("[data-q]"); if(t){ state.qTab=t.dataset.q; render(); return; }
    const g=e.target.closest("[data-goto4]"); if(g){ openSite(g.dataset.goto4); return; }
    const r=e.target.closest("[data-qr]");
    if(r){ const q=QUERIES.find(x=>x.id===r.dataset.qr);
      const v=$("#qr-"+q.id).value.trim();
      if(v.length<10){ toast("回复需要写清核实结果与源数据依据（至少 10 个字）","crit"); return; }
      q.st="已回复待关闭"; toast(`${q.id} 已回复，等待数据管理关闭`); render(); return; }
    const ph=e.target.closest("[data-qp]");
    if(ph){ const q=QUERIES.find(x=>x.id===ph.dataset.qp);
      toast(`已记录对 ${site(q.ss).hosp} 的催办：${q.id}，并同步给 PM`,"warn"); }
  });
};

/* ── 中心文件与物资 ── */
VIEWS.isf = box=>{
  const mine=staff(PERSONA().n).sites;
  const list=ISF.filter(i=>mine.includes(i.ss));
  const bad=list.filter(i=>i.st!=="good");
  const cats=[...new Set(list.map(i=>i.cat))];
  box.innerHTML=`
  <div class="grid g4" style="gap:10px;margin-bottom:14px">
    ${[["清单项",list.length,"项","var(--ink)"],
       ["缺失 / 过期",list.filter(i=>i.st==="crit").length,"项",list.filter(i=>i.st==="crit").length?"var(--crit)":"var(--good)"],
       ["临期待办",list.filter(i=>i.st==="warn").length,"项",list.filter(i=>i.st==="warn").length?"var(--warn)":"var(--good)"],
       ["齐备率",pct((list.length-bad.length)/list.length),"",bad.length?"var(--warn)":"var(--good)"]
     ].map(([l,v,u,c])=>`<div class="card" style="padding:12px 13px">
        <div class="kpi-l">${esc(l)}</div>
        <div class="num" style="font-size:24px;margin-top:3px;color:${c}">${v}<small style="font-size:12px;color:var(--ink-3);margin-left:2px">${u}</small></div></div>`).join("")}
  </div>
  ${mine.map(id=>`
    <div class="card" style="margin-bottom:12px">
      <div class="card-h"><h3>${esc(site(id).hosp)}</h3>
        <span class="sub">${esc(S[site(id).sid].short)} · PI ${esc(site(id).pi)}</span></div>
      <div class="card-b" style="padding:0">
        ${cats.map(c=>{const rows=list.filter(i=>i.ss===id&&i.cat===c); if(!rows.length) return "";
          return `<div style="padding:10px 14px;border-bottom:1px solid var(--line)">
            <div class="section-t" style="margin-bottom:6px">${esc(c)}</div>
            ${rows.map(i=>`<div class="row" style="justify-content:space-between;gap:10px;padding:5px 0">
              <div style="flex:1;min-width:0">
                <div class="row" style="gap:6px"><span class="dot" style="background:var(--${i.st})"></span>
                  <b style="font-size:12.5px;font-weight:500">${esc(i.item)}</b></div>
                <div class="note" style="margin-left:12px">${esc(i.note)}</div></div>
              ${i.st!=="good"?`<button class="btn" data-fix="${esc(i.item)}">${i.st==="crit"?"上报并补齐":"提前处理"}</button>`
                             :`<span class="pill p-good">齐备</span>`}
            </div>`).join("")}</div>`;}).join("")}
      </div>
    </div>`).join("")}
  <p class="note">核查现场翻的就是这几摞东西。人员资质缺失与药品效期是最常见的两类严重发现 —— 它们都能被日历提醒兜住，却经常没人管。</p>`;
  box.addEventListener("click",e=>{const b=e.target.closest("[data-fix]");
    if(b) toast(`已生成待办并通知 CRA 与 PM：${b.dataset.fix}`,"warn");});
};
</script>
