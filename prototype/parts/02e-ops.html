/* 评分口径全部公开，没有黑箱。满分 100。 */
function feasScore(q){
  const src   = clamp(q.ptYear/500, 0, 1) * 30;                       // 病源 30
  const past  = q.pastN===0 ? 0 : clamp(q.pastBest/5, 0, 1) * 30;     // 既往入组表现 30（最强预测因子）
  const comp  = -clamp(q.compet/5, 0, 1) * 15;                        // 竞争试验 −15
  const start = clamp((150-q.startDays)/110, 0, 1) * 15;              // 启动效率 15
  const team  = clamp(q.teamN/8, 0, 1) * 10;                          // 团队规模 10
  const elig  = q.eligPct==null ? 0 : (q.eligPct-0.3)*30;             // 入排匹配度修正 ±
  const total = clamp(src+past+comp+start+team+elig, 0, 100);
  /* 预测月入组：PI 承诺打折，再受病源与入排匹配度封顶 */
  const cap  = (q.ptYear/12) * (q.eligPct==null ? 0.30 : q.eligPct) * 0.5;
  const pred = Math.min(q.piCommit*PI_KEEP, cap);
  const lvl  = total>=65 ? {k:"good",t:"推荐入选"} : total>=45 ? {k:"warn",t:"谨慎入选"} : {k:"crit",t:"不建议入选"};
  return {parts:{src,past,comp,start,team,elig}, total, pred, cap, lvl};
}

/* CAPA 有效性 = 同类问题是否复发。复发说明当初的 CAPA 只做了纠正，没做预防。 */
function capaEffect(){
  const byType={};
  ISSUES.forEach(i=>{ const k=i.type.replace(/^机构质控发现 · /,"");
    (byType[k] ||= {n:0, closed:0, repeat:0}).n++;
    if(i.st==="已关闭") byType[k].closed++; });
  AUDIT.flatMap(a=>a.findings).filter(f=>f.repeat).forEach(f=>{
    const src=ISSUES.find(i=>i.id===f.repeat); if(!src) return;
    const k=src.type.replace(/^机构质控发现 · /,"");
    (byType[k] ||= {n:0, closed:0, repeat:0}).repeat++; });
  return Object.entries(byType).map(([k,v])=>({type:k, ...v}))
    .sort((a,b)=>b.repeat-a.repeat || b.n-a.n);
}
