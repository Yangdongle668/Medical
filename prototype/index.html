        <td class="tnum t-main">${wan(R.rev)}</td><td class="tnum t-main">${wan(R.cost)}</td>
        <td class="tnum t-main" style="color:${R.gp<0?"var(--crit)":"var(--ink)"}">${R.gp>0?"+":""}${n1(R.gp)}</td>
        <td class="tnum t-main">${pct(R.gm)}</td><td class="tnum t-main">${n1(R.cpe)}</td><td colspan="2"></td>
      </tr></tfoot>
    </table></div>
  </div>
  <div class="formula" style="margin-top:12px">收入 = 启动费 + 入组例数 × 单例单价 + <b>筛败例数 × 单例单价 × ${pct(SF_FEE)}</b>
成本 = 工时归集（含筛选期陪同） + 差旅 + 职能分摊

筛败费此前被整套模型漏掉。补上之后本范围收入 +${wan(sum(list,s=>revParts(s).sf))} 万，
亏损中心从按旧口径的 ${rows.filter(s=>(s.startup||0)+s.enrolled*s.unit<s.cost).length} 个变为 ${loss.length} 个 ——
<b>漏算筛败费会让高筛败率中心被误判为亏损，从而砍掉本来赚钱的中心。</b></div>
  <p class="note" style="margin-top:8px">金额单位：万元。点击任意行进入中心详情。</p>`;

  diverging($("#c-dv"), rows.map(s=>{const m=siteM(s);
    return {label:s.hosp.replace(/(大学|医学院|附属|中国医学科学院)/g,""),v:m.gp,
      tip:`<div class="tip-t">${esc(s.hosp)}</div>
        <div class="tip-r"><span>收入合计</span><b>${wan(m.rev)} 万</b></div>
        <div class="tip-r"><span>· 启动费</span><b>${wan(revParts(s).startup)}</b></div>
        <div class="tip-r"><span>· 入组费</span><b>${wan(revParts(s).enr)}</b></div>
        <div class="tip-r"><span>· 筛败费</span><b>${wan(revParts(s).sf)}</b></div>
        <div class="tip-r"><span>成本</span><b>${wan(s.cost)} 万</b></div>
        <div class="tip-r"><span>毛利率</span><b style="color:${m.gm<0?"var(--crit)":"var(--ink)"}">${m.gm===null?"—":pct(m.gm)}</b></div>
        <div class="tip-r"><span>每例成本</span><b>${m.cpe?n1(m.cpe)+" 万":"—"}</b></div>
        <div class="tip-r"><span>单例单价</span><b>${n1(s.unit)} 万</b></div>`};}));
  stacked($("#c-cost"),[
    {n:"CRC 人力",v:crcC},{n:"CRA 人力",v:craC},
    {n:"差旅",v:travel},{n:"职能分摊",v:oh}],{h:30});
  box.addEventListener("click",e=>{
    const b=e.target.closest("[data-k]"); if(b){state.pnlSort=b.dataset.k;render();return;}
    const t=e.target.closest("[data-ss3]"); if(t) openSite(t.dataset.ss3);
  });
};

/* ════════════════ 7 · 里程碑 · 开票 · 回款 ════════════════ */
VIEWS.bill = box=>{
  const ids=scopeIds();
  const ms=MILES.filter(m=>ids.has(m.ss));
  const unb=ms.filter(m=>m.inv==="待开票"), open=ms.filter(m=>m.inv==="已开票"&&!m.paid), paid=ms.filter(m=>m.paid);
  const buckets=[
    {n:"0–30 天",v:sum(open.filter(m=>m.age<=30),m=>m.amt),c:"var(--s1)"},
    {n:"31–60 天",v:sum(open.filter(m=>m.age>30&&m.age<=60),m=>m.amt),c:"var(--s3)"},
    {n:"61–90 天",v:sum(open.filter(m=>m.age>60&&m.age<=90),m=>m.amt),c:"var(--s2)"},
    {n:"90 天以上",v:sum(open.filter(m=>m.age>90),m=>m.amt),c:"var(--s5)"}
  ];
  const dso = open.length? Math.round(sum(open,m=>m.age)/open.length)+62 : 0;

  box.innerHTML=`
  <div class="grid g4" style="margin-bottom:12px">
    ${[["待开票",wan(sum(unb,m=>m.amt)),"万",`${unb.length} 笔已达成未开票 — 立即可开`,unb.length?"var(--warn)":"var(--ink)"],
       ["已开票未回款",wan(sum(open,m=>m.amt)),"万",`${open.length} 笔在途`,"var(--ink)"],
       ["账龄 60 天以上",wan(buckets[2].v+buckets[3].v),"万",`占应收 ${open.length?pct((buckets[2].v+buckets[3].v)/sum(open,m=>m.amt)):"—"}`,(buckets[2].v+buckets[3].v)?"var(--crit)":"var(--ink)"],
       ["DSO",dso,"天",`健康线 ≤ 75 天`,dso>75?"var(--crit)":"var(--ink)"]
     ].map(([l,v,u,n,c])=>`<div class="stat">
        <div class="kpi-l">${esc(l)}</div>
        <div class="num" style="font-size:24px;margin-top:3px;color:${c}">${v}<small style="font-size:12px;color:var(--ink-3);margin-left:2px">${u}</small></div>
        <div class="note">${esc(n)}</div></div>`).join("")}
  </div>
  <div class="grid g21" style="margin-bottom:12px">
    <div class="card">
      <div class="card-h"><h3>里程碑 → 开票 → 回款</h3><span class="sp"></span>
        ${unb.length?`<button class="btn btn-p" id="binv">一键生成 ${unb.length} 张发票申请</button>`:`<span class="pill p-good">无待开票</span>`}</div>
      <div class="tw"><table style="min-width:760px">
        <thead><tr><th>里程碑</th><th>中心</th><th class="ta-r">金额</th><th>达成日</th><th>状态</th><th class="ta-r">账龄</th><th></th></tr></thead>
        <tbody>${ms.slice().sort((a,b)=>b.hit.localeCompare(a.hit)).map(m=>{
          const s=site(m.ss);
          const stt = m.paid?["p-good","已回款"]:m.inv==="待开票"?["p-warn","待开票"]:m.age>60?["p-crit","逾期未回款"]:["p-neut","已开票"];
          return `<tr><td><div class="t-main">${esc(m.name)}</div><div class="t-sub">${esc(m.id)}</div></td>
            <td style="font-size:12px">${esc(s.hosp)}<div class="t-sub">${esc(S[s.sid].short)}</div></td>
            <td class="tnum">${n1(m.amt)} 万</td>
            <td class="mono" style="font-size:11.5px">${esc(m.hit)}</td>
            <td><span class="pill ${stt[0]}">${stt[1]}</span></td>
            <td class="tnum" style="${m.age>60?"color:var(--crit);font-weight:600":""}">${m.paid?"—":m.age+" 天"}</td>
            <td class="ta-r">${m.inv==="待开票"?`<button class="btn" data-inv="${m.id}">开票</button>`
              :!m.paid?`<button class="btn" data-pay="${m.id}">登记回款</button>`:""}</td></tr>`;}).join("")}
        </tbody></table></div>
    </div>
    <div class="stack">
      <div class="card">
        <div class="card-h"><h3>应收账龄分布</h3></div>
        <div class="card-b"><div id="c-age"></div></div>
      </div>
      <div class="card">
        <div class="card-h"><h3>收入确认证据链</h3></div>
        <div class="card-b">
          <div class="note" style="margin-bottom:10px">里程碑达成必须有可追溯凭证，否则开票时要人肉翻邮件 —— 这是账期被拖长的主因。</div>
          ${[["伦理批件","批件扫描件 + 批件号 + 生效日"],
             ["中心启动 SIV","启动会签到表 + 培训记录 + MVR"],
             ["首例入组 FPI","随机号/筛选号 + 知情同意签署日"],
             ["入组过半 / 80%","系统入组计数（不含受试者身份信息）"],
             ["末例出组 LPO","末次访视完成确认"],
             ["数据库锁定 DBL","锁库确认函"]
           ].map(([a,b])=>`<div style="display:grid;grid-template-columns:100px 1fr;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:12px">
             <b style="font-weight:500">${esc(a)}</b><span class="t-mut">${esc(b)}</span></div>`).join("")}
        </div>
      </div>
    </div>
  </div>
  <p class="note">合规提示：本模块只使用入组「计数」与随机号，不存储任何受试者可识别信息。</p>`;

  hbars($("#c-age"), buckets.map(b=>({label:b.n,v:b.v,color:b.c,
    tip:`<div class="tip-t">${esc(b.n)}</div><div class="tip-r"><span>金额</span><b>${n1(b.v)} 万</b></div>`})),
    {fmt:n1,unit:" 万",h:12,gap:11});

  box.addEventListener("click",e=>{
    const i=e.target.closest("[data-inv]");
    if(i){ const m=MILES.find(x=>x.id===i.dataset.inv); m.inv="已开票"; m.age=0;
      m.due=new Date(Date.now()+60*864e5).toISOString().slice(0,10);
      toast(`${m.id} 已开票 ${n1(m.amt)} 万，账期 60 天，到期日 ${m.due}`); render(); return; }
    const p=e.target.closest("[data-pay]");
    if(p){ const m=MILES.find(x=>x.id===p.dataset.pay); m.paid=true; m.age=0;
      toast(`${m.id} 回款 ${n1(m.amt)} 万已登记，DSO 同步更新`); render(); return; }
    if(e.target.closest("#binv")){
      const t=sum(unb,m=>m.amt);
      unb.forEach(m=>{m.inv="已开票";m.age=0;m.due=new Date(Date.now()+60*864e5).toISOString().slice(0,10);});
      toast(`已生成 ${unb.length} 张发票申请，合计 ${n1(t)} 万`); render(); }
  });
};
</script>
<script>
"use strict";
/* ════════════════ 8 · 质量事件与 CAPA ════════════════ */
VIEWS.qa = box=>{
  const ids=scopeIds();
  let list=ISSUES.filter(i=>ids.has(i.ss));
  if(state.sevFilter.size) list=list.filter(i=>state.sevFilter.has(i.sev));
  const openN=ISSUES.filter(i=>ids.has(i.ss)&&i.st!=="已关闭");
  const sae=ISSUES.find(i=>i.sla&&i.st!=="已关闭"&&ids.has(i.ss));
  const overdue=openN.filter(i=>days(TODAY,i.due)<0);

  const SA=saeStats(ids), QS=queryStats(ids);

  box.innerHTML=`
  <div class="grid g4" style="margin-bottom:12px">
    ${[["未关闭事件",openN.length,"项",`重大/严重 ${openN.filter(i=>i.sev!=="一般").length} 项`,openN.filter(i=>i.sev!=="一般").length?"var(--crit)":"var(--ink)"],
       ["SAE 24h 上报及时率",SA.rate===null?"—":n1(SA.rate*100),"%",`${SA.ok} / ${SA.n} 例在 ${SAE_SLA} 小时内上报`,SA.rate===1?"var(--good)":"var(--crit)"],
       ["Query 平均挂起",QS.avg===null?"—":n1(QS.avg),"天",`${QS.n} 条 · 超 7 天 ${QS.over7} 条`,QS.avg>7?"var(--crit)":QS.avg>5?"var(--warn)":"var(--ink)"],
       ["CAPA 逾期",overdue.length,"项",overdue.length?"已超整改到期日":"全部在期内",overdue.length?"var(--crit)":"var(--ink)"]
     ].map(([l,v,u,n,c])=>`<div class="stat">
        <div class="kpi-l">${esc(l)}</div>
        <div class="num" style="font-size:24px;margin-top:3px;color:${c}">${v}<small style="font-size:12px;color:var(--ink-3);margin-left:2px">${u}</small></div>
        <div class="note">${esc(n)}</div></div>`).join("")}
  </div>

  ${sae?`<div class="card alert alert-crit" style="margin-bottom:28px">
    <div class="card-h">
      <span class="dot" style="background:var(--crit)"></span>
      <h3>SAE 上报时限监控 · ${esc(sae.id)}</h3><span class="sp"></span>
      <span class="pill p-crit">已超窗</span></div>
    <div class="card-b">
      <div class="grid g3" style="gap:14px;align-items:center">
        <div><div class="kpi-l">监管时限</div><div class="num" style="font-size:26px;margin-top:3px">${sae.sla}<small style="font-size:12px;color:var(--ink-3)"> 小时</small></div>
          <div class="note">研究者知晓起算</div></div>
        <div><div class="kpi-l">实际上报耗时</div><div class="num" style="font-size:26px;margin-top:3px;color:var(--crit)">${sae.elapsed}<small style="font-size:12px;color:var(--ink-3)"> 小时</small></div>
          <div class="note">超出 ${n1(sae.elapsed-sae.sla)} 小时</div></div>
        <div><div class="kpi-l">CAPA 剩余时间</div>
          <div class="num" id="cd" style="font-size:26px;margin-top:3px;color:var(--warn)">—</div>
          <div class="note">整改到期 ${esc(sae.due)}</div></div>
      </div>
      <div class="bartrack" style="height:8px;margin-top:14px;position:relative">
        <div class="barfill" style="width:${clamp(sae.sla/sae.elapsed*100,0,100)}%;background:var(--good);height:100%"></div>
        <div style="position:absolute;left:${clamp(sae.sla/sae.elapsed*100,0,100)}%;right:0;top:0;bottom:0;background:var(--crit)"></div>
      </div>
      <div class="note" style="margin-top:6px">绿色 = 窗口内，红色 = 超窗部分。SAE 24 小时上报及时率必须 100% —— 这是红线，不是 KPI。</div>
    </div></div>`:""}

  <div class="card" style="margin-bottom:12px">
    <div class="card-h"><h3>SAE 上报时限台账</h3><span class="sp"></span>
      <span class="sub">及时率由这张表算出，不是写死的数</span></div>
    <div class="tw"><table style="min-width:680px">
      <thead><tr><th>编号</th><th>中心</th><th>受试者</th><th>事件名称</th><th>研究者知晓</th><th>上报申办方</th><th class="ta-r">耗时</th><th>判定</th></tr></thead>
      <tbody>${SA.list.map(x=>{const ok=x.h<=SAE_SLA;
        return `<tr><td class="mono" style="font-size:11.5px">${esc(x.id)}</td>
          <td style="font-size:12px">${esc(site(x.ss).hosp)}</td>
          <td><span class="subjid">${esc(x.subj)}</span></td>
          <td class="t-sub">${esc(x.term)}</td>
          <td class="mono" style="font-size:11px">${esc(x.aware)}</td>
          <td class="mono" style="font-size:11px">${esc(x.rpt)}</td>
          <td class="tnum" style="color:${ok?"var(--good)":"var(--crit)"};font-weight:600">${n1(x.h)} h</td>
          <td><span class="pill ${ok?"p-good":"p-crit"}">${ok?"窗口内":"超窗"}</span></td></tr>`;}).join("")
        ||`<tr><td colspan="8"><div class="empty">范围内无 SAE 记录</div></td></tr>`}</tbody>
    </table></div>
  </div>
  <div class="card" style="margin-bottom:12px">
    <div class="card-h"><h3>问题发现来源</h3><span class="sp"></span>
      <span class="sub">分布本身就是质量指标</span></div>
    <div class="card-b">
      <div id="c-src2"></div>
      <div class="note" style="margin-top:11px;border-top:1px solid var(--line);padding-top:9px">
        前置发现（中心自查、机构质控、内部监查）占比越高，说明防线在起作用。
        如果问题主要由<b>申办方稽查或药监核查</b>发现，代价就不再是整改，而是数据被剔除、项目延期、供应商名录降级。</div>
    </div>
  </div>
  <div class="card">
    <div class="card-h" style="flex-wrap:wrap"><h3>事件台账</h3>
      <div class="row" style="gap:5px">${["重大","严重","一般"].map(s=>
        `<button class="chip" data-sev="${s}" aria-pressed="${state.sevFilter.has(s)}">${s}</button>`).join("")}</div>
      <span class="sp"></span><span class="sub">${list.length} 项</span></div>
    <div class="card-b" style="padding:0">
      ${list.length? list.map(i=>{
        const s=site(i.ss), sv=SEV[i.sev], od=i.st!=="已关闭"&&days(TODAY,i.due)<0;
        return `<div style="border-bottom:1px solid var(--line);position:relative">
          <span class="stripe" style="background:${i.st==="已关闭"?"var(--line-2)":sv.c}"></span>
          <button data-iss="${i.id}" style="width:100%;text-align:left;border:0;background:none;padding:12px 16px 12px 18px;cursor:pointer">
            <div class="row" style="gap:7px">
              <span class="pill p-${i.st==="已关闭"?"neut":sv.k}">${esc(i.sev)}</span>
              <b style="font-size:13px;font-weight:600">${esc(i.type)}</b>
              <span class="t-sub">${esc(i.id)}</span>
              <span class="pill p-neut">来源 ${esc(i.src||"—")}</span>
              <span class="sp"></span>
              <span class="pill ${i.st==="已关闭"?"p-good":od?"p-crit":"p-neut"}">${esc(i.st)}${od?" · 已逾期":""}</span>
            </div>
            <div class="note" style="margin-top:4px;color:var(--ink-2)">${esc(i.desc)}</div>
            <div class="note" style="margin-top:4px">${esc(s.hosp)} · ${esc(S[s.sid].short)}｜发现 ${esc(i.found)}｜责任人 ${esc(i.own)}｜CAPA 到期 ${esc(i.due)}</div>
          </button>
          <div id="d-${i.id}" hidden style="padding:0 16px 14px 18px">
            <div class="section-t">CAPA 纠正与预防措施</div>
            <div style="font-size:12.5px;line-height:1.7;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);padding:10px 12px;border-radius:8px">${esc(i.capa)}</div>
            ${i.st!=="已关闭"?`<div class="row" style="margin-top:10px">
              <button class="btn btn-p" data-close-iss="${i.id}">验证通过并关闭</button>
              <button class="btn" data-goto3="${i.ss}">查看中心</button></div>`
              :`<div class="pill p-good" style="margin-top:10px">该事件已验证关闭</div>`}
          </div>
        </div>`;}).join("") : `<div class="empty">当前筛选下无事件</div>`}
    </div>
  </div>`;

  const bySrc={}; ISSUES.filter(i=>ids.has(i.ss)).forEach(i=>bySrc[i.src]=(bySrc[i.src]||0)+1);
  const ORD=["中心自查","机构质控","内部监查","申办方稽查","药监核查"];
  const COL={"机构质控":"var(--s1)","中心自查":"var(--s3)","内部监查":"var(--s2)",
             "申办方稽查":"var(--s4)","药监核查":"var(--s5)"};
  stacked($("#c-src2"), ORD.filter(k=>bySrc[k]).map(k=>({n:k,v:bySrc[k],c:COL[k]})),{h:28,fmt:v=>v+" 项"});

  if(sae){ const tick=()=>{ const el=$("#cd"); if(!el) return;
      const ms=new Date(sae.due+"T18:00:00")-new Date(TODAY+"T"+new Date().toTimeString().slice(0,8));
      const h=Math.max(0,Math.floor(ms/36e5)), m=Math.max(0,Math.floor(ms%36e5/6e4)), s2=Math.max(0,Math.floor(ms%6e4/1000));
      el.textContent=`${h}:${String(m).padStart(2,"0")}:${String(s2).padStart(2,"0")}`; };
    tick(); timers.push(setInterval(tick,1000)); }

  box.addEventListener("click",e=>{
    const c=e.target.closest("[data-sev]");
    if(c){const v=c.dataset.sev; state.sevFilter.has(v)?state.sevFilter.delete(v):state.sevFilter.add(v); render(); return;}
    const cl=e.target.closest("[data-close-iss]");
    if(cl){const i=ISSUES.find(x=>x.id===cl.dataset.closeIss); i.st="已关闭";
      toast(`${i.id} 已验证关闭，未关闭事件减至 ${ISSUES.filter(x=>x.st!=="已关闭").length} 项`); render(); return;}
    const g=e.target.closest("[data-goto3]"); if(g){openSite(g.dataset.goto3);return;}
    const b=e.target.closest("[data-iss]");
    if(b){const d=$("#d-"+b.dataset.iss); if(d) d.hidden=!d.hidden;}
  });
};

/* ════════════════ 9 · 监查访视 ════════════════ */
VIEWS.mon = box=>{
  const ids=scopeIds();
  const vs=VISITS.filter(v=>ids.has(v.ss));
  const sel=vs[clamp(state.visitSel,0,vs.length-1)];
  const totItems=sum(vs,v=>v.items.length), doneItems=sum(vs,v=>v.items.filter(i=>i.done).length);
  const byKind=["SIV","IMV","COV"].map((k,i)=>({n:k,v:vs.filter(v=>v.kind===k).length,c:`var(--s${i+1})`}));

  box.innerHTML=`
  <div class="grid g4" style="margin-bottom:12px">
    ${[["未来 4 周访视",vs.length,"次",`共 ${sum(vs,v=>v.days)} 人天`],
       ["MVR 跟进项",`${doneItems} / ${totItems}`,"",`完成率 ${totItems?pct(doneItems/totItems):"—"}`],
       ["待确认排期",vs.filter(v=>v.st==="待确认").length,"次","需与中心确认时间"],
       ["预估差旅",n1(vs.length*RATE.travel),"万",`${RATE.travel} 万/次 × ${vs.length} 次`]
     ].map(([l,v,u,n])=>`<div class="stat">
        <div class="kpi-l">${esc(l)}</div>

        <div class="card-b" style="padding:0">

              <div class="row" style="gap:7px">
                <span class="mono" style="font-size:11.5px;color:var(--ink-3)">${esc(v.d)}</span>
                <span class="pill p-acc">${esc(v.kind)}</span>
                <span class="sp"></span>
                <span class="pill ${v.st==="待确认"?"p-warn":"p-neut"}">${esc(v.st)}</span></div>
              <div style="font-size:12.5px;font-weight:500;margin-top:4px">${esc(s.hosp)}</div>
              <div class="note">${esc(v.who)} · ${v.days} 天 · 跟进项 ${done}/${v.items.length}</div>
              <div class="bartrack" style="height:3px;margin-top:6px"><div class="barfill" style="width:${done/v.items.length*100}%;background:${done===v.items.length?"var(--good)":"var(--accent)"};height:100%"></div></div>
            </button>`;}).join("") || `<div class="empty">当前项目范围内无排期</div>`}
        </div>
      </div>
      <div class="card"><div class="card-h"><h3>访视类型构成</h3></div>
        <div class="card-b"><div id="c-vk"></div></div></div>
    </div>
    ${sel?`<div class="card">
      <div class="card-h"><h3>监查报告跟进项（MVR Follow-up）</h3><span class="sp"></span>
        <span class="pill p-neut">${esc(sel.d)} · ${esc(sel.kind)} · ${esc(sel.who)}</span></div>
      <div class="card-b">
        <div class="row" style="justify-content:space-between;margin-bottom:12px">
          <div><div style="font-size:14px;font-weight:600">${esc(site(sel.ss).hosp)}</div>
            <div class="note">${esc(S[site(sel.ss).sid].short)} · ${esc(site(sel.ss).city)} · PI ${esc(site(sel.ss).pi)}</div></div>
          <div class="ta-r"><div class="num" style="font-size:22px" id="mv-n">${sel.items.filter(i=>i.done).length} / ${sel.items.length}</div>
            <div class="note">已关闭</div></div>
        </div>
        <div class="bartrack" style="height:6px;margin-bottom:14px"><div class="barfill" id="mv-b" style="width:${sel.items.filter(i=>i.done).length/sel.items.length*100}%;background:var(--accent);height:100%"></div></div>
        <div id="mv-list">${sel.items.map((it,k)=>`
          <label class="cbx ${it.done?"done":""}" style="border-bottom:1px solid var(--line)">
            <input type="checkbox" data-mv="${k}" ${it.done?"checked":""}><span>${esc(it.t)}</span></label>`).join("")}</div>
        <div class="row" style="margin-top:14px">
          <button class="btn btn-p" id="mv-submit">提交 MVR</button>
          <button class="btn" data-goto3b="${sel.ss}">查看中心</button>
          <span class="sp"></span>
          <span class="note">跟进项全部关闭后才可提交监查报告</span></div>
        <div class="formula" style="margin-top:14px">
监查频率来自风险分级，不是一刀切：
质量稳定中心 → 降低 SDV 抽样比例、延长 IMV 间隔
入组停滞 / 有未关闭严重事件 → 加密监查
        </div>
      </div>
    </div>`:`<div class="card"><div class="empty">选择左侧一次访视查看跟进项</div></div>`}
  </div>`;

  stacked($("#c-vk"), byKind.filter(b=>b.v), {h:24, fmt:v=>v+" 次"});

  box.addEventListener("click",e=>{
    const v=e.target.closest("[data-v]"); if(v){state.visitSel=+v.dataset.v;render();return;}
    const g=e.target.closest("[data-goto3b]"); if(g){openSite(g.dataset.goto3b);return;}
    if(e.target.closest("#mv-submit")){
      const left=sel.items.filter(i=>!i.done).length;
      if(left) toast(`还有 ${left} 项跟进项未关闭，MVR 无法提交`,"crit");
      else { sel.st="已提交"; toast(`${site(sel.ss).hosp} ${sel.kind} 监查报告已提交`); render(); }
    }
  });
  box.addEventListener("change",e=>{
    const c=e.target.closest("[data-mv]"); if(!c)return;
    sel.items[+c.dataset.mv].done=c.checked;
    c.closest("label").classList.toggle("done",c.checked);
    const d=sel.items.filter(i=>i.done).length;
    $("#mv-n").textContent=`${d} / ${sel.items.length}`;
    $("#mv-b").style.width=d/sel.items.length*100+"%";
    $("#mv-b").style.background = d===sel.items.length?"var(--good)":"var(--accent)";
  });
};

<script>
"use strict";
/* ════════════════ 10 · 报价模型 ════════════════
   人天口径与「工时与差旅」「成本与毛利」完全一致 —— 报价不是拍脑袋，
   是把自己历史真实消耗的人天，按新项目的参数重新展开一次。          */
const PRICE = {sites:12, pts:20, months:20, visits:11, cx:1.2, imv:1.5, fte:0.55, target:0.30, sfr:0.35};
const SCR_MD = 1.6;   // 每例筛败消耗的 CRC 人天：知情、入排核对、筛选期检查陪同

function calcPrice(p){
  const total = p.sites * p.pts;                                  // 总入组例数
  const sfr   = p.sfr ?? 0;
  const scr   = sfr<1 ? total/(1-sfr) : total;                    // 需筛选例数
  const fail  = Math.round(scr - total);                          // 筛败例数
  // CRC 人天
  const crcSetup = p.sites * 12;                                  // 每中心启动+关闭固定
  const crcBase  = p.sites * p.months * RATE.workdays * p.fte;    // 驻场基线
  const crcVisit = total * p.visits * 0.5 * p.cx;                 // 入组受试者访视陪同
  const crcScr   = fail * SCR_MD * p.cx;                          // 筛败受试者的筛选期工作量
  const crcMd = crcSetup + crcBase + crcVisit + crcScr;
  // CRA 人天
  const nIMV = Math.round(p.months / p.imv);
  const craSiv = p.sites * 2, craImv = p.sites * nIMV * 1.5, craCov = p.sites * 1.5;
  const craReport = (craSiv + craImv + craCov) * 0.6;             // 远程跟进与报告
  const craMd = craSiv + craImv + craCov + craReport;
  // 费用
  const trips  = p.sites * (nIMV + 2);
  const crcCost = crcMd * RATE.crcDay, craCost = craMd * RATE.craDay;
  const travel  = trips * RATE.travel;
  const oh      = (crcCost + craCost) * RATE.overhead;
  const cost    = crcCost + craCost + travel + oh;
  const quote   = cost / (1 - p.target);
  /* 单价由「入组 + 筛败折算」共同摊：筛败按入组单价的 SF_FEE 计价 */
  const billUnits = total + fail*SF_FEE;
  const unit    = billUnits>0 ? quote/billUnits : 0;
  return {total, scr:Math.round(scr), fail, crcMd, craMd, crcScr, nIMV, trips,
          crcCost, craCost, travel, oh, cost, quote, unit, billUnits,
          sfRev: fail*SF_FEE*unit, mdPerPt:(crcMd+craMd)/total};
}
/* 历史实际：从真实数据反推（这是护城河的来源）
   对标基准只取入组完成度 ≥ 80% 的中心 —— 启动成本已充分摊薄，
   人天/例与每例成本才具备可比性；未摊薄的中心仅列出参考。      */
function historic(){
  return SITES.filter(s=>s.enrolled>=8).map(s=>{const m=siteM(s);
    return {n:s.hosp, ph:S[s.sid].phase, unit:s.unit, cost:m.cpe, md:m.mdPerPt,
            gm:m.gm, prog:m.prog, base:m.prog>=0.8};});
}
const baseline = ()=>{ const b=historic().filter(h=>h.base);
  return {md:sum(b,h=>h.md)/b.length, cost:sum(b,h=>h.cost)/b.length,
          unit:sum(b,h=>h.unit)/b.length, n:b.length}; };

VIEWS.price = box=>{
  const P={...PRICE, ...(state.price||{})};
  const F = [
    {k:"sites", t:"参研中心数", min:2, max:40, step:1, u:" 个"},
    {k:"pts",   t:"每中心入组例数", min:5, max:60, step:1, u:" 例"},
    {k:"months",t:"入组期（月）", min:6, max:36, step:1, u:" 个月"},
    {k:"visits",t:"每例访视次数", min:3, max:20, step:1, u:" 次"},
    {k:"cx",    t:"方案复杂度系数", min:0.8, max:2, step:.05, u:"×", note:"肿瘤/罕见病 1.3–1.8；慢病 1.0"},
    {k:"imv",   t:"监查间隔（月）", min:0.5, max:4, step:.5, u:" 个月/次"},
    {k:"fte",   t:"CRC 驻场 FTE", min:.1, max:1, step:.05, u:"", fmt:v=>pct(v)},
    {k:"sfr",   t:"预期筛败率", min:0, max:.7, step:.01, u:"", fmt:v=>pct(v),
     note:"肿瘤 II/III 期常见 45%–60%；慢病 20%–35%。漏掉这一项会同时低估成本和收入"},
    {k:"target",t:"目标毛利率", min:.1, max:.5, step:.01, u:"", fmt:v=>pct(v)}
  ];
  box.innerHTML=`
  <div class="grid g12" style="gap:14px">
    <div class="card">
      <div class="card-h"><h3>项目参数</h3><span class="sp"></span><button class="btn" id="p-rst">重置</button></div>
      <div class="card-b">
        ${F.map(f=>`<div class="field">
          <div class="slider-h"><label for="f-${f.k}">${esc(f.t)}</label><b id="v-${f.k}"></b></div>
          <input type="range" id="f-${f.k}" data-k="${f.k}" min="${f.min}" max="${f.max}" step="${f.step}" value="${P[f.k]}">
          ${f.note?`<div class="note">${esc(f.note)}</div>`:""}
        </div>`).join("")}
      </div>
    </div>
    <div class="stack">
      <div class="grid g4" style="gap:10px">
        ${["建议报价总额","单例报价","预估总成本","人天/例"].map((l,i)=>`
          <div class="stat${i===0?" stat-hi":""}">
            <div class="kpi-l">${esc(l)}</div>
            <div class="num" id="o-${i}" style="font-size:${i===0?"26":"23"}px;margin-top:3px;${i===0?"color:var(--accent)":""}">—</div>
            <div class="note" id="n-${i}"></div></div>`).join("")}
      </div>
      <div class="card">
        <div class="card-h"><h3>成本构成推演</h3><span class="sub">改动左侧任一参数即时重算</span></div>
        <div class="card-b"><div id="p-stack"></div>
          <div class="hr"></div>
          <div class="grid g2" style="gap:14px">
            <div><div class="section-t">CRC 人天分解</div><div id="p-crc"></div></div>
            <div><div class="section-t">CRA 人天分解</div><div id="p-cra"></div></div>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-h"><h3>与历史实际对标</h3><span class="sub">这才是报价模型的护城河</span></div>
        <div class="card-b">
          <div class="note" style="margin-bottom:10px">下表是本公司已入组中心的<b>真实</b>单例成本与人天消耗。对手报价靠经验，你靠自己三年的成本数据库 —— 别人买不到，也抄不走。<br>
            对标基准只取<b>入组完成度 ≥ 80%</b> 的中心（下表加粗行，共 ${baseline().n} 个）：启动成本已充分摊薄，人天/例才具可比性；其余行仅作参考。</div>
          <div class="tw"><table style="min-width:660px">
            <thead><tr><th>中心</th><th>期别</th><th class="ta-r">完成度</th><th class="ta-r">实际单价</th><th class="ta-r">实际每例成本</th><th class="ta-r">实际人天/例</th><th class="ta-r">实际毛利率</th></tr></thead>
            <tbody>${historic().map(h=>`<tr style="${h.base?"font-weight:500":"opacity:.62"}">
              <td style="font-size:12px">${esc(h.n)}${h.base?` <span class="pill p-acc">基准</span>`:""}</td><td class="t-sub">${esc(h.ph)}</td>
              <td class="tnum">${pct(h.prog)}</td>
              <td class="tnum">${n1(h.unit)} 万</td><td class="tnum">${n1(h.cost)} 万</td>
              <td class="tnum">${n1(h.md)}</td>
              <td class="tnum" style="color:${h.gm<0?"var(--crit)":h.gm<.2?"var(--warn)":"var(--ink)"}">${pct(h.gm)}</td></tr>`).join("")}</tbody>
          </table></div>
          <div id="p-bench" style="margin-top:12px"></div>
        </div>
      </div>
      <div class="card">
        <div class="card-h"><h3>计算口径</h3><span class="sub">全部公式可追溯，无黑箱</span></div>
        <div class="card-b"><div class="formula" id="p-form"></div></div>
      </div>
    </div>
  </div>`;

  const upd=()=>{
    const r=calcPrice(P);
    F.forEach(f=>$("#v-"+f.k).textContent = (f.fmt?f.fmt(P[f.k]):P[f.k])+(f.u||""));
    $("#o-0").innerHTML=`${n1(r.quote)}<small style="font-size:12px;color:var(--ink-3);margin-left:2px">万元</small>`;
    $("#n-0").textContent=`目标毛利率 ${pct(P.target)} · 共 ${r.total} 例`;
    $("#o-1").innerHTML=`${n1(r.unit)}<small style="font-size:12px;color:var(--ink-3);margin-left:2px">万/例</small>`;
    $("#n-1").innerHTML=`需筛 ${r.scr} → 入组 ${r.total} · 筛败 ${r.fail}<br>
      <span class="t-mut">若合同不含筛败费，单价须报 ${n1(r.quote/r.total)} 万</span>`;
    $("#o-2").innerHTML=`${n1(r.cost)}<small style="font-size:12px;color:var(--ink-3);margin-left:2px">万元</small>`;
    $("#n-2").textContent=`CRC ${n0(r.crcMd)} + CRA ${n0(r.craMd)} 人天`;
    $("#o-3").textContent=n1(r.mdPerPt);
    const bl=baseline();
    $("#n-3").innerHTML=`基准均值 ${n1(bl.md)} · <span style="color:${r.mdPerPt<bl.md*0.85?"var(--crit)":r.mdPerPt>bl.md*1.2?"var(--warn)":"var(--ink)"}">${
      r.mdPerPt<bl.md*0.85?"低于历史，报价偏乐观":r.mdPerPt>bl.md*1.2?"高于历史，易失标":"与历史相符"}</span>`;

    stacked($("#p-stack"),[
      {n:"CRC 人力",v:r.crcCost},{n:"CRA 人力",v:r.craCost},
      {n:"差旅",v:r.travel},{n:"职能分摊",v:r.oh},
      {n:"目标毛利",v:r.quote-r.cost}],{h:30});
    hbars($("#p-crc"),[
      {label:"启动与关闭",v:P.sites*12},
      {label:"驻场基线",v:P.sites*P.months*RATE.workdays*P.fte},
      {label:"入组访视陪同",v:r.total*P.visits*0.5*P.cx},
      {label:`筛败筛选期 ×${r.fail}`,v:r.crcScr,color:"var(--s3)"}],{fmt:n0,unit:" 人天",h:12,gap:10});
    hbars($("#p-cra"),[
      {label:"SIV 启动",v:P.sites*2},
      {label:`IMV ×${r.nIMV} 轮`,v:P.sites*r.nIMV*1.5},
      {label:"COV 关闭",v:P.sites*1.5},
      {label:"报告与远程",v:(P.sites*2+P.sites*r.nIMV*1.5+P.sites*1.5)*0.6}],{fmt:n0,unit:" 人天",h:12,gap:10});

    const myCost=r.cost/r.total, dev=(myCost-bl.cost)/bl.cost, ok=Math.abs(dev)<0.2;
    $("#p-bench").innerHTML=`<div style="border-left:2px solid var(--${ok?"good":"warn"});background:var(--${ok?"good":"warn"}-soft);padding:9px 12px;font-size:12.5px;color:var(--ink-2);line-height:1.65">
      本次测算每例成本 <b class="mono">${n1(myCost)} 万</b>，基准中心实际均值 <b class="mono">${n1(bl.cost)} 万</b>，偏离 <b class="mono">${dev>0?"+":""}${pct(dev)}</b>；
      建议单价 <b class="mono">${n1(r.unit)} 万</b>，历史成交均价 <b class="mono">${n1(bl.unit)} 万</b>。
      ${ok?"与历史经验一致，报价可信。":dev>0?"高于历史水平，检查是否高估了访视次数或驻场 FTE，否则容易在投标中失标。":"低于历史水平，警惕报低了硬做 —— 这是亏损单最常见的来源。"}</div>`;

    $("#p-form").textContent =
`总例数 = ${P.sites} 中心 × ${P.pts} 例 = ${r.total} 例

需筛例数 = ${r.total} ÷ (1 − 筛败率 ${pct(P.sfr)}) = ${r.scr} 例，其中筛败 ${r.fail} 例

CRC 人天 = 启动关闭 ${P.sites}×12
         + 驻场 ${P.sites}×${P.months}月×${RATE.workdays}天×${pct(P.fte)}
         + 入组访视 ${r.total}例×${P.visits}次×0.5×${P.cx}
         + 筛败筛选期 ${r.fail}例×${SCR_MD}×${P.cx}
         = ${n0(r.crcMd)} 人天

CRA 人天 = SIV ${P.sites}×2 + IMV ${P.sites}×${r.nIMV}轮×1.5
         + COV ${P.sites}×1.5 + 报告×0.6
         = ${n0(r.craMd)} 人天

成本 = ${n0(r.crcMd)}×${RATE.crcDay} + ${n0(r.craMd)}×${RATE.craDay}
     + 差旅 ${r.trips}次×${RATE.travel} + 分摊×${pct(RATE.overhead)}
     = ${n1(r.cost)} 万

报价 = 成本 ÷ (1 − ${pct(P.target)}) = ${n1(r.quote)} 万
计价单位 = 入组 ${r.total} + 筛败 ${r.fail}×${pct(SF_FEE)} = ${n1(r.billUnits)}
单例入组价 = ${n1(r.quote)} ÷ ${n1(r.billUnits)} = ${n1(r.unit)} 万
筛败单价 = ${n1(r.unit)}×${pct(SF_FEE)} = ${n1(r.unit*SF_FEE)} 万

谈判用：合同含筛败费 → 入组单价 ${n1(r.unit)} 万
        合同不含筛败费 → 入组单价必须 ${n1(r.quote/r.total)} 万（+${pct(r.quote/r.total/r.unit-1)}）
        —— 同样的总价，两种拆法。申办方砍筛败费时，这就是把单价顶回去的依据。`;
  };
  upd();
  box.addEventListener("input",e=>{ const i=e.target.closest("[data-k]"); if(!i)return;
    P[i.dataset.k]=+i.value; state.price={...P}; upd(); });
  $("#p-rst").addEventListener("click",()=>{ state.price=null; render();
    toast("参数已重置为默认方案"); });
};

</script>
<script>
"use strict";
/* ════════════════════════════════════════════════════════════════════
   CRC 端 —— 现场协调员。手机为主、时间碎片、最怕访视超窗。
   ════════════════════════════════════════════════════════════════════ */

const mySubj = ()=>SUBJ.filter(s=>s.crc===PERSONA().n && s.st!=="筛败" && s.st!=="已出组")
  .sort((a,b)=>winState(a).rem-winState(b).rem);
const CONTACT = {"已确认":{k:"good"},"待联系":{k:"warn"},"已改期":{k:"warn"},"失联":{k:"crit"}};

/* 窗口条：把 [目标日−窗口, 目标日+窗口] 画出来并标出今天 —— 不靠人记 */
function winBar(s){
  const w=winState(s), pad=3, span=s.win*2+pad*2;
  const l=(pad/span*100), width=((s.win*2)/span*100);
  const off=days(new Date(new Date(s.due).getTime()-(s.win+pad)*864e5).toISOString().slice(0,10),TODAY);
  const now=clamp(off/span*100,0,100);
  return `<div class="winbar" title="窗口 ${w.first} ～ ${w.last}">
    <div class="ok" style="left:${l}%;width:${width}%"></div>
    <div class="now" style="left:${now}%"></div>
    <div class="lbl">${esc(w.first)} ～ ${esc(w.last)}</div></div>`;
}
function subjCard(s,{open=false}={}){
  const w=winState(s), ss=site(s.ss), d=subjDone(s), cs=CONTACT[s.contact]||{k:"neut"};
  const lag=edcLag(s), late=edcLate(s), scr=s.st==="筛选中";
  return `<div class="tcard ${w.k==="good"?"":w.k}" data-sc="${s.id}">

VIEWS.subj = box=>{
  const list=mySubj();
  const failed=SUBJ.filter(s=>s.crc===PERSONA().n&&s.st==="筛败");

  box.innerHTML=`
  <div class="grid g4" style="gap:10px;margin-bottom:14px">
    ${[["已超窗 / 今明到期",g.crit.length,"例","var(--crit)","超窗即方案偏离，必须当天处理"],
       ["窗口临期",g.warn.length,"例","var(--warn)","3 天内必须完成"],

     ].map(([l,v,u,c,n])=>`<div class="stat">

        <div class="num" style="font-size:24px;margin-top:3px;color:${c}">${v}<small style="font-size:12px;color:var(--ink-3);margin-left:2px">${u}</small></div>

  </div>
  ${["crit","warn","good"].map(k=>g[k].length?`
    <div class="section-t">${k==="crit"?"立即处理":k==="warn"?"三天内":"窗口内"}（${g[k].length}）</div>
    <div class="grid g2" style="gap:10px;margin-bottom:16px">${g[k].map(s=>subjCard(s,{open:k==="crit"})).join("")}</div>`:"").join("")}
  ${failed.length?`<div class="section-t">已登记筛败（${failed.length}）</div>
    <div class="card" style="margin-bottom:14px"><div class="card-b" style="padding:0">
      ${failed.map(s=>`<div style="padding:9px 14px;border-bottom:1px solid var(--line)">
        <div class="row" style="gap:6px"><span class="subjid">${esc(s.id)}</span>
          <span class="pill p-neut">${esc(s.sfWhy||"未填写原因")}</span>
          <span class="t-sub">${esc(site(s.ss).hosp)}</span></div></div>`).join("")}
    </div></div>`:""}
  <div class="formula">窗口状态由日期算出，不是人工标注：
剩余 = (目标日 + 窗口天数) − 今天｜&lt;0 已超窗（自动生成方案偏离）｜≤1 今明到期｜≤3 临期

完成访视 = 勾完全部任务 → 记工时（关联到本次访视）→ 转研究者确认 → 自动生成下一次访视窗口
受试者不会因为做完一次访视就从系统里消失 —— 他有生命周期，直到出组。</div>`;
  wireSubj(box);
};

function wireSubj(box){
  box.addEventListener("click",e=>{
    const x=e.target.closest("[data-sx]");
    if(x){ const d=$("#sx-"+x.dataset.sx); if(d){ d.hidden=!d.hidden; x.textContent=d.hidden?"展开任务":"收起"; } return; }
    const g=e.target.closest("[data-goto4]"); if(g){ openSite(g.dataset.goto4); return; }
    const ed=e.target.closest("[data-edc]");
    if(ed){ const s=SUBJ.find(x=>x.id===ed.dataset.edc); const lag=edcLag(s);
      s.edc="已录入";
      toast(lag>5? `${s.id} EDC 已录入，滞后 ${lag} 天 —— 超出 5 个工作日及时线` : `${s.id} EDC 已录入（滞后 ${lag} 天）`,
        lag>5?"warn":""); render(); return; }
    const ct=e.target.closest("[data-ct]");
    if(ct){ const s=SUBJ.find(x=>x.id===ct.dataset.ct);
      const order=["待联系","已确认","已改期","失联"];
      s.contact=order[(order.indexOf(s.contact)+1)%order.length];
      if(s.contact==="已改期"){ s.due=new Date(new Date(s.due).getTime()+7*864e5).toISOString().slice(0,10);
        toast(`${s.id} 已改期，目标日顺延至 ${s.due}，窗口已重算`,"warn"); }
      else toast(`${s.id} 联系状态：${s.contact}`);
      render(); return; }
    const sf=e.target.closest("[data-sfail]"); if(sf){ failModal(sf.dataset.sfail); return; }
    const dn=e.target.closest("[data-sdone]"); if(dn){ doneModal(dn.dataset.sdone); return; }
  });
  box.addEventListener("change",e=>{
    const c=e.target.closest("[data-st]"); if(!c) return;
    const [id,k]=c.dataset.st.split(":");
    const s=SUBJ.find(x=>x.id===id); s.tasks[+k][1]=c.checked?1:0;
    c.closest("label").classList.toggle("done",c.checked);
    const card=c.closest(".tcard"), d=subjDone(s);
    card.querySelector(".bartrack .barfill").style.width=d/s.tasks.length*100+"%";
    card.querySelector(".bartrack .barfill").style.background=d===s.tasks.length?"var(--good)":"var(--accent)";
    card.querySelector(".note").textContent=`访视任务 ${d} / ${s.tasks.length}`;
  });
}

/* ── 完成访视：与工时同一次录入，这样「每次访视实际耗时」才算得出来 ── */
function doneModal(id){
  const s=SUBJ.find(x=>x.id===id), left=s.tasks.filter(t=>!t[1]).length;
  if(left){ toast(`还有 ${left} 项访视任务未完成，无法标记完成`,"crit"); return; }
  const w=winState(s), sc=soa(s.ss);
  openLayer($("#modal"),`
    <div class="drawer-h"><div style="flex:1">
      <div class="section-t" style="margin:0 0 3px">${esc(s.id)} · ${esc(site(s.ss).hosp)}</div>
      <h3 style="font-size:15px">${esc(soaLabel(s.ss,s.seq))} 完成登记</h3></div>
      <button class="x" data-close aria-label="关闭">✕</button></div>
    <div style="padding:16px 18px 18px">
      ${w.dev?`<div style="border-left:2px solid var(--crit);background:var(--crit-soft);padding:9px 11px;font-size:12.5px;color:var(--ink-2);line-height:1.6;margin-bottom:12px">
        <b style="color:var(--crit)">本次访视已超窗 ${Math.abs(w.rem)} 天</b>（窗口 ${w.first} ～ ${w.last}）。
        提交后将自动生成方案偏离质量事件，并进入研究者签字流程。</div>`:""}
      <div class="field"><div class="slider-h"><label for="dv-h">本次访视陪同耗时</label><b id="dv-hv">4.0 小时</b></div>
        <input type="range" id="dv-h" min="0.5" max="12" step="0.5" value="4"></div>
      <div class="field"><label class="cbx"><input type="checkbox" id="dv-pay" checked><span>本次访视发放受试者补偿（交通 + 营养费）</span></label></div>
      <div style="border:1px solid var(--line);background:var(--surface-2);padding:9px 11px;border-radius:8px;font-size:12px;color:var(--ink-2);line-height:1.7;margin-bottom:12px">
        提交后系统会一次性完成：<br>
        ① 记一条工时，<b>关联到本次访视</b>（这样「每次访视实际耗时」才算得出来）<br>
        ② 成本归集到 ${esc(site(s.ss).hosp)}<br>
        ③ 本次访视记录转研究者 ${esc(site(s.ss).pi)} 签署确认<br>
        ④ 自动生成下一次访视：<b>${esc(soaLabel(s.ss, s.seq+1))}</b>，目标日 ${
          new Date(new Date(s.due).getTime()+sc.cycle*864e5).toISOString().slice(0,10)} ± ${sc.win} 天
      </div>
      <div class="row" style="justify-content:flex-end">
        <button class="btn" data-close>取消</button>
        <button class="btn btn-p" id="dv-go">提交</button></div>
    </div>`);
  $("#dv-h").addEventListener("input",e=>$("#dv-hv").textContent=(+e.target.value).toFixed(1)+" 小时");
  $("#dv-go").addEventListener("click",()=>{
    const h=+$("#dv-h").value, me=PERSONA().n, p=staff(me), ss=site(s.ss);
    const vName=soaLabel(s.ss,s.seq);
    TIMESHEET.unshift({id:tsSeq++, d:TODAY, who:me, ss:s.ss, type:"受试者访视陪同",
      h, travel:0, subj:s.id, visit:vName});
    const c=h/8*RATE.crcDay; ss.cost=+(ss.cost+c).toFixed(1); ss.md+=Math.round(h/8*10)/10;
    if($("#dv-pay").checked)
      PAY.unshift({ss:s.ss, subj:s.id, visit:vName, traffic:200, meal:100, d:TODAY,
        way:"银行转账", rc:false, st:"待签收"});
    if(w.dev) ISSUES.unshift({id:"QI-2026-0"+(180+ISSUES.length), src:"中心自查", ss:s.ss, sev:"严重",
      type:"方案偏离", found:TODAY,
      desc:`受试者 ${s.id}「${vName}」实际完成日期超出方案窗口 ${Math.abs(w.rem)} 天（窗口 ${w.first} ～ ${w.last}）。`,
      capa:"（待提交整改措施）", own:me,
      due:new Date(Date.now()+7*864e5).toISOString().slice(0,10), st:"待整改", sla:null});
    /* 受试者不消失：推进到下一次访视 */
    if(s.st==="筛选中"){ s.st="已入组"; s.rnd="R-0"+(30+Math.floor(Math.random()*60));
      ss.enrolled++; toast(`${s.id} 已随机入组，随机号 ${s.rnd}`); }
    s.pendPi={visit:vName, date:TODAY, tasks:s.tasks.map(t=>t[0])};
    s.seq++; s.lastVisit=TODAY; s.edc="待录入"; s.piOk=false; s.contact="待联系";
    s.due=new Date(new Date(s.due).getTime()+sc.cycle*864e5).toISOString().slice(0,10);
    s.win=sc.win; s.tasks=soaTasks(s.ss,s.seq);
    if(s.seq>sc.last){ s.st="已出组"; }
    closeLayer();
    toast(w.dev? `${s.id} 访视完成但超窗，已生成方案偏离并转研究者签字｜工时 ${n1(h)}h 已关联记录`
               : `${s.id} 访视完成，工时 ${n1(h)}h 已关联本次访视，转研究者确认`, w.dev?"crit":"");
    setTimeout(render,220);
  });
}

    toast(`${s.id} 已登记筛败（${why}），已计入该中心筛败漏斗与筛败费`);
    setTimeout(render,220);
  });
}

              <div class="row" style="margin-top:7px">

<script>
"use strict";
/* ════════════════════════════════════════════════════════════════════
   CRA 端 —— 监查员。常年在路上，一个人盯 3~5 个中心。
   核心是风险分级监查（RBM）：把有限的监查人天投到最该去的中心。
   ════════════════════════════════════════════════════════════════════ */

/* 风险分：三项客观信号合成，不靠印象打分 */
function siteRisk(ss){
  const m=siteM(ss); let r=0; const why=[];
  if(m.rate!==null){
    if(m.rate<0.7){ r+=3; why.push(`入组仅达计划 ${pct(m.rate)}`); }
    else if(m.rate<0.9){ r+=1; why.push(`入组落后（${pct(m.rate)}）`); }
  }
  const iss=ISSUES.filter(i=>i.ss===ss.id&&i.st!=="已关闭");
  const sev=iss.filter(i=>i.sev!=="一般").length;
  if(sev){ r+=sev*2; why.push(`${sev} 项重大/严重事件未关闭`); }
  else if(iss.length){ r+=1; why.push(`${iss.length} 项一般事件未关闭`); }
  const s=SDV[ss.id];
  if(s){ const gap=1-s.done/s.total;
    if(gap>0.25){ r+=2; why.push(`SDV 缺口 ${pct(gap)}`); }
    else if(gap>0.15){ r+=1; why.push(`SDV 缺口 ${pct(gap)}`); } }
  const q=QUERIES.filter(x=>x.ss===ss.id&&x.st==="待中心回复"&&x.age>7).length;
  if(q){ r+=q; why.push(`${q} 条质疑挂起超 7 天`); }
  const lvl = r>=5 ? {k:"crit",t:"高风险",f:"加密监查 · 100% SDV"}
            : r>=2 ? {k:"warn",t:"中风险",f:"维持当前监查频率"}
                   : {k:"good",t:"低风险",f:"可降低 SDV 抽样比例"};
  return {r, why, lvl};
}

/* ── CRA 我的一天 ── */
VIEWS.cra = box=>{
  const me=PERSONA().n, mine=myScope();
  const risks=mine.map(s=>({s,...siteRisk(s)})).sort((a,b)=>b.r-a.r);
  const vs=VISITS.filter(v=>v.who===me);
  const openItems=sum(vs,v=>v.items.filter(i=>!i.done).length);
  const qs=QUERIES.filter(q=>mine.some(s=>s.id===q.ss)&&q.st==="待中心回复");
  const myTs=TIMESHEET.filter(t=>t.who===me);
  const trips=sum(myTs,t=>t.travel);
  const p=staff(me), us=utilState(p.util);

  box.innerHTML=`
  <div class="mini" style="margin-bottom:14px">
    ${[["我的中心",mine.length,"个","var(--ink)"],
       ["高风险中心",risks.filter(r=>r.lvl.k==="crit").length,"个",risks.filter(r=>r.lvl.k==="crit").length?"var(--crit)":"var(--ink)"],
       ["排期访视",vs.length,"次","var(--ink)"],
       ["未关闭跟进项",openItems,"项",openItems?"var(--warn)":"var(--ink)"],
       ["待中心回复质疑",qs.length,"条",qs.filter(q=>q.age>7).length?"var(--crit)":"var(--ink)"],
       ["我的利用率",p.util+"%","",us.k==="good"?"var(--ink)":us.c]
     ].map(([l,v,u,c])=>`<div><div class="kpi-l">${esc(l)}</div>
        <div class="v" style="color:${c}">${v}<small style="font-size:11px;color:var(--ink-3);margin-left:2px">${u}</small></div></div>`).join("")}
  </div>
  <div class="grid g21" style="gap:12px">
    <div class="stack">
      <div class="card">
        <div class="card-h"><h3>我的中心 · 风险分级</h3><span class="sub">决定下次监查该去哪、去多久</span>
          <span class="sp"></span><button class="btn" data-nav="mysites">明细 →</button></div>
        <div class="card-b"><div class="stack" style="gap:9px">
          ${risks.map(({s,r,why,lvl})=>{const m=siteM(s), sd=SDV[s.id];
            return `<div class="tcard ${lvl.k==="good"?"":lvl.k}">
              <div class="tcard-h">
                <div style="flex:1;min-width:0">
                  <div class="row" style="gap:6px">
                    <span class="pill p-${lvl.k}">${esc(lvl.t)} · ${r} 分</span>
                    <b style="font-size:13px">${esc(s.hosp)}</b>
                    <span class="t-sub">${esc(S[s.sid].short)}</span></div>
                  <div class="note" style="margin-top:4px">${why.length?esc(why.join("｜")):"无风险信号"}</div>
                  <div class="note" style="margin-top:2px;color:var(--ink-2)">建议：${esc(lvl.f)}</div>
                </div>
                <div class="ta-r" style="flex:none;min-width:96px">
                  <div class="num" style="font-size:17px">${s.enrolled}<span style="font-size:11px;color:var(--ink-3)">/${s.contracted}</span></div>
                  <div class="note">入组 ${m.rate===null?"—":pct(m.rate)}</div>
                  ${sd?`<div class="bartrack" style="height:4px;margin-top:5px"><div class="barfill" style="width:${sd.done/sd.total*100}%;background:var(--accent);height:100%"></div></div>
                        <div class="note">SDV ${sd.done}/${sd.total}</div>`:""}
                </div>
              </div></div>`;}).join("")}
        </div></div>
      </div>
      <div class="card">
        <div class="card-h"><h3>待办跟进项</h3><span class="sub">跟进项没关闭，等于这次监查没做</span></div>
        <div class="card-b" style="padding:0">
          ${vs.flatMap(v=>v.items.filter(i=>!i.done).map(i=>({v,i}))).slice(0,8).map(({v,i})=>`
            <div style="padding:9px 14px;border-bottom:1px solid var(--line)">
              <div class="row" style="gap:6px">
                <span class="mono" style="font-size:11px;color:var(--ink-3)">${esc(v.d)}</span>
                <span class="pill p-acc">${esc(v.kind)}</span>
                <span class="t-sub">${esc(site(v.ss).hosp)}</span></div>
              <div style="font-size:12.5px;margin-top:3px">${esc(i.t)}</div>
            </div>`).join("")||`<div class="empty">跟进项已全部关闭</div>`}
        </div>
      </div>
    </div>
    <div class="stack">
      <div class="card">
        <div class="card-h"><h3>我的行程</h3><span class="sp"></span>
          <button class="btn" data-nav="mon">排期 →</button></div>
        <div class="card-b" style="padding:0">
          ${vs.map(v=>{const d=v.items.filter(i=>i.done).length;
            return `<button data-goto5="${v.ss}" style="width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 14px;cursor:pointer">
              <div class="row" style="gap:6px">
                <span class="mono" style="font-size:11.5px;color:var(--ink-3)">${esc(v.d)}</span>
                <span class="pill p-acc">${esc(v.kind)}</span>
                <span class="sp"></span>
                <span class="pill ${v.st==="待确认"?"p-warn":"p-neut"}">${esc(v.st)}</span></div>
              <div style="font-size:12.5px;font-weight:500;margin-top:4px">${esc(site(v.ss).hosp)}</div>
              <div class="note">${esc(site(v.ss).city)} · ${v.days} 天 · 跟进项 ${d}/${v.items.length} · 预估差旅 ${n1(RATE.travel)} 万</div>
            </button>`;}).join("")||`<div class="empty">近期无排期</div>`}
        </div>
      </div>
      <div class="card">
        <div class="card-h"><h3>本期差旅</h3></div>
        <div class="card-b">
          <div class="num" style="font-size:26px">${n1(trips)}<small style="font-size:12px;color:var(--ink-3);margin-left:3px">万元</small></div>
          <div class="note">${myTs.filter(t=>t.travel>0).length} 笔已填报</div>
          <div class="hr"></div>
          <div class="note">差旅与监查访视绑定：一次现场 IMV 的完全成本 ≈ ${n1(RATE.craDay*1.5+RATE.travel)} 万（1.5 人天 + 单次差旅）。
            这就是为什么低风险中心该降频 —— 省下的是真金白银。</div>
          <button class="btn" style="width:100%;justify-content:center;margin-top:10px" data-nav="time">去填报 →</button>
        </div>
      </div>
    </div>
  </div>`;
  box.addEventListener("click",e=>{const g=e.target.closest("[data-goto5]"); if(g) openSite(g.dataset.goto5);});
};

/* ── 我的中心（CRA 版台账） ── */
VIEWS.mysites = box=>{
  const rows=scope().map(s=>({s,...siteRisk(s)})).sort((a,b)=>b.r-a.r);
  const tot=rows.reduce((t,r)=>t+r.r,0);
  box.innerHTML=`
  <div class="grid g4" style="gap:10px;margin-bottom:14px">
    ${[["在管中心",rows.length,"个","var(--ink)"],
       ["高风险",rows.filter(r=>r.lvl.k==="crit").length,"个",rows.filter(r=>r.lvl.k==="crit").length?"var(--crit)":"var(--ink)"],
       ["风险总分",tot,"分",tot>10?"var(--crit)":tot>5?"var(--warn)":"var(--ink)"],
       ["行业经验值","8–12","个中心/CRA","var(--ink-3)"]
     ].map(([l,v,u,c])=>`<div class="stat">
        <div class="kpi-l">${esc(l)}</div>
        <div class="num" style="font-size:24px;margin-top:3px;color:${c}">${v}<small style="font-size:12px;color:var(--ink-3);margin-left:2px">${u}</small></div></div>`).join("")}
  </div>
  <div class="card">
    <div class="card-h"><h3>中心明细</h3><span class="sp"></span><span class="sub">按风险分排序 —— 这就是下周该怎么排班</span></div>
    <div class="tw"><table style="min-width:900px">
      <thead><tr><th>中心</th><th>项目</th><th class="ta-r">风险分</th><th>风险信号</th><th class="ta-r">入组</th>
        <th style="width:15%">SDV 进度</th><th>下次访视</th><th>监查建议</th></tr></thead>
      <tbody>${rows.map(({s,r,why,lvl})=>{const m=siteM(s), sd=SDV[s.id];
        const nv=VISITS.find(v=>v.ss===s.id);
        return `<tr class="clk" data-ss5="${s.id}">
          <td><div class="t-main">${esc(s.hosp)}</div><div class="t-sub">${esc(s.city)} · PI ${esc(s.pi)}</div></td>
          <td class="t-sub">${esc(S[s.sid].short)}</td>
          <td class="ta-r"><span class="pill p-${lvl.k}">${r}</span></td>
          <td class="t-sub" style="max-width:230px">${why.length?esc(why.join("；")):"—"}</td>
          <td class="tnum">${s.enrolled}/${s.contracted}<div class="t-sub" style="text-align:right">${m.rate===null?"—":pct(m.rate)}</div></td>
          <td>${sd?`<div class="bartrack" style="height:9px"><div class="barfill" style="width:${sd.done/sd.total*100}%;background:var(--accent);height:100%"></div></div>

  <div class="formula" style="margin-top:12px">风险分 = 入组落后(1) / 严重落后(3)
       + 每项重大或严重未关闭事件(2)｜仅一般事件(1)
       + SDV 缺口 &gt;15%(1) / &gt;25%(2)
       + 每条挂起超 7 天的数据质疑(1)
≥5 分 高风险 → 加密监查、100% SDV
2–4 分 中风险 → 维持频率      0–1 分 低风险 → 可降抽样</div>`;
  box.addEventListener("click",e=>{const t=e.target.closest("[data-ss5]"); if(t) openSite(t.dataset.ss5);});
};

<script>
"use strict";
/* ════════════════════════════════════════════════════════════════════
   PM / 小团队管理者 —— 同时对人和项目负责。
   左手：组员负载与审批；右手：项目进度与中心风险。
   ════════════════════════════════════════════════════════════════════ */

/* 调配建议：同角色才可互换 —— CRA 和 CRC 不是一种人 */
function rebalance(){
  const team=myTeam(), out=[];
  team.filter(p=>p.util>88).forEach(o=>{
    const inTeam=team.filter(x=>x.role===o.role&&x.util<70).sort((a,b)=>a.util-b.util)[0];
    const outTeam=STAFF.filter(x=>x.role===o.role&&x.util<60&&!TEAM.members.includes(x.n))
      .sort((a,b)=>a.util-b.util)[0];
    out.push({over:o, inTeam, outTeam});
  });
  return out;
}
const teamSites = ()=>[...new Set(myTeam().flatMap(p=>p.sites))].map(site);

/* ── 团队工作台 ── */
VIEWS.pm = box=>{
  const team=myTeam(), mine=myScope();
  const over=team.filter(p=>p.util>88), idle=team.filter(p=>p.util<60);
  const avg=sum(team,p=>p.util)/team.length;
  const risks=mine.map(s=>({s,...siteRisk(s)})).sort((a,b)=>b.r-a.r);
  const R=rollup(mine);
  const flagged=APPROVALS.filter(a=>a.flag);
  const us=utilState(avg);

  box.innerHTML=`
  <div class="mini" style="margin-bottom:14px">
    ${[["组员",team.length,"人","var(--ink)"],

<script>

/* ════════════════════════════════════════════════════════════════════
   立项与建档 —— 系统的入口。此前所有数据都是凭空存在的，这里补上。
   关键判断：立项时就算毛利率，而不是做完半年后财务才告诉你亏了。

/* 用与报价模型完全相同的口径反算成本，保证「立项测算」与「报价」不会两套账 */
function intakeCalc({sites, pts, months, contract, cx=1.2, visits=11, fte=0.55, imv=1.5}){
  const r = calcPrice({sites, pts, months, cx, visits, fte, imv, target:0});
  const total = sites*pts;
  return {total, cost:r.cost, gm: contract>0 ? (contract-r.cost)/contract : 0,
          unit: total? contract/total : 0, crcMd:r.crcMd, craMd:r.craMd,
          minContract: r.cost/(1-GM_GATE)};
}

    <div class="card-h"><h3>已立项项目</h3><span class="sp"></span><span class="sub">共 ${STUDIES.length} 个</span></div>
    <div class="tw"><table style="min-width:820px">
      <thead><tr><th>方案编号</th><th>药物 / 器械</th><th>申办方</th><th>期别</th><th>适应症</th>
        <th class="ta-r">计划例数</th><th class="ta-r">中心数</th><th class="ta-r">已建档</th><th class="ta-r">合同额</th></tr></thead>
      <tbody>${STUDIES.map(st=>{const built=SITES.filter(s=>s.sid===st.id).length;
        return `<tr><td class="mono" style="font-size:11.5px">${esc(st.id)}</td>
          <td class="t-main">${esc(st.drug)}</td><td>${esc(st.sponsor)}</td>
          <td><span class="pill p-neut">${esc(st.phase)}</span></td>
          <td class="t-sub">${esc(st.indication)}</td>
          <td class="tnum">${st.planned}</td><td class="tnum">${st.sites}</td>
          <td class="tnum" style="color:${built<st.sites?"var(--warn)":"var(--ink)"}">${built}<span class="t-mut"> / ${st.sites}</span></td>
          <td class="tnum">${n1(st.contract)} 万</td></tr>`;}).join("")}</tbody>
    </table></div>
  </div>
  <p class="note" style="margin-top:10px">「已建档」小于「中心数」= 合同里写了但还没进系统的中心。这些中心的成本已经在发生（伦理递交、合同谈判），
    收入却还挂不上号 —— 建档滞后是早期成本失控最常见的一种。</p>`;

  $("#np")?.addEventListener("click", newStudyModal);
  $("#ns")?.addEventListener("click", newSiteModal);
  box.addEventListener("click",e=>{
    const ok=e.target.closest("[data-ok]"), no=e.target.closest("[data-no]");
    if(!ok&&!no) return;
    const id=(ok||no).dataset.ok||(ok||no).dataset.no;
    const i=INTAKE.findIndex(x=>x.id===id), x=INTAKE[i];
    if(ok){
      const sid=`HJ-2026-0${String(STUDIES.length+10).slice(-2)}`;
      STUDIES.push({id:sid, short:x.drug.slice(0,6), drug:x.drug, sponsor:x.sponsor, phase:x.phase,
        indication:x.indication, planned:x.planned, sites:x.sites, contract:x.contract,
        start:TODAY.slice(0,7), end:"—", cx:1.2});
      S[sid]=STUDIES.at(-1);
      ENROLL[sid]={x:[TODAY.slice(2,7)], plan:[0], act:[0]};
      toast(`${x.drug} 已批准立项，方案编号 ${sid}，可开始逐中心建档`);
    } else toast(`${x.drug} 已退回：毛利率 ${pct(x.gm)} 低于门槛，需重谈价格或压缩投入`,"warn");
    INTAKE.splice(i,1); render();
  });
};

function newStudyModal(){
  openLayer($("#modal"),`
    <div class="drawer-h"><h3 style="flex:1;font-size:15px">新建项目立项</h3><button class="x" data-close aria-label="关闭">✕</button></div>

      <div class="field"><div class="slider-h"><label for="i-ind">适应症</label></div>
        <input class="inp" id="i-ind" style="width:100%" placeholder="例：中重度特应性皮炎"></div>
      <div class="field"><div class="slider-h"><label for="i-sites">参研中心数</label><b id="v-sites">8 个</b></div>
        <input type="range" id="i-sites" min="2" max="30" step="1" value="8"></div>
      <div class="field"><div class="slider-h"><label for="i-pts">每中心例数</label><b id="v-pts">15 例</b></div>
        <input type="range" id="i-pts" min="5" max="50" step="1" value="15"></div>
      <div class="field"><div class="slider-h"><label for="i-mon">入组期（月）</label><b id="v-mon">16 个月</b></div>
        <input type="range" id="i-mon" min="6" max="36" step="1" value="16"></div>
      <div class="field"><div class="slider-h"><label for="i-amt">合同总额（万元）</label></div>
        <input class="inp" id="i-amt" type="number" step="10" value="760" style="width:100%"></div>
      <div class="field"><div class="slider-h"><label for="i-note">提交说明</label></div>
        <textarea class="qbox" id="i-note" placeholder="例：申办方压价两轮；若接需把 CRC 驻场 FTE 压到 0.4。"></textarea></div>
      <div id="i-calc" style="margin-bottom:12px"></div>
      <div class="row" style="justify-content:flex-end">
        <button class="btn" data-close>取消</button>
        <button class="btn btn-p" id="i-go">提交立项申请</button></div>
    </div>`);
  const read=()=>({sites:+$("#i-sites").value, pts:+$("#i-pts").value,
                   months:+$("#i-mon").value, contract:+$("#i-amt").value||0});
  const upd=()=>{
    const v=read(), r=intakeCalc(v), low=r.gm<GM_GATE;
    $("#v-sites").textContent=v.sites+" 个"; $("#v-pts").textContent=v.pts+" 例";
    $("#v-mon").textContent=v.months+" 个月";
    $("#i-calc").innerHTML=`
      <div style="border:1px solid var(--line);border-left:2px solid var(--${low?"crit":"good"});background:var(--${low?"crit":"good"}-soft);padding:10px 12px;border-radius:0 8px 8px 0">
        <div class="row" style="justify-content:space-between;margin-bottom:6px">
          <b style="font-size:12.5px">立项测算</b>
          <span class="pill ${low?"p-crit":"p-good"}">毛利率 ${pct(r.gm)}${low?` · 低于门槛 ${pct(GM_GATE)}`:""}</span></div>
        <div class="mini" style="grid-template-columns:repeat(auto-fit,minmax(84px,1fr))">
          <div><div class="kpi-l">总例数</div><div class="v">${r.total}</div></div>
          <div><div class="kpi-l">预估成本</div><div class="v">${n1(r.cost)}<small style="font-size:10px"> 万</small></div></div>
          <div><div class="kpi-l">单例单价</div><div class="v">${n1(r.unit)}<small style="font-size:10px"> 万</small></div></div>
          <div><div class="kpi-l">保本合同额</div><div class="v">${n1(r.minContract)}<small style="font-size:10px"> 万</small></div></div>
        </div>
        <div class="note" style="margin-top:7px;color:var(--ink-2)">
          ${low?`按当前参数，合同额需 ≥ <b>${n1(r.minContract)} 万</b> 才能达到 ${pct(GM_GATE)} 门槛，缺口 ${n1(r.minContract-v.contract)} 万。提交后需经营层审批。`
               :`达到毛利门槛，提交后走常规审批。`}
          人天口径与报价模型一致：CRC ${n0(r.crcMd)} + CRA ${n0(r.craMd)} 人天。</div>
      </div>`;
  };
  ["#i-sites","#i-pts","#i-mon","#i-amt"].forEach(s=>$(s).addEventListener("input",upd));
  upd();
  $("#i-go").addEventListener("click",()=>{
    const drug=$("#i-drug").value.trim()||"未命名项目", sp=$("#i-sp").value.trim()||"未填写";
    const ind=$("#i-ind").value.trim()||"未填写", v=read(), r=intakeCalc(v);
    if(!v.contract){ toast("请填写合同总额","crit"); return; }
    INTAKE.unshift({id:`NP-2026-0${acSeq++}`, drug, sponsor:sp, phase:$("#i-ph").value,
      indication:ind, sites:v.sites, planned:r.total, contract:v.contract, months:v.months,
      cost:r.cost, gm:r.gm, sub:TODAY, by:PERSONA().n,
      st: r.gm<GM_GATE ? "待经营层审批" : "待常规审批", note:$("#i-note").value.trim()});
    closeLayer();
    toast(`${drug} 立项申请已提交${r.gm<GM_GATE?"，毛利率低于门槛，需经营层审批":""}`, r.gm<GM_GATE?"warn":"");
    setTimeout(render,220);
  });
}

        <div class="field"><div class="slider-h"><label for="s-crc">派驻 CRC</label></div>

    if(cra && cra.util>88) m.push(["crit",`${cra.n} 当前利用率 ${cra.util}%，已超载，再加中心会拉低监查质量`]);

  ["#s-n","#s-c","#s-cra","#s-crc"].forEach(s=>$(s).addEventListener("input",chk));

  $("#s-go").addEventListener("click",()=>{

      cra, crc:[crc], ethics:"—", siv:"—", fpi:"—", risk:1});
    staff(cra).sites.push(id); staff(crc).sites.push(id);
    REG.push({who:crc, org:"恒济临床（SMO）", role:"CRC", ss:id, st:"备案中",
      gcp:staff(crc).gcp, train:"—", badge:"—", note:"新建档中心，待医院机构办备案准入"});
    closeLayer();
    toast(`${hosp} 已建档（${id}），状态：立项｜已同步生成机构备案申请`);
    setTimeout(render,220);
  });
}

<script>
"use strict";
/* ════════════════════════════════════════════════════════════════════
   机构端 —— 医院药物临床试验机构办公室的「机构老师」。
   他不是 CRO/SMO 的员工，是医院方的守门人与质量责任人：
   立项受理 · 机构质控 · 人员备案准入 · 文件归档。

   权限边界比内部员工更窄，不是更宽：
   只看本院、只看质量与合规，看不到任何成本、毛利、人天与利用率。
   ════════════════════════════════════════════════════════════════════ */

const instSites = ()=>SITES.filter(s=>s.hosp===PERSONA().hosp);
const instIds   = ()=>new Set(instSites().map(s=>s.id));
const qcOpen    = ()=>QC.filter(q=>instIds().has(q.ss)&&q.st!=="已关闭");
const qcFindOpen= ()=>qcOpen().flatMap(q=>q.findings.filter(f=>f.st!=="已关闭"));
const acOpen    = ()=>ACCEPT.filter(a=>a.hosp===PERSONA().hosp&&a.st!=="已受理");
const regOpen   = ()=>REG.filter(r=>instIds().has(r.ss)&&r.st!=="已准入");

const NOTICE = `<div style="border:1px dashed var(--line-2);background:var(--surface-2);padding:9px 12px;border-radius:8px;font-size:11.5px;color:var(--ink-3);line-height:1.6">
  <b style="color:var(--ink-2)">机构端可见范围</b>：仅本机构承接的项目与中心，内容限于质量、合规、人员资质与文件。
  受托方（CRO/SMO）的成本、毛利、人天与人员利用率<b>不对机构开放</b> —— 那是受托方的商业信息，
  与机构履行监管职责无关。同样，机构的内部质控底稿也不向受托方开放全文，只发送质控意见与整改要求。</div>`;

/* ── 机构工作台 ── */
VIEWS.inst = box=>{
  const ss=instSites(), fo=qcFindOpen(), ac=acOpen(), rg=regOpen();
  const iss=ISSUES.filter(i=>instIds().has(i.ss)&&i.st!=="已关闭");
  const bySrc={};
  ISSUES.filter(i=>instIds().has(i.ss)).forEach(i=>bySrc[i.src]=(bySrc[i.src]||0)+1);
  const overdue=fo.filter(f=>days(TODAY,f.due)<0);

  box.innerHTML=`
  <div class="grid g4" style="gap:10px;margin-bottom:12px">
    ${[["本院在研项目",new Set(ss.map(s=>s.sid)).size,"个","var(--ink)"],
       ["待受理立项",ac.length,"项",ac.length?"var(--warn)":"var(--ink)"],
       ["质控待整改",fo.length,"项",overdue.length?"var(--crit)":fo.length?"var(--warn)":"var(--ink)"],
       ["人员资质异常",rg.length,"人",rg.length?"var(--crit)":"var(--ink)"]
     ].map(([l,v,u,c])=>`<div class="stat">
        <div class="kpi-l">${esc(l)}</div>
        <div class="num" style="font-size:24px;margin-top:3px;color:${c}">${v}<small style="font-size:12px;color:var(--ink-3);margin-left:2px">${u}</small></div></div>`).join("")}
  </div>
  <div class="grid g21" style="gap:12px;margin-bottom:12px">
    <div class="card">
      <div class="card-h"><h3>本院在研中心</h3><span class="sub">仅显示质量与进度，不含受托方财务信息</span></div>
      <div class="tw"><table style="min-width:640px">
        <thead><tr><th>项目 / 科室</th><th>PI</th><th>状态</th><th class="ta-r">已入组</th>
          <th class="ta-r">未关闭事件</th><th>最近机构质控</th></tr></thead>
        <tbody>${ss.map(s=>{const q=QC.filter(x=>x.ss===s.id).sort((a,b)=>b.date.localeCompare(a.date))[0];
          const n=ISSUES.filter(i=>i.ss===s.id&&i.st!=="已关闭").length;
          return `<tr><td><div class="t-main">${esc(S[s.sid].short)}</div>
              <div class="t-sub">${esc(s.dept)} · ${esc(S[s.sid].phase)} · ${esc(s.sid)}</div></td>
            <td>${esc(s.pi)}</td>
            <td><span class="pill ${s.st==="入组中"?"p-acc":"p-neut"}">${esc(s.st)}</span></td>
            <td class="tnum">${s.enrolled}<span class="t-mut"> / ${s.contracted}</span></td>
            <td class="ta-r">${n?`<span class="pill p-crit">${n}</span>`:`<span class="pill p-good">0</span>`}</td>
            <td class="t-sub">${q?`${esc(q.date)}<div class="t-sub">${esc(q.round)} · ${esc(q.st)}</div>`
              :`<span class="t-mut">未开展</span>`}</td></tr>`;}).join("")}</tbody>
      </table></div>
    </div>
    <div class="card">
      <div class="card-h"><h3>问题发现来源</h3><span class="sub">分布本身就是质量指标</span></div>
      <div class="card-b">
        <div id="c-src"></div>
        <div class="note" style="margin-top:11px;border-top:1px solid var(--line);padding-top:9px">
          机构质控与中心自查发现得越多，说明前置防线在起作用；如果问题主要由<b>申办方稽查或药监核查</b>发现，
          说明一级、二级质控形同虚设 —— 那时代价已经不是整改，而是数据被剔除。</div>
      </div>
    </div>
  </div>
  <div class="grid g2" style="gap:12px;margin-bottom:12px">
    <div class="card">
      <div class="card-h"><h3>待办：整改跟踪</h3><span class="sp"></span>
        <button class="btn" data-nav="instqc">机构质控 →</button></div>
      <div class="card-b" style="padding:0">
        ${fo.length? fo.map(f=>{const od=days(TODAY,f.due)<0;
          return `<div style="padding:10px 14px 10px 16px;border-bottom:1px solid var(--line);position:relative">
            <span class="stripe" style="background:var(--${od?"crit":SEV[f.sev].k})"></span>
            <div class="row" style="gap:6px"><span class="pill p-${SEV[f.sev].k}">${esc(f.sev)}</span>
              <b style="font-size:12.5px;font-weight:500">${esc(f.item)}</b>
              ${od?`<span class="pill p-crit">整改逾期 ${Math.abs(days(TODAY,f.due))} 天</span>`:""}</div>
            <div class="note" style="margin-top:3px;color:var(--ink-2)">${esc(f.desc)}</div>
            <div class="note" style="margin-top:2px">责任人 ${esc(f.resp)}｜整改期限 ${esc(f.due)}｜${esc(f.st)}</div>

    受理是医院承接项目的第一道闸门：材料不齐就受理，后面所有环节都会带着这个缺口往下走。</p>

/* ── 发起机构质控 ── */
function qcModal(){
  const ss=instSites();
  openLayer($("#drawer"),`
    <div class="drawer-h"><div style="flex:1">
      <div class="section-t" style="margin:0 0 3px">机构办公室</div>
      <h2 style="font-size:17px">发起机构质控</h2>
      <div class="note" style="margin-top:3px">逐项标记「符合 / 不符合」，不符合项将生成质控意见并派发整改</div>
    </div><button class="x" data-close aria-label="关闭">✕</button></div>
    <div class="drawer-b">
      <div class="field"><div class="slider-h"><label for="q-ss">受控中心</label></div>
        <select class="sel" id="q-ss" style="width:100%">${ss.map(s=>
          `<option value="${s.id}">${esc(S[s.sid].short)} · ${esc(s.dept)} · PI ${esc(s.pi)}</option>`).join("")}</select></div>
      <div class="field"><div class="slider-h"><label for="q-r">质控级别</label></div>
        <select class="sel" id="q-r" style="width:100%">
          <option>二级质控（机构抽查）</option><option>一级质控（研究者自查）</option>
          <option>专项质控（针对既往发现）</option></select></div>
      <div class="field"><div class="slider-h"><label for="q-n">抽查例数</label><b id="q-nv">5 例</b></div>
        <input type="range" id="q-n" min="1" max="20" step="1" value="5"></div>
      <div class="section-t">检查项</div>
      <div id="q-items">${QC_ITEMS.map((t,k)=>`
        <div style="border-bottom:1px solid var(--line);padding:9px 0">
          <div class="row" style="justify-content:space-between;gap:10px;align-items:flex-start">
            <div style="flex:1;font-size:12.5px;line-height:1.55">${esc(t)}</div>
            <div class="seg" style="flex:none">
              <button data-qi="${k}:ok" aria-pressed="true">符合</button>
              <button data-qi="${k}:no" aria-pressed="false">不符合</button></div>
          </div>
          <div id="qf-${k}" hidden style="margin-top:8px">
            <div class="row" style="gap:8px;margin-bottom:6px">
              <select class="sel" id="qs-${k}"><option>一般</option><option>严重</option><option>重大</option></select>
              <select class="sel" id="qr-${k}">${STAFF.filter(x=>x.role==="CRC"||x.role==="CRA")
                .map(x=>`<option>${esc(x.n)}</option>`).join("")}</select>
              <span class="note">严重程度 · 责任人</span>
            </div>
            <textarea class="qbox" id="qd-${k}" placeholder="写清发现的事实、涉及例数与依据，避免笼统表述。"></textarea>
          </div>
        </div>`).join("")}</div>
      <div class="row" style="margin-top:14px;justify-content:flex-end">
        <button class="btn" data-close>取消</button>
        <button class="btn btn-p" id="q-go">出具质控意见</button></div>
    </div>`);
  $("#q-n").addEventListener("input",e=>$("#q-nv").textContent=e.target.value+" 例");
  $("#q-items").addEventListener("click",e=>{
    const b=e.target.closest("[data-qi]"); if(!b) return;
    const [k,v]=b.dataset.qi.split(":");
    b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));
    $("#qf-"+k).hidden = v!=="no";
  });
  $("#q-go").addEventListener("click",()=>{
    const ssid=$("#q-ss").value, round=$("#q-r").value, n=+$("#q-n").value;
    const finds=[];
    QC_ITEMS.forEach((t,k)=>{
      const bad=$("#qf-"+k).hidden===false; if(!bad) return;
      const desc=$("#qd-"+k).value.trim();
      if(!desc) return;
      const sev=$("#qs-"+k).value, resp=$("#qr-"+k).value;
      const iid="QI-2026-0"+(160+ISSUES.length+finds.length);
      finds.push({item:t.split("：")[0], sev, desc, resp,
        due:new Date(Date.now()+14*864e5).toISOString().slice(0,10), st:"待整改", iss:iid});
      ISSUES.unshift({id:iid, src:"机构质控", ss:ssid, sev, type:"机构质控发现 · "+t.split("：")[0],
        found:TODAY, desc, capa:"（待受托方提交整改措施）", own:resp,
        due:new Date(Date.now()+14*864e5).toISOString().slice(0,10), st:"待整改", sla:null});
    });
    const qid="QC-2026-0"+(qcSeq++);
    QC.unshift({id:qid, ss:ssid, round, date:TODAY, by:PERSONA().n,
      scope:`随机抽取 ${n} 例受试者，覆盖 ${QC_ITEMS.length} 项检查内容`,
      st: finds.length? "待整改" : "已关闭", findings:finds});
    closeLayer();
    toast(finds.length
      ? `${qid} 质控意见已出具：${finds.length} 项不符合，已派发整改并同步至质量事件台账`
      : `${qid} 质控完成：全部检查项符合要求`, finds.length?"warn":"");
    setTimeout(render,220);
  });
}

    if(s){ const r=list[+s.dataset.sus]; r.st="备案中";
      toast(`${r.who} 的中心权限已暂停，已通知受托方`,"warn"); render(); return; }
    if(q){ const r=list[+q.dataset.ask];

  });
};

/* ── 受托方侧的对侧：我的整改（CRC/CRA 收到机构质控意见后回复） ── */
VIEWS.capa = box=>{

       ["其中机构质控",fromQC.length,"项",fromQC.length?"var(--crit)":"var(--ink)"],
       ["整改逾期",overdue.length,"项",overdue.length?"var(--crit)":"var(--ink)"],

     ].map(([l,v,u,c])=>`<div class="stat">
