  </div>
  <div class="stack" style="gap:10px">
    ${fromQC.length? fromQC.map(({q,f},k)=>{const od=days(TODAY,f.due)<0;
      return `<div class="tcard ${od?"crit":SEV[f.sev].k}">
        <div class="tcard-h">
          <div style="flex:1;min-width:0">
            <div class="row" style="gap:6px">
              <span class="pill p-${SEV[f.sev].k}">${esc(f.sev)}</span>
              <b style="font-size:13px">${esc(f.item)}</b>
              <span class="mono" style="font-size:10.5px;color:var(--ink-3)">${esc(q.id)}</span>
              ${od?`<span class="pill p-crit">逾期 ${Math.abs(days(TODAY,f.due))} 天</span>`:""}</div>
            <div class="note" style="margin-top:4px;color:var(--ink-2)">${esc(f.desc)}</div>
            <div class="note" style="margin-top:2px">来源：${esc(q.round)} · ${esc(site(q.ss).hosp)}机构办 ${esc(q.by)}｜整改期限 ${esc(f.due)}</div>
          </div>
          <span class="pill ${f.st==="待复核"?"p-acc":"p-warn"}" style="flex:none">${esc(f.st)}</span>
        </div>
        <div style="padding:0 12px 12px 14px">
          ${f.st==="待整改"?`
            <textarea class="qbox" id="cp-${k}" placeholder="写清已采取的纠正措施、预防措施与完成证据，例如：3 例受试者已于 2026-08-25 重新签署 ICF V3.0 并上报伦理；中心 ICF 版本控制表已上墙，CRC 每周核对。"></textarea>
            <div class="row" style="margin-top:8px">
              <button class="btn btn-p" data-cp="${k}">提交整改回复</button>
              <span class="note">提交后转机构复核，复核通过才算关闭</span></div>`
          :`<div style="background:var(--surface-2);border:1px solid var(--line);padding:8px 10px;border-radius:8px;font-size:12px;color:var(--ink-2);line-height:1.6">
              <b style="color:var(--ink)">已提交整改回复</b><br>${esc(f.reply||"")}</div>
            <div class="note" style="margin-top:6px">等待 ${esc(site(q.ss).hosp)}机构办复核</div>`}
        </div></div>`;}).join("")
      : `<div class="card"><div class="empty">当前没有来自机构质控的整改要求</div></div>`}
  </div>
  ${mine.filter(i=>i.src!=="机构质控").length?`
    <div class="section-t" style="margin-top:16px">其他来源的质量事件（${mine.filter(i=>i.src!=="机构质控").length}）</div>
    <div class="card"><div class="card-b" style="padding:0">
      ${mine.filter(i=>i.src!=="机构质控").map(i=>`
        <div style="padding:10px 14px 10px 16px;border-bottom:1px solid var(--line);position:relative">
          <span class="stripe" style="background:var(--${SEV[i.sev].k})"></span>
          <div class="row" style="gap:6px"><span class="pill p-${SEV[i.sev].k}">${esc(i.sev)}</span>
            <b style="font-size:12.5px;font-weight:500">${esc(i.type)}</b>
            <span class="pill p-neut">来源 ${esc(i.src)}</span></div>
          <div class="note" style="margin-top:3px;color:var(--ink-2)">${esc(i.desc)}</div>
          <div class="note" style="margin-top:2px">CAPA 到期 ${esc(i.due)}｜${esc(i.st)}</div>
        </div>`).join("")}
    </div></div>`:""}`;
  box.addEventListener("click",e=>{
    const b=e.target.closest("[data-cp]"); if(!b) return;
    const {q,f}=fromQC[+b.dataset.cp], v=$("#cp-"+b.dataset.cp).value.trim();
    if(v.length<15){ toast("整改回复需写清纠正措施、预防措施与完成证据（至少 15 个字）","crit"); return; }
    f.reply=v; f.st="待复核";
    if(f.iss){ const i=ISSUES.find(x=>x.id===f.iss); if(i){ i.st="待验证"; i.capa=v; } }
    toast(`整改回复已提交，转 ${site(q.ss).hosp}机构办复核`); render();
  });
};
</script>
<script>
"use strict";
/* ════════════════════════════════════════════════════════════════════
   筛选漏斗与筛败分析
   入组数只是漏斗最后一格。落后中心的根因藏在前面三格里 ——
   「入组落后」这个结论本身没有行动价值，「为什么落后」才有。
   ════════════════════════════════════════════════════════════════════ */
VIEWS.screen = box=>{
  const list = scope().filter(s=>FN(s.id).pre>0);
  const T = list.reduce((a,s)=>{const f=funnelM(s);
    return {pre:a.pre+f.pre, icf:a.icf+f.icf, enr:a.enr+f.enr, sf:a.sf+f.sf, inScr:a.inScr+f.inScr};},
    {pre:0,icf:0,enr:0,sf:0,inScr:0});
  const sfRate = T.icf? T.sf/T.icf : 0;
  const reasons = SF_REASONS.map((r,i)=>({n:r, v:sum(list,s=>FN(s.id).sfr[i]||0)}))
    .filter(r=>r.v).sort((a,b)=>b.v-a.v);
  const diags = list.map(s=>({s, d:enrollDiag(s)})).filter(x=>x.d);

  box.innerHTML=`
  <div class="card" style="margin-bottom:12px">
    <div class="card-h"><h3>筛选漏斗</h3><span class="sp"></span>
      <span class="sub">预筛 → 签署知情 → 入组 / 筛败</span></div>
    <div class="card-b">
      <div style="display:flex;gap:2px;align-items:flex-end;margin-bottom:12px">
        ${[["预筛人数",T.pre,"var(--s5)",1],
           ["签署知情",T.icf,"var(--s3)",T.icf/T.pre],
           ["已入组",T.enr,"var(--accent)",T.enr/T.pre],
           ["筛败",T.sf,"var(--ink-3)",T.sf/T.pre],
           ["在筛",T.inScr,"var(--line-2)",T.inScr/T.pre]
         ].map(([l,v,c,h])=>`<div style="flex:1;text-align:center">
            <div class="num" style="font-size:24px;letter-spacing:-.04em">${v}</div>
            <div style="height:${Math.max(5,clamp(h,0,1)*104)}px;background:${c};border-radius:3px 3px 0 0;margin:10px 0 0"></div>
            <div class="kpi-l" style="margin-top:8px">${esc(l)}</div>
            <div class="note" style="margin-top:3px">${T.pre?pct(v/T.pre):"—"}</div>
          </div>`).join("")}
      </div>
      <div class="grid g4" style="gap:10px;border-top:1px solid var(--line);padding-top:12px">
        ${[["筛败率",pct(sfRate),`${T.sf} / ${T.icf} 签署知情者`,sfRate>0.5?"var(--crit)":sfRate>0.35?"var(--warn)":"var(--ink)"],
           ["预筛转化率",T.pre?pct(T.icf/T.pre):"—","预筛 → 签署知情","var(--ink)"],
           ["总转化率",T.pre?pct(T.enr/T.pre):"—","每入组 1 例需预筛 "+(T.enr?n1(T.pre/T.enr):"—")+" 人","var(--ink)"],
           ["筛败费收入",wan(sum(list,s=>revParts(s).sf)),`按入组单价 ${pct(SF_FEE)} 计价`,"var(--ink)"]
         ].map(([l,v,n,c])=>`<div><div class="kpi-l">${esc(l)}</div>
            <div class="num" style="font-size:21px;margin-top:3px;color:${c}">${v}</div>
            <div class="note">${esc(n)}</div></div>`).join("")}
      </div>
    </div>
  </div>

  ${diags.length?`<div class="card alert alert-crit" style="margin-bottom:28px">
    <div class="card-h"><h3>落后中心根因判定</h3><span class="sp"></span>
      <span class="sub">三种失败模式，指向完全不同的行动</span></div>
    <div class="card-b" style="padding:0">
      ${diags.map(({s,d})=>`<div style="padding:12px 16px 12px 18px;border-bottom:1px solid var(--line);position:relative">
        <span class="stripe" style="background:${d.c}"></span>
        <div class="row" style="gap:7px">
          <span class="pill p-neut" style="font-weight:600">${esc(d.k)}</span>
          <b style="font-size:13.5px">${esc(s.hosp)}</b>
          <span class="t-sub">${esc(S[s.sid].short)} · 入组 ${s.enrolled}/${s.contracted}</span></div>
        <div class="note" style="margin-top:4px;color:var(--ink-2)">${esc(d.d)}</div>
        <div class="note" style="margin-top:3px"><b style="color:var(--ink-2)">该做的事</b>：${esc(d.a)}</div>
      </div>`).join("")}
    </div>
  </div>`:""}

  <div class="card" style="margin-bottom:34px">
      <div class="card-h"><h3>逐中心漏斗</h3><span class="sp"></span>
        <span class="sub">同一项目内，筛败率差 2 倍是常态</span></div>
      <div class="tw"><table style="min-width:920px">
        <thead><tr><th>中心 <span class="t-mut" style="text-transform:none;letter-spacing:0">（漏斗条：<span style="color:var(--accent)">入组</span> / <span style="color:var(--ink-3)">筛败</span> / 在筛）</span></th><th class="ta-r">预筛</th><th class="ta-r">签知情</th><th class="ta-r">入组</th>
          <th class="ta-r">筛败</th><th class="ta-r">筛败率</th><th class="ta-r">总转化</th>
          <th style="width:18%">漏斗</th><th>判定</th></tr></thead>
        <tbody>${list.map(s=>{const f=funnelM(s), d=enrollDiag(s);
          const sfc = f.sfRate>0.5?"var(--crit)":f.sfRate>0.35?"var(--warn)":"var(--ink)";
          return `<tr class="clk" data-ss7="${s.id}">
            <td><div class="t-main">${esc(s.hosp)}</div><div class="t-sub">${esc(S[s.sid].short)} · ${esc(s.city)}</div></td>
            <td class="tnum">${f.pre}</td><td class="tnum">${f.icf}</td>
            <td class="tnum" style="font-weight:600">${f.enr}</td>
            <td class="tnum">${f.sf}</td>
            <td class="tnum" style="color:${sfc};font-weight:600">${f.sfRate===null?"—":pct(f.sfRate)}</td>
            <td class="tnum">${f.yield===null?"—":pct(f.yield)}</td>
            <td><div style="display:flex;height:12px;gap:1px;border-radius:2px;overflow:hidden">
              <div style="width:${f.enr/f.pre*100}%;background:var(--accent)" title="入组"></div>
              <div style="width:${f.sf/f.pre*100}%;background:var(--ink-3)" title="筛败"></div>
              <div style="width:${f.inScr/f.pre*100}%;background:var(--line-2)" title="在筛"></div>
              <div style="flex:1;background:var(--surface-3)" title="预筛未入"></div>
            </div></td>
            <td>${d?`<span class="pill p-${d.k==="筛败率过高"||d.k==="中心未真正启动"?"crit":"warn"}">${esc(d.k)}</span>`
                  :`<span class="t-mut">—</span>`}</td></tr>`;}).join("")}</tbody>
      </table></div>
  </div>
  <div class="card" style="margin-bottom:34px">
      <div class="card-h"><h3>筛败原因分布</h3><span class="sp"></span>
        <span class="sub">原因指向对策，比总数更有用</span></div>
      <div class="card-b">
        <div class="grid g21" style="gap:36px">
        <div id="c-sfr"></div>
        <div class="note" style="line-height:1.75">
          原因分布指向不同的对策：<br>
          <b>实验室指标不符</b>占比高 → 入排窗口与本土人群不匹配，去和申办方谈方案修订；<br>
          <b>既往治疗史不符</b>占比高 → 中心病源以经治患者为主，选址就选错了；<br>
          <b>受试者撤回知情</b>占比高 → 知情沟通质量或补偿方案有问题，这是 CRC 可控的。
        </div>
        </div>
      </div>
  </div>
  <div class="formula">筛败率 = 筛败 ÷ 签署知情｜预筛转化率 = 签署知情 ÷ 预筛｜总转化率 = 入组 ÷ 预筛
每入组 1 例需预筛人数 = 1 ÷ 总转化率 —— 这个数直接决定招募渠道要铺多大
收入 = 启动费 + 入组×单价 + <b>筛败×单价×${pct(SF_FEE)}</b>｜成本含筛败例的筛选期工作量</div>`;

  hbars($("#c-sfr"), reasons.map(r=>({label:r.n, v:r.v,
    tip:`<div class="tip-t">${esc(r.n)}</div><div class="tip-r"><span>例数</span><b>${r.v}</b></div>
         <div class="tip-r"><span>占筛败</span><b>${pct(r.v/T.sf)}</b></div>`})),
    {fmt:v=>v, unit:" 例", h:12, gap:10});
  box.addEventListener("click",e=>{const t=e.target.closest("[data-ss7]"); if(t) openSite(t.dataset.ss7);});
};
</script>
<script>
"use strict";
/* ════════════════════════════════════════════════════════════════════
   中心可行性调查库
   报价模型算「要花多少人天」，可行性库算「这家能不能出病人」。
   两者并列，都是靠自己历史数据攒出来、别人抄不走的东西。
   ════════════════════════════════════════════════════════════════════ */
VIEWS.feas = box=>{
  const list = FEAS.slice().sort((a,b)=>b.date.localeCompare(a.date));
  const done = list.filter(f=>f.actual!=null);
  const evalu = list.filter(f=>f.actual==null);
  /* 校准：预测 vs 实际，得出本公司的系统性偏差 */
  const bias = done.length ? sum(done,f=>f.actual)/Math.max(sum(done,f=>feasScore(f.q).pred),0.01) : null;
  const ov = done.filter(f=>f.override);
  const ovAvg = ov.length? sum(ov,f=>f.actual)/ov.length : null;
  const noOv = done.filter(f=>!f.override);
  const noOvAvg = noOv.length? sum(noOv,f=>f.actual)/noOv.length : null;

  const card = f=>{
    const r = feasScore(f.q), gapPct = f.actual!=null && r.pred>0 ? (f.actual-r.pred)/r.pred : null;
    return `<div class="card ${f.override?"alert alert-warn":""}" style="margin-bottom:30px">
      <div class="card-h">
        <span class="mono" style="font-size:11px;color:var(--ink-3)">${esc(f.id)}</span>
        <h3>${esc(f.hosp)}</h3>
        <span class="sub">${esc(f.dept)} · PI ${esc(f.pi)} · ${esc(f.city)}｜${esc(S[f.sid]?S[f.sid].short:f.sid)}</span>
        <span class="sp"></span>
        <span class="pill p-${r.lvl.k}">${r.total.toFixed(0)} 分 · ${esc(r.lvl.t)}</span>
        <span class="pill p-neut">${esc(f.st)}</span></div>
      <div class="card-b">
        <div class="grid g2" style="gap:16px">
          <div>
            <div class="section-t">评分构成</div>
            <div id="fs-${f.id}"></div>
            <div class="note" style="margin-top:8px">调查人 ${esc(f.by)} · ${esc(f.date)}</div>
          </div>
          <div>
            <div class="section-t">问卷与预测</div>
            <dl class="kv" style="grid-template-columns:130px 1fr">
              <dt>年同适应症例数</dt><dd>${f.q.ptYear}</dd>
              <dt>既往同类试验</dt><dd>${f.q.pastN} 个 · 最好月入组 ${n1(f.q.pastBest)}</dd>
              <dt>在研竞争试验</dt><dd>${f.q.compet} 个</dd>
              <dt>伦理 / 启动周期</dt><dd>${f.q.ethicsDays} / ${f.q.startDays} 天</dd>
              <dt>研究团队</dt><dd>${f.q.teamN} 人</dd>
              <dt>入排合格率</dt><dd>${f.q.eligPct==null
                ? `<span class="pill p-warn">未采集</span>` : pct(f.q.eligPct)}</dd>
              <dt>PI 承诺月入组</dt><dd>${n1(f.q.piCommit)} 例</dd>
            </dl>
            <div style="margin-top:10px;border:1px solid var(--line);border-left:2px solid var(--accent);background:var(--accent-soft);padding:9px 11px;border-radius:0 8px 8px 0">
              <div class="row" style="justify-content:space-between">
                <span class="kpi-l">系统预测月入组</span>
                <b class="num" style="font-size:17px;color:var(--accent)">${n1(r.pred)} 例</b></div>
              <div class="note" style="margin-top:3px;color:var(--ink-2)">
                = min( PI 承诺 ${n1(f.q.piCommit)} × 兑现系数 ${pct(PI_KEEP)}，病源上限 ${n1(r.cap)} )</div>
            </div>
            ${f.actual!=null?`
              <div class="row" style="justify-content:space-between;margin-top:9px;padding-top:9px;border-top:1px solid var(--line)">
                <span class="kpi-l">实际月入组</span>
                <b class="num" style="font-size:17px;color:${gapPct<-0.3?"var(--crit)":gapPct<0?"var(--warn)":"var(--ink)"}">${n1(f.actual)} 例
                  <span style="font-size:11px;font-weight:400">（${gapPct>0?"+":""}${pct(gapPct)}）</span></b></div>`:""}
          </div>
        </div>
        ${f.override?`<div style="margin-top:12px;border-left:2px solid var(--warn);background:var(--warn-soft);padding:9px 11px;font-size:12.5px;color:var(--ink-2);line-height:1.65">
          <b style="color:var(--warn)">⚑ 评分被人为覆盖（override）</b><br>${esc(f.override)}
          ${f.actual!=null?`<br><b>结果</b>：实际月入组 ${n1(f.actual)} 例，预测 ${n1(r.pred)} 例。`:""}</div>`:""}
        ${f.actual==null?`<div class="row" style="margin-top:12px">
          <button class="btn btn-p" data-fin="${esc(f.id)}">推荐入选</button>
          <button class="btn" data-fout="${esc(f.id)}">不予入选</button>
          ${r.lvl.k!=="good"?`<span class="note">评分 ${r.total.toFixed(0)} 分（${r.lvl.t}）。若仍要入选，必须写明覆盖理由 —— 这条记录会进入回溯统计。</span>`:""}
        </div>`:""}
      </div></div>`;
  };

  box.innerHTML=`
  <div class="grid g4" style="gap:10px;margin-bottom:12px">
    ${[["累计调查",FEAS.length,"家","var(--ink)"],
       ["已入选并有结果",done.length,"家","var(--ink)"],
       ["预测校准系数",bias===null?"—":n1(bias)+"×",bias&&bias<0.8?"var(--crit)":"var(--warn)"],
       ["被覆盖入选",ov.length,"家",ov.length?"var(--warn)":"var(--ink)"]
     ].map(([l,v,u,c])=>`<div class="stat">
        <div class="kpi-l">${esc(l)}</div>
        <div class="num" style="font-size:24px;margin-top:3px;color:${c}">${v}<small style="font-size:12px;color:var(--ink-3);margin-left:2px">${typeof u==="string"&&!u.startsWith("var")?u:""}</small></div></div>`).join("")}
  </div>

  <div class="card" style="margin-bottom:12px">
    <div class="card-h"><h3>回溯：这套评分到底准不准</h3><span class="sp"></span>
      <span class="sub">不做回溯的可行性调查，只是一张走过场的表</span></div>
    <div class="card-b">
      <div id="c-feas" style="margin-bottom:12px"></div>
      <div class="grid g2" style="gap:12px">
        <div style="border-left:2px solid var(--crit);background:var(--crit-soft);padding:10px 12px;font-size:12.5px;color:var(--ink-2);line-height:1.7">
          <b style="color:var(--crit)">被覆盖入选的中心：平均月入组 ${ovAvg===null?"—":n1(ovAvg)} 例</b><br>
          未被覆盖的：${noOvAvg===null?"—":n1(noOvAvg)} 例。<br>
          样本很小，但方向明确 —— <b>「申办方指定」和「凑中心数」这两个理由，最后都由我们自己买单。</b>
          把覆盖理由记下来，才有机会在下一次谈判时把它变成筹码。
        </div>
        <div style="border-left:2px solid var(--warn);background:var(--warn-soft);padding:10px 12px;font-size:12.5px;color:var(--ink-2);line-height:1.7">
          <b style="color:var(--warn)">问卷本身也在暴露缺陷</b><br>
          湘雅二评分 ${feasScore(FEAS.find(f=>f.id==="FS-2025-009").q).total.toFixed(0)} 分、病源充足，却出现 57% 筛败率 ——
          因为当时的问卷<b>只问了门诊量，没问「按本方案入排能过几个」</b>。
          「入排合格率」是复盘之后才加进问卷的字段，新一批评估（FS-2026-014/015）已经有了。
        </div>
      </div>
    </div>
  </div>

  ${evalu.length?`<div class="section-t">评估中（${evalu.length}）</div>${evalu.map(card).join("")}`:""}
  <div class="section-t" style="margin-top:16px">已入选并有实际结果（${done.length}）</div>
  ${done.map(card).join("")}

  <div class="formula">评分 = 病源(0–30) + 既往入组表现(0–30) − 竞争试验(0–15) + 启动效率(0–15) + 团队(0–10) ± 入排匹配度修正
预测月入组 = min( PI 承诺 × 兑现系数 ${pct(PI_KEEP)}，年例数÷12 × 入排合格率 × 0.5 )

PI 承诺必须打折 —— 行业经验兑现率 40%–60%。直接用承诺值排产能，是启动期人力估算失准的头号原因。</div>`;

  /* 预测 vs 实际：成对条形，一眼看出系统性高估 */
  $("#c-feas").innerHTML = `
    <div class="legend" style="margin-bottom:9px">
      <span><i style="background:var(--plan)"></i>系统预测月入组</span>
      <span><i style="background:var(--s1)"></i>实际月入组</span>
      <span class="t-mut" style="margin-left:auto">⚑ = 评分被人为覆盖后仍入选</span></div>
    ${done.map(f=>{const r=feasScore(f.q), M=Math.max(...done.map(x=>Math.max(feasScore(x.q).pred,x.actual)))*1.1||1;
      return `<div style="display:grid;grid-template-columns:minmax(110px,190px) 1fr 96px;gap:10px;align-items:center;margin-bottom:7px">
        <div style="font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
          ${f.override?`<span style="color:var(--warn)">⚑ </span>`:""}${esc(f.hosp)}</div>
        <div>
          <div class="bartrack" style="height:9px;margin-bottom:2px">
            <div class="barfill" style="width:${r.pred/M*100}%;background:var(--plan);height:100%"></div></div>
          <div class="bartrack" style="height:9px">
            <div class="barfill" style="width:${f.actual/M*100}%;background:var(--s1);height:100%"></div></div>
        </div>
        <div class="tnum" style="font-size:11.5px;line-height:1.35">
          <div class="t-mut">${n1(r.pred)}</div>
          <div style="color:${f.actual<r.pred*0.7?"var(--crit)":"var(--ink)"};font-weight:600">${n1(f.actual)}</div></div>
      </div>`;}).join("")}`;

  list.forEach(f=>{ const r=feasScore(f.q);
    hbars($("#fs-"+f.id), [
      {label:"病源规模",v:r.parts.src},
      {label:"既往入组表现",v:r.parts.past},
      {label:"启动效率",v:r.parts.start},
      {label:"研究团队",v:r.parts.team},
      {label:"竞争试验",v:r.parts.comp,color:"var(--crit)"},
      ...(f.q.eligPct!=null?[{label:"入排匹配度",v:r.parts.elig,color:"var(--good)"}]:[])
    ], {max:30, fmt:v=>v.toFixed(0), unit:" 分", h:12, gap:10});
  });

  box.addEventListener("click",e=>{
    const yes=e.target.closest("[data-fin]"), no=e.target.closest("[data-fout]");
    if(!yes&&!no) return;
    const id=(yes||no).dataset.fin||(yes||no).dataset.fout;
    const f=FEAS.find(x=>x.id===id), r=feasScore(f.q);
    if(no){ f.st="未入选"; f.actual=0;
      toast(`${f.hosp} 不予入选（评分 ${r.total.toFixed(0)}）`); render(); return; }
    if(r.lvl.k==="good"){ f.st="已入选（待建档）"; f.actual=null;
      toast(`${f.hosp} 推荐入选，评分 ${r.total.toFixed(0)} 分，预测月入组 ${n1(r.pred)} 例 —— 可在「立项与建档」中建档`);
      render(); return; }
    openLayer($("#modal"),`
      <div class="drawer-h"><h3 style="flex:1;font-size:15px">评分未达推荐线，需写明覆盖理由</h3>
        <button class="x" data-close aria-label="关闭">✕</button></div>
      <div style="padding:16px 18px 18px">
        <div style="border-left:2px solid var(--warn);background:var(--warn-soft);padding:9px 11px;font-size:12.5px;color:var(--ink-2);line-height:1.65;margin-bottom:12px">
          ${esc(f.hosp)} 评分 <b>${r.total.toFixed(0)} 分</b>（${esc(r.lvl.t)}），预测月入组仅 <b>${n1(r.pred)} 例</b>。<br>
          覆盖理由会永久记录，并进入「被覆盖入选中心的实际表现」回溯统计。
        </div>
        <textarea class="qbox" id="ovr" placeholder="例：申办方指定，PI 为该适应症区域学术带头人；或：为赶 FPI 时间点凑够中心数。"></textarea>
        <div class="row" style="justify-content:flex-end;margin-top:12px">
          <button class="btn" data-close>取消</button>
          <button class="btn btn-p" id="ovr-go">确认覆盖并入选</button></div>
      </div>`);
    $("#ovr-go").addEventListener("click",()=>{
      const v=$("#ovr").value.trim();
      if(v.length<8){ toast("覆盖理由需写具体（至少 8 个字）","crit"); return; }
      f.override=v; f.st="已入选（覆盖）"; closeLayer();
      toast(`${f.hosp} 已覆盖评分入选，理由已记入回溯统计`,"warn"); setTimeout(render,220);
    });
  });
};
</script>
<script>
"use strict";
/* ════════════════════════════════════════════════════════════════════
   研究者端（PI）—— 法定责任人
   方案偏离要 PI 签字、SAE 由 PI 上报、授权分工表由 PI 签署。
   此前 PI 在系统里只是一个字符串，一个动作都做不了 —— 这在合规上说不通。
   ════════════════════════════════════════════════════════════════════ */
const piSites = ()=>SITES.filter(s=>s.pi===PERSONA().n);
const piSubj  = ()=>{const ids=new Set(piSites().map(s=>s.id)); return SUBJ.filter(s=>ids.has(s.ss));};

VIEWS.pi = box=>{
  const ss=piSites(), ids=new Set(ss.map(s=>s.id));

  const pend=subs.filter(s=>s.pendPi);   // CRC 已完成的访视，等我确认签署

  const sae =SAE_LOG.filter(x=>ids.has(x.ss));
  const late=sae.filter(x=>x.h>SAE_SLA);

  box.innerHTML=`
  <div class="mini" style="margin-bottom:14px">
    ${[["待我确认访视",pend.length,"例",pend.length?"var(--warn)":"var(--ink)"],

       ["我的在组受试者",subs.filter(s=>s.st==="已入组").length,"例","var(--ink)"],
       ["本中心 SAE",sae.length,"例",late.length?"var(--crit)":"var(--ink)"],
       ["授权分工表",doa.filter(r=>r.st==="已准入").length+"/"+doa.length,"","var(--ink)"],
       ["中心入组",ss[0]?`${ss[0].enrolled}/${ss[0].contracted}`:"—","","var(--ink)"]
     ].map(([l,v,u,c])=>`<div><div class="kpi-l">${esc(l)}</div>
        <div class="v" style="color:${c}">${v}<small style="font-size:11px;color:var(--ink-3);margin-left:2px">${u}</small></div></div>`).join("")}
  </div>

  <div class="grid g21" style="gap:12px;margin-bottom:12px">
    <div class="stack">
      <div class="card">
        <div class="card-h"><h3>待我确认的访视</h3><span class="sp"></span>
          <span class="sub">CRC 已完成全部访视任务，需研究者确认后方可锁定</span></div>
        <div class="card-b" style="padding:0">
          ${pend.length? pend.map(s=>`
            <div style="padding:12px 16px;border-bottom:1px solid var(--line)">
              <div class="row" style="gap:6px">
                <span class="subjid">${esc(s.id)}</span>
                ${s.rnd!=="—"?`<span class="pill p-neut">随机号 ${esc(s.rnd)}</span>`:`<span class="pill p-warn">筛选期</span>`}
                <b style="font-size:12.5px">${esc(s.pendPi.visit)}</b>
                <span class="sp"></span>
                <span class="t-sub">CRC ${esc(s.crc)}</span></div>
              <div class="note" style="margin-top:4px">访视完成于 ${esc(s.pendPi.date)}｜全部 ${s.pendPi.tasks.length} 项任务已完成，待研究者签署确认</div>
              <div style="margin-top:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px">
                ${s.pendPi.tasks.map(t=>`<div class="note" style="color:var(--ink-2)">✓ ${esc(t)}</div>`).join("")}
              </div>
              <div class="row" style="margin-top:9px">
                <button class="btn btn-p" data-piok="${esc(s.id)}">确认无误并签署</button>
                <button class="btn" data-piback="${esc(s.id)}">退回 CRC 补充</button></div>
            </div>`).join("") : `<div class="empty">没有待确认的访视</div>`}
        </div>
      </div>
      <div class="card">
        <div class="card-h"><h3>待我签字的文件</h3><span class="sub">方案偏离与资质类问题必须由研究者签署</span></div>
        <div class="card-b" style="padding:0">
          ${dev.length? dev.map(i=>`
            <div style="padding:11px 16px 11px 18px;border-bottom:1px solid var(--line);position:relative">
              <span class="stripe" style="background:var(--${SEV[i.sev].k})"></span>
              <div class="row" style="gap:6px"><span class="pill p-${SEV[i.sev].k}">${esc(i.sev)}</span>
                <b style="font-size:12.5px">${esc(i.type)}</b>
                <span class="t-sub">${esc(i.id)}</span>
                <span class="pill p-neut">来源 ${esc(i.src)}</span></div>
              <div class="note" style="margin-top:4px;color:var(--ink-2)">${esc(i.desc)}</div>
              <div class="row" style="margin-top:8px">
                <button class="btn btn-p" data-pisign="${esc(i.id)}">签署并同意上报伦理</button>
                <span class="note">签署即确认事实描述属实，并同意按 CAPA 执行</span></div>
            </div>`).join("") : `<div class="empty">没有待签署文件</div>`}
        </div>
      </div>
    </div>
    <div class="stack">
      <div class="card">
        <div class="card-h"><h3>SAE 上报记录</h3><span class="sp"></span>
          <span class="pill ${late.length?"p-crit":"p-good"}">${sae.length-late.length}/${sae.length} 在窗口内</span></div>
        <div class="card-b" style="padding:0">
          ${sae.map(x=>`<div style="padding:10px 14px;border-bottom:1px solid var(--line)">
            <div class="row" style="gap:6px"><span class="mono" style="font-size:11px;color:var(--ink-3)">${esc(x.id)}</span>
              <span class="subjid">${esc(x.subj)}</span>
              <span class="pill ${x.h<=SAE_SLA?"p-good":"p-crit"}">${n1(x.h)} h</span></div>
            <div class="note" style="margin-top:3px">${esc(x.term)}｜知晓 ${esc(x.aware)}</div>
          </div>`).join("")||`<div class="empty">本中心暂无 SAE</div>`}
          <div style="padding:11px 14px">
            <button class="btn btn-p" id="pi-sae" style="width:100%;justify-content:center">上报新的 SAE</button>
            <div class="note" style="margin-top:6px;text-align:center">研究者知晓起 ${SAE_SLA} 小时内必须上报</div>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-h"><h3>研究者授权分工表</h3><span class="sub">DOA</span></div>
        <div class="card-b" style="padding:0">
          ${doa.map(r=>`<div style="padding:9px 14px;border-bottom:1px solid var(--line)">
            <div class="row" style="justify-content:space-between;gap:8px">
              <div><b style="font-size:12.5px;font-weight:500">${esc(r.who)}</b>
                <span class="t-sub"> ${esc(r.role)} · ${esc(r.org)}</span></div>
              <span class="pill ${r.st==="已准入"?"p-good":r.st==="资质缺失"?"p-crit":"p-warn"}">${esc(r.st)}</span></div>
            <div class="note" style="margin-top:2px">${esc(r.note)}</div>
          </div>`).join("")}
          <div class="note" style="padding:10px 14px;line-height:1.65">
            未列入本表的人员不得开展任何试验相关工作。这张表由研究者签署 —— <b>签了名，责任就是你的。</b>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-h"><h3>我的受试者</h3><span class="sp"></span>
      <span class="sub">仅筛选号与随机号，无身份信息</span></div>
    <div class="tw"><table style="min-width:700px">
      <thead><tr><th>筛选号</th><th>随机号</th><th>状态</th><th>当前访视</th><th>窗口</th><th>访视任务</th><th>研究者确认</th></tr></thead>
      <tbody>${subs.map(s=>{const w=winState(s);
        return `<tr><td><span class="subjid">${esc(s.id)}</span></td>
          <td class="mono" style="font-size:11.5px">${esc(s.rnd)}</td>
          <td><span class="pill ${s.st==="已入组"?"p-acc":s.st==="筛败"?"p-crit":"p-warn"}">${esc(s.st)}</span></td>
          <td style="font-size:12px">${esc(soaLabel(s.ss,s.seq))}</td>
          <td><span class="pill p-${w.k}">${esc(w.t)}</span></td>
          <td class="tnum">${subjDone(s)}/${s.tasks.length}</td>
          <td>${s.pendPi?`<span class="pill p-warn">待确认 · ${esc(s.pendPi.visit)}</span>`
            :s.piOk?`<span class="pill p-good">已确认</span>`
            :`<span class="t-mut">访视进行中</span>`}</td></tr>`;}).join("")}</tbody>
    </table></div>
  </div>
  <p class="note" style="margin-top:10px">研究者端只看本人担任 PI 的中心。受托方的成本、毛利、人天与利用率不对研究者开放。</p>`;

  box.addEventListener("click",e=>{
    const ok=e.target.closest("[data-piok]");
    if(ok){ const s=SUBJ.find(x=>x.id===ok.dataset.piok); const v=s.pendPi.visit;
      s.piOk=true; s.pendPi=null;
      toast(`${s.id}「${v}」已由研究者确认签署，该次访视记录锁定`); render(); return; }
    const bk=e.target.closest("[data-piback]");
    if(bk){ const s=SUBJ.find(x=>x.id===bk.dataset.piback); const v=s.pendPi.visit;
      s.pendPi=null; s.piOk=false;
      ISSUES.unshift({id:"QI-2026-0"+(200+ISSUES.length), src:"中心自查", ss:s.ss, sev:"一般",
        type:"访视记录退回补充", found:TODAY,
        desc:`研究者复核 ${s.id}「${v}」访视记录后退回，需 CRC 补充源数据或说明。`,
        capa:"（待补充）", own:s.crc, due:new Date(Date.now()+5*864e5).toISOString().slice(0,10),
        st:"待整改", sla:null});
      toast(`${s.id}「${v}」已退回 ${s.crc} 补充，并生成待办`,"warn"); render(); return; }
    const sg=e.target.closest("[data-pisign]");
    if(sg){ const i=ISSUES.find(x=>x.id===sg.dataset.pisign); i.st="待验证";
      toast(`${i.id} 已由研究者签署，并同意上报伦理委员会`); render(); return; }
    if(e.target.closest("#pi-sae")) saeModal();
  });
};

function saeModal(){
  const ss=piSites()[0], subs=piSubj().filter(s=>s.st==="已入组");
  openLayer($("#modal"),`
    <div class="drawer-h"><h3 style="flex:1;font-size:15px">SAE 上报</h3><button class="x" data-close aria-label="关闭">✕</button></div>
    <div style="padding:16px 18px 18px">
      <div class="field"><div class="slider-h"><label for="sa-s">受试者</label></div>
        <select class="sel" id="sa-s" style="width:100%">${subs.map(s=>
          `<option value="${s.id}">${esc(s.id)} · 随机号 ${esc(s.rnd)}</option>`).join("")}</select></div>
      <div class="field"><div class="slider-h"><label for="sa-t">事件名称</label></div>
        <input class="inp" id="sa-t" style="width:100%" placeholder="例：3 级免疫性肝炎"></div>
      <div class="field"><div class="slider-h"><label for="sa-h">研究者知晓至上报耗时</label><b id="sa-hv">6 小时</b></div>
        <input type="range" id="sa-h" min="1" max="72" step="1" value="6"></div>
      <div id="sa-w" style="margin-bottom:12px"></div>
      <div class="row" style="justify-content:flex-end">
        <button class="btn" data-close>取消</button>
        <button class="btn btn-p" id="sa-go">提交上报</button></div>
    </div>`);
  const upd=()=>{ const h=+$("#sa-h").value; $("#sa-hv").textContent=h+" 小时";
    const ok=h<=SAE_SLA;
    $("#sa-w").innerHTML=`<div style="border-left:2px solid var(--${ok?"good":"crit"});background:var(--${ok?"good":"crit"}-soft);padding:8px 11px;font-size:12px;color:var(--ink-2);line-height:1.6">
      ${ok?`在 ${SAE_SLA} 小时窗口内，及时率不受影响。`
         :`<b style="color:var(--crit)">超出 ${SAE_SLA} 小时窗口 ${h-SAE_SLA} 小时</b> —— 提交后将立即生成严重质量事件，
           并使本中心 SAE 及时率跌破 100%。这是合规红线，不是 KPI。`}</div>`; };
  $("#sa-h").addEventListener("input",upd); upd();
  $("#sa-go").addEventListener("click",()=>{
    const h=+$("#sa-h").value, subj=$("#sa-s").value, term=$("#sa-t").value.trim()||"未填写事件名称";
    const id="SAE-00"+(42+SAE_LOG.length);
    SAE_LOG.unshift({id, ss:ss.id, subj, term, aware:TODAY+" 09:00",
      rpt:TODAY+" "+String(9+Math.floor(h/24)).padStart(2,"0")+":00", h});
    if(h>SAE_SLA) ISSUES.unshift({id:"QI-2026-0"+(170+ISSUES.length), src:"中心自查", ss:ss.id,
      sev:"严重", type:"SAE 上报超窗", found:TODAY,
      desc:`受试者 ${subj}「${term}」研究者知晓至上报 ${h} 小时，超出 ${SAE_SLA} 小时窗口。`,
      capa:"（待提交整改措施）", own:ss.crc[0],
      due:new Date(Date.now()+10*864e5).toISOString().slice(0,10), st:"待整改", sla:SAE_SLA, elapsed:h});
    closeLayer();
    toast(h<=SAE_SLA? `${id} 已上报，${h} 小时，在窗口内`
      : `${id} 已上报但超窗 ${h-SAE_SLA} 小时，已自动生成严重质量事件`, h<=SAE_SLA?"":"crit");
    setTimeout(render,220);
  });
}
</script>
<script>
"use strict";
/* ════════════════════════════════════════════════════════════════════
   QA 端 —— 我方的第二道防线
   机构质控是医院查我们，QA 是我们自己查自己。
   QA 真正的价值不在于再发现一批问题，而在于 CAPA 有效性验证：
   同类问题是否复发。复发 = 当初只做了纠正，没做预防。
   ════════════════════════════════════════════════════════════════════ */
VIEWS.audit = box=>{
  const open=AUDIT.filter(a=>a.st!=="已关闭");
  const fo=AUDIT.flatMap(a=>a.findings.map(f=>({a,f}))).filter(({f})=>f.st!=="已关闭");
  const rep=AUDIT.flatMap(a=>a.findings).filter(f=>f.repeat);
  const eff=capaEffect().filter(x=>x.n>0);
  const SA=saeStats(null), QS=queryStats(null);

  /* 中心质量评级：未关闭事件、复发、SAE 超窗、质疑挂起 四项合成 */
  const grade = SITES.filter(s=>s.enrolled>0).map(s=>{
    const iss=ISSUES.filter(i=>i.ss===s.id), openI=iss.filter(i=>i.st!=="已关闭");
    const sev=openI.filter(i=>i.sev!=="一般").length;
    const saeBad=SAE_LOG.filter(x=>x.ss===s.id&&x.h>SAE_SLA).length;
    const qOld=QUERIES.filter(q=>q.ss===s.id&&q.st==="待中心回复"&&q.age>7).length;
    const rp=AUDIT.flatMap(a=>a.ss===s.id?a.findings.filter(f=>f.repeat):[]).length;
    const pen=sev*3 + (openI.length-sev) + saeBad*4 + qOld*2 + rp*4;
    const g = pen===0?{g:"A",k:"good"} : pen<=3?{g:"B",k:"good"} : pen<=7?{g:"C",k:"warn"} : {g:"D",k:"crit"};
    return {s, pen, sev, openI:openI.length, saeBad, qOld, rp, ...g};
  }).sort((a,b)=>b.pen-a.pen);

  box.innerHTML=`
  <div class="grid g4" style="gap:10px;margin-bottom:12px">
    ${[["进行中稽查",open.length,"项",open.length?"var(--warn)":"var(--ink)"],
       ["待整改发现",fo.length,"项",fo.length?"var(--warn)":"var(--ink)"],
       ["复发问题",rep.length,"项",rep.length?"var(--crit)":"var(--ink)"],
       ["D 级中心",grade.filter(g=>g.g==="D").length,"个",grade.filter(g=>g.g==="D").length?"var(--crit)":"var(--ink)"]
     ].map(([l,v,u,c])=>`<div class="stat">
        <div class="kpi-l">${esc(l)}</div>
        <div class="num" style="font-size:24px;margin-top:3px;color:${c}">${v}<small style="font-size:12px;color:var(--ink-3);margin-left:2px">${u}</small></div></div>`).join("")}
  </div>

  <div class="card ${rep.length?"alert alert-crit":""}" style="margin-bottom:28px">
    <div class="card-h"><h3>CAPA 有效性验证</h3><span class="sp"></span>
      <span class="sub">复发 = 当初只做了纠正，没做预防</span></div>
    <div class="card-b">
      <div class="tw"><table style="min-width:600px">
        <thead><tr><th>问题类型</th><th class="ta-r">累计发生</th><th class="ta-r">已关闭</th>
          <th class="ta-r">关闭后复发</th><th>CAPA 有效性判定</th></tr></thead>
        <tbody>${eff.map(x=>{
          const v = x.repeat>0 ? ["p-crit","无效：需重做根因分析"]
                  : x.closed===x.n ? ["p-good","有效：关闭后未复发"]
                  : ["p-neut","待观察：尚有未关闭项"];
          return `<tr><td class="t-main">${esc(x.type)}</td>
            <td class="tnum">${x.n}</td><td class="tnum">${x.closed}</td>
            <td class="tnum" style="${x.repeat?"color:var(--crit);font-weight:600":""}">${x.repeat}</td>
            <td><span class="pill ${v[0]}">${v[1]}</span></td></tr>`;}).join("")}</tbody>
      </table></div>
      ${rep.length?`<div style="margin-top:12px;border-left:2px solid var(--crit);background:var(--crit-soft);padding:10px 12px;font-size:12.5px;color:var(--ink-2);line-height:1.7">
        <b style="color:var(--crit)">${rep.length} 项问题在 CAPA 关闭后复发。</b>
        以「源数据缺陷」为例：QI-2026-0151 的 CAPA 写的是「研究者集中补签并留痕」——
        <b>那是纠正，不是预防</b>。补完签名，下个月照样缺。真正的预防应当是把签名完整性做进
        CRC 每周自查清单并留痕，或改用带强制签名字段的电子源数据。<br>
        <b>只做纠正不做预防的 CAPA，等于把同一个核查风险往后推了一个季度。</b></div>`:""}
    </div>
  </div>

  <div class="grid g21" style="gap:12px;margin-bottom:12px">
    <div class="card">
      <div class="card-h"><h3>内部稽查</h3><span class="sp"></span>
        <button class="btn btn-p" id="au-new">+ 发起内部稽查</button></div>
      <div class="card-b" style="padding:0">
        ${AUDIT.map(a=>`<div style="padding:12px 16px 12px 18px;border-bottom:1px solid var(--line);position:relative">
          ${a.st!=="已关闭"?`<span class="stripe" style="background:var(--warn)"></span>`:""}
          <div class="row" style="gap:7px">
            <span class="mono" style="font-size:11px;color:var(--ink-3)">${esc(a.id)}</span>
            <b style="font-size:12.5px">${esc(a.type)}</b>
            <span class="t-sub">${esc(site(a.ss).hosp)} · ${esc(a.date)}</span>
            <span class="sp"></span>
            <span class="pill ${a.st==="已关闭"?"p-good":"p-warn"}">${esc(a.st)}</span></div>
          <div class="note" style="margin-top:4px">${esc(a.scope)}</div>
          ${a.findings.map((f,k)=>`
            <div style="margin-top:8px;border:1px solid var(--line);border-left:2px solid var(--${f.st==="已关闭"?"good":SEV[f.sev].k});border-radius:0 8px 8px 0;padding:8px 10px">
              <div class="row" style="gap:6px">
                <span class="pill p-${f.st==="已关闭"?"good":SEV[f.sev].k}">${esc(f.sev)}</span>
                ${f.repeat?`<span class="pill p-crit">复发 · 源自 ${esc(f.repeat)}</span>`:""}
                <span class="sp"></span>
                <span class="pill p-neut">${esc(f.st)}</span></div>
              <div style="font-size:12.5px;margin-top:4px;color:var(--ink-2);line-height:1.6">${esc(f.t)}</div>
              ${f.st!=="已关闭"?`<button class="btn" style="margin-top:7px" data-auok="${esc(a.id)}:${k}">验证整改并关闭</button>`:""}
            </div>`).join("")}
        </div>`).join("")}
      </div>
    </div>
    <div class="card">
      <div class="card-h"><h3>中心质量评级</h3><span class="sub">A–D 四级</span></div>
      <div class="card-b" style="padding:0">
        ${grade.map(g=>`<div style="padding:9px 14px;border-bottom:1px solid var(--line)">
          <div class="row" style="justify-content:space-between;gap:8px">
            <div style="min-width:0"><b style="font-size:12.5px;font-weight:500">${esc(g.s.hosp)}</b>
              <div class="t-sub">${esc(S[g.s.sid].short)}</div></div>
            <span class="pill p-${g.k}" style="font-size:13px;font-weight:700;min-width:26px;justify-content:center">${g.g}</span></div>
          <div class="note" style="margin-top:2px">
            ${g.sev?`重大/严重 ${g.sev}·`:""}${g.openI?`未关闭 ${g.openI}·`:""}${g.saeBad?`SAE 超窗 ${g.saeBad}·`:""}${g.qOld?`质疑挂起 ${g.qOld}·`:""}${g.rp?`复发 ${g.rp}·`:""}${g.pen===0?"无扣分项":`扣分 ${g.pen}`}</div>
        </div>`).join("")}
      </div>
    </div>
  </div>
  <div class="formula">质量扣分 = 重大/严重未关闭×3 + 一般未关闭×1 + SAE 超窗×4 + 质疑挂起超 7 天×2 + <b>CAPA 后复发×4</b>
A：0 分｜B：≤3｜C：≤7｜D：&gt;7 —— 复发权重最高，因为它证明的是体系失效，不是单点失误
公司层面：SAE 及时率 ${SA.rate===null?"—":pct(SA.rate)}（${SA.ok}/${SA.n}）· 质疑平均挂起 ${QS.avg===null?"—":n1(QS.avg)} 天 —— 均由台账算出</div>`;

  $("#au-new").addEventListener("click",()=>{
    openLayer($("#modal"),`
      <div class="drawer-h"><h3 style="flex:1;font-size:15px">发起内部稽查</h3><button class="x" data-close aria-label="关闭">✕</button></div>
      <div style="padding:16px 18px 18px">
        <div class="field"><div class="slider-h"><label for="au-s">受稽查中心</label></div>
          <select class="sel" id="au-s" style="width:100%">${SITES.filter(s=>s.enrolled>0).map(s=>
            `<option value="${s.id}">${esc(s.hosp)}（${esc(S[s.sid].short)}）</option>`).join("")}</select></div>
        <div class="field"><div class="slider-h"><label for="au-t">稽查类型</label></div>
          <select class="sel" id="au-t" style="width:100%">
            <option>中心内部稽查</option><option>体系稽查</option>
            <option>CAPA 有效性验证</option><option>核查前模拟稽查</option></select></div>
        <div class="field"><div class="slider-h"><label for="au-sc">稽查范围</label></div>
          <textarea class="qbox" id="au-sc" placeholder="例：针对该中心质疑挂起超 7 天与源数据签名问题的专项稽查。"></textarea></div>
        <div id="au-hint" style="margin-bottom:12px"></div>
        <div class="row" style="justify-content:flex-end">
          <button class="btn" data-close>取消</button>
          <button class="btn btn-p" id="au-go">发起</button></div>
      </div>`);
    const hint=()=>{ const s=site($("#au-s").value), g=grade.find(x=>x.s.id===s.id);
      $("#au-hint").innerHTML = g? `<div style="border-left:2px solid var(--${g.k});background:var(--${g.k}-soft);padding:8px 11px;font-size:12px;color:var(--ink-2);line-height:1.6">
        该中心当前质量评级 <b>${g.g} 级</b>（扣分 ${g.pen}）。${g.rp?`存在 ${g.rp} 项 CAPA 后复发问题，建议本次稽查直接切入根因分析而非重复开发现。`:g.g==="A"?"无扣分项，可按常规抽样。":"建议覆盖未关闭事件对应的源数据。"}</div>`:"";};
    $("#au-s").addEventListener("change",hint); hint();
    $("#au-go").addEventListener("click",()=>{
      const ssid=$("#au-s").value;
      AUDIT.unshift({id:"AU-2026-0"+(7+AUDIT.length), ss:ssid, type:$("#au-t").value, date:TODAY,
        by:PERSONA().n, st:"进行中", scope:$("#au-sc").value.trim()||"常规抽样", findings:[]});
      closeLayer(); toast(`已对 ${site(ssid).hosp} 发起${$("#au-t").value}`); setTimeout(render,220);
    });
  });
  box.addEventListener("click",e=>{
    const b=e.target.closest("[data-auok]"); if(!b) return;
    const [id,k]=b.dataset.auok.split(":"); const a=AUDIT.find(x=>x.id===id);
    a.findings[+k].st="已关闭";
    if(a.findings.every(f=>f.st==="已关闭")) a.st="已关闭";
    toast(`稽查发现已验证关闭`); render();
  });
};
</script>
<script>
"use strict";
/* ════════════════════════════════════════════════════════════════════
   药品与样本 · 受试者补偿
   这两块是 CRC 每周实际花时间最多、也是稽查最爱查的地方，
   此前整套系统只在质控检查项里放了两行文本。
   ════════════════════════════════════════════════════════════════════ */

/* ── 试验用药品数量平衡 + 生物样本链 ── */
VIEWS.material = box=>{
  const mine = PERSONA().k==="crc" ? staff(PERSONA().n).sites : [...scopeIds()];
  const ip = IP.filter(r=>mine.includes(r.ss));
  const sp = SPEC.filter(r=>mine.includes(r.ss));
  const bad = ip.filter(r=>ipM(r).diff!==0);
  const expSoon = ip.filter(r=>ipM(r).expLeft<60);
  const spBad = sp.filter(r=>r.st!=="已回执");

  box.innerHTML=`
  <div class="grid g4" style="gap:10px;margin-bottom:12px">
    ${[["数量不平衡",bad.length,"批",bad.length?"var(--crit)":"var(--ink)"],
       ["效期 60 天内",expSoon.length,"批",expSoon.length?"var(--warn)":"var(--ink)"],
       ["温度越限",sum(ip,r=>r.exc),"次",sum(ip,r=>r.exc)?"var(--warn)":"var(--ink)"],
       ["样本链未闭环",spBad.length,"份",spBad.length?"var(--warn)":"var(--ink)"]
     ].map(([l,v,u,c])=>`<div class="stat">
        <div class="kpi-l">${esc(l)}</div>
        <div class="num" style="font-size:24px;margin-top:3px;color:${c}">${v}<small style="font-size:12px;color:var(--ink-3);margin-left:2px">${u}</small></div></div>`).join("")}
  </div>

  <div class="card" style="margin-bottom:12px">
    <div class="card-h"><h3>试验用药品数量平衡</h3><span class="sp"></span>
      <span class="sub">接收 − 发放 = 账面库存；实盘对不上就是严重发现</span></div>
    <div class="tw"><table style="min-width:880px">
      <thead><tr><th>中心 / 批号</th><th class="ta-r">接收</th><th class="ta-r">发放</th>
        <th class="ta-r">账面库存</th><th class="ta-r">实盘</th><th class="ta-r">差异</th>
        <th class="ta-r">回收</th><th class="ta-r">已销毁</th><th>效期</th><th>温控</th><th></th></tr></thead>
      <tbody>${ip.map((r,k)=>{const m=ipM(r);
        return `<tr>
          <td><div class="t-main">${esc(site(r.ss).hosp)}</div><div class="t-sub">批号 ${esc(r.batch)}</div></td>
          <td class="tnum">${r.recv}</td><td class="tnum">${r.disp}</td>
          <td class="tnum">${m.book}</td><td class="tnum">${r.count}</td>
          <td class="tnum" style="font-weight:700;color:${m.diff===0?"var(--good)":"var(--crit)"}">${m.diff>0?"+":""}${m.diff}</td>
          <td class="tnum">${r.ret}</td><td class="tnum">${r.dest}</td>
          <td><span class="pill ${m.expLeft<60?"p-crit":m.expLeft<120?"p-warn":"p-neut"}">${esc(r.exp)}</span>
            <div class="t-sub">剩 ${m.expLeft} 天</div></td>
          <td>${r.exc?`<span class="pill p-warn">越限 ${r.exc} 次</span>`:`<span class="pill p-good">正常</span>`}</td>
          <td class="ta-r">${m.diff!==0?`<button class="btn" data-ipfix="${k}">上报差异</button>`
            :r.ret>r.dest?`<button class="btn" data-ipdest="${k}">登记销毁</button>`:""}</td>
        </tr>`;}).join("")||`<tr><td colspan="11"><div class="empty">范围内暂无药品记录</div></td></tr>`}</tbody>
    </table></div>
  </div>
  ${bad.length?`<div class="card" style="margin-bottom:12px;border-left:2px solid var(--crit)">
    <div class="card-b">
      <b style="font-size:13px;color:var(--crit)">数量不平衡是稽查与核查的必查项</b>
      <div class="note" style="margin-top:5px;line-height:1.7;color:var(--ink-2)">
        ${bad.map(r=>`${esc(site(r.ss).hosp)} 批号 ${esc(r.batch)}：账面 ${ipM(r).book} 盒，实盘 ${r.count} 盒，差 ${ipM(r).diff} 盒。`).join("<br>")}<br>
        药品去向无法解释，等同于无法证明受试者用的是试验药 —— 严重时该中心的疗效数据会被整体剔除。
        必须当天查清并书面上报申办方，不能等下次监查。</div>
    </div></div>`:""}

  <div class="card">
    <div class="card-h"><h3>生物样本链</h3><span class="sp"></span>
      <span class="sub">采集 → 离心 → 暂存 → 转运 → 回执，断一环即失效</span></div>
    <div class="tw"><table style="min-width:820px">
      <thead><tr><th>中心</th><th>受试者</th><th>样本</th><th>采集</th><th>离心</th><th>暂存</th><th>转运</th><th>回执</th><th>状态</th></tr></thead>
      <tbody>${sp.map(r=>{
        const bad = r.st!=="已回执";
        return `<tr><td style="font-size:12px">${esc(site(r.ss).hosp)}</td>
          <td><span class="subjid">${esc(r.subj)}</span></td>
          <td class="t-sub">${esc(r.type)}</td>
          <td class="mono" style="font-size:11px">${esc(r.coll)}</td>
          <td class="mono" style="font-size:11px;${r.spin==="—"?"color:var(--crit)":""}">${esc(r.spin)}</td>
          <td class="t-sub">${esc(r.store)}</td>
          <td class="mono" style="font-size:11px">${esc(r.ship)}</td>
          <td class="mono" style="font-size:11px">${esc(r.ack)}</td>
          <td><span class="pill ${bad?(r.st==="待转运"?"p-warn":"p-crit"):"p-good"}">${esc(r.st)}</span></td></tr>`;}).join("")
        ||`<tr><td colspan="9"><div class="empty">范围内暂无样本记录</div></td></tr>`}</tbody>
    </table></div>
    <div class="card-b">
      <div class="note" style="line-height:1.7">
        「离心超时」与「回执逾期」是两类最常见也最容易被忽略的样本问题：前者让样本本身失效，
        后者意味着<b>样本可能根本没到中心实验室</b>，而中心还在按计划采下一次。
        这两项都不会自己报警 —— 除非系统盯着时间戳。</div>
    </div>
  </div>`;

  box.addEventListener("click",e=>{
    const f=e.target.closest("[data-ipfix]");
    if(f){ const r=ip[+f.dataset.ipfix], m=ipM(r);
      ISSUES.unshift({id:"QI-2026-0"+(190+ISSUES.length), src:"中心自查", ss:r.ss, sev:"严重",
        type:"药品数量不平衡", found:TODAY,
        desc:`批号 ${r.batch}：账面库存 ${m.book} 盒，实盘 ${r.count} 盒，差异 ${m.diff} 盒，去向待查清。`,
        capa:"（待提交整改措施）", own:site(r.ss).crc[0],
        due:new Date(Date.now()+5*864e5).toISOString().slice(0,10), st:"待整改", sla:null});
      toast(`已上报药品数量差异并生成严重质量事件，同步通知 CRA 与申办方`,"crit"); render(); return; }
    const d=e.target.closest("[data-ipdest]");
    if(d){ const r=ip[+d.dataset.ipdest]; r.dest=r.ret;
      toast(`${site(r.ss).hosp} 批号 ${r.batch}：${r.ret} 盒回收药品已登记销毁`); render(); }
  });
};

/* ── 受试者补偿：CRC 每周的固定动作，也是财务合规重点 ── */
VIEWS.pay = box=>{
  const mine = PERSONA().k==="crc" ? staff(PERSONA().n).sites : [...scopeIds()];
  const list = PAY.filter(p=>mine.includes(p.ss));
  const pend = list.filter(p=>p.st!=="已发放");
  const cash = list.filter(p=>p.way==="现金");
  const noRc = list.filter(p=>!p.rc);
  const tot  = sum(list,p=>p.traffic+p.meal);

  box.innerHTML=`
  <div class="grid g4" style="gap:10px;margin-bottom:12px">
    ${[["累计补偿",n0(tot),"元","var(--ink)"],
       ["待发放 / 待签收",pend.length,"笔",pend.length?"var(--warn)":"var(--ink)"],
       ["无签收凭证",noRc.length,"笔",noRc.length?"var(--crit)":"var(--ink)"],
       ["现金发放",cash.length,"笔",cash.length?"var(--warn)":"var(--ink)"]
     ].map(([l,v,u,c])=>`<div class="stat">
        <div class="kpi-l">${esc(l)}</div>
        <div class="num" style="font-size:24px;margin-top:3px;color:${c}">${v}<small style="font-size:12px;color:var(--ink-3);margin-left:2px">${u}</small></div></div>`).join("")}
  </div>
  <div class="card" style="margin-bottom:12px">
    <div class="card-h"><h3>补偿发放台账</h3><span class="sp"></span>
      <span class="sub">发放记录必须与访视记录一一对应</span></div>
    <div class="tw"><table style="min-width:820px">
      <thead><tr><th>受试者</th><th>中心</th><th>对应访视</th><th class="ta-r">交通费</th><th class="ta-r">营养费</th>
        <th class="ta-r">合计</th><th>发放日</th><th>方式</th><th>签收</th><th>状态</th><th></th></tr></thead>
      <tbody>${list.map((p,k)=>`<tr>
        <td><span class="subjid">${esc(p.subj)}</span></td>
        <td style="font-size:12px">${esc(site(p.ss).hosp)}</td>
        <td class="t-sub">${esc(p.visit)}</td>
        <td class="tnum">${p.traffic}</td><td class="tnum">${p.meal}</td>
        <td class="tnum" style="font-weight:600">${p.traffic+p.meal}</td>
        <td class="mono" style="font-size:11.5px">${esc(p.d)}</td>
        <td><span class="pill ${p.way==="现金"?"p-warn":"p-neut"}">${esc(p.way)}</span></td>
        <td>${p.rc?`<span class="pill p-good">已签收</span>`:`<span class="pill p-crit">缺凭证</span>`}</td>
        <td><span class="pill ${p.st==="已发放"?"p-good":"p-warn"}">${esc(p.st)}</span></td>
        <td class="ta-r">${p.st!=="已发放"?`<button class="btn" data-payok="${k}">登记发放并签收</button>`:""}</td>
      </tr>`).join("")||`<tr><td colspan="11"><div class="empty">范围内暂无补偿记录</div></td></tr>`}</tbody>
    </table></div>
  </div>
  <div class="card"><div class="card-b">
    <div class="section-t">为什么这一页必须存在</div>
    <div class="note" style="line-height:1.8">
      受试者补偿是 CRC 每周固定要花时间的事，也是<b>稽查与核查必查项</b>，查三件：<br>
      ① <b>发放记录与访视记录是否一一对应</b> —— 有访视无发放，或有发放无访视，都要解释；<br>
      ② <b>是否有受试者签收凭证</b> —— 缺凭证等同于无法证明补偿真实发放；<br>
      ③ <b>现金发放是否合规</b> —— 现金无流水，是财务与伦理双重风险，能转账就不该给现金。<br>
      此前整套系统里这块是空白，而它每周消耗的 CRC 工时并不比数据录入少 ——
      <b>系统不管的工作不会消失，只会变成没人记录的加班。</b></div>
  </div></div>`;

  box.addEventListener("click",e=>{
    const b=e.target.closest("[data-payok]"); if(!b) return;
    const p=list[+b.dataset.payok];
    p.st="已发放"; p.rc=true; if(p.d==="—") p.d=TODAY;
    toast(`${p.subj} ${p.visit} 补偿 ${p.traffic+p.meal} 元已发放并取得签收凭证`); render();
  });
};
</script>
