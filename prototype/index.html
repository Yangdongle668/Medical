<title>临床中心台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* ══════════════════════════════════════════════════════════════════
   INSTRUMENT — 精密仪器的视觉语言
   排版承担重量；界面是一个平面，不是一摞卡片。
   暖中性 × 冷强调色：温差是全部诀窍。强调色只在"活着"的地方出现。
   ══════════════════════════════════════════════════════════════════ */

:root{
  /* 平面 */
  --ground:#F7F6F3; --surface:#FFFFFF; --surface-2:#F2F1ED; --surface-3:#E9E7E2;
  /* 墨 */
  --ink:#111112; --ink-2:#4A4A4D; --ink-3:#74747A;
  /* 线 */
  --line:#EAE8E3; --line-2:#DCD9D3;
  /* 强调（指示灯） */
  --accent:#1A56DB; --accent-ink:#FFFFFF; --accent-soft:#EFF3FD; --accent-line:#C6D6F7;
  /* 语义 —— 低饱和，绝不做红绿灯 */
  --good:#16794C; --good-soft:#EDF5F1; --warn:#8A5B00; --warn-soft:#F8F3E9;
  --crit:#B3261E; --crit-soft:#FBEFEE;
  /* 数据序列：计划=中性参考，实际=强调色 */
  --plan:#87878D;
  --s1:#16357C; --s2:#2451C0; --s3:#4571DC; --s4:#6D90E3; --s5:#93AEEA;
  /* 高度：只给悬浮物 */
  --pop:0 1px 2px rgba(17,17,18,.04), 0 12px 32px -8px rgba(17,17,18,.14);
  --ease:cubic-bezier(.2,0,0,1); --t:140ms;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ground:#08080A; --surface:#101012; --surface-2:#191A1C; --surface-3:#232426;
  --ink:#F4F3F1; --ink-2:#A8A8AD; --ink-3:#8B8B93;
  --line:#212123; --line-2:#2E2F32;
  --accent:#5A8CF5; --accent-ink:#08080A; --accent-soft:#111C33; --accent-line:#25375C;
  --good:#4EA97A; --good-soft:#0E1D16; --warn:#CFA24F; --warn-soft:#1F1A0F;
  --crit:#E4695C; --crit-soft:#23120F;
  --plan:#8A8A92;
  --s1:#A9C2FF; --s2:#7FA3F5; --s3:#5A85E8; --s4:#3E66C9; --s5:#33549F;
  --pop:0 1px 2px rgba(0,0,0,.5), 0 16px 40px -10px rgba(0,0,0,.7);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#08080A; --surface:#101012; --surface-2:#191A1C; --surface-3:#232426;
  --ink:#F4F3F1; --ink-2:#A8A8AD; --ink-3:#8B8B93;
  --line:#212123; --line-2:#2E2F32;
  --accent:#5A8CF5; --accent-ink:#08080A; --accent-soft:#111C33; --accent-line:#25375C;
  --good:#4EA97A; --good-soft:#0E1D16; --warn:#CFA24F; --warn-soft:#1F1A0F;
  --crit:#E4695C; --crit-soft:#23120F;
  --plan:#8A8A92;
  --s1:#A9C2FF; --s2:#7FA3F5; --s3:#5A85E8; --s4:#3E66C9; --s5:#33549F;
  --pop:0 1px 2px rgba(0,0,0,.5), 0 16px 40px -10px rgba(0,0,0,.7);
  color-scheme:dark;
}

/* ── 基底 ─────────────────────────────────────────────────────── */
*{box-sizing:border-box}
body{
  margin:0; background:var(--surface); color:var(--ink);
  font-family:"DM Sans","PingFang SC","Source Han Sans SC","Microsoft YaHei",-apple-system,system-ui,sans-serif;
  font-size:13.5px; line-height:1.55; letter-spacing:-.006em;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
.mono,.num,.tnum,.cd,.subjid{font-variant-numeric:tabular-nums}
.mono{font-family:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.03em;font-weight:600}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
a{color:var(--accent);text-underline-offset:2px}
button{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
::selection{background:var(--accent-soft);color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ── 外壳 ─────────────────────────────────────────────────────── */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.rail{
  background:var(--ground);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
  scrollbar-width:thin;
}
.brand{padding:26px 24px 20px;display:flex;gap:10px;align-items:center}
.brand-mark{
  width:22px;height:22px;flex:none;border-radius:5px;background:var(--ink);color:var(--surface);
  display:grid;place-items:center;font-size:11px;font-weight:700;letter-spacing:0;
}
.brand-name{font-size:14.5px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.brand-sub{
  font-family:"DM Mono",monospace;font-size:9.5px;color:var(--ink-3);
  letter-spacing:.1em;text-transform:uppercase;margin-top:1px;
}
.persona{padding:0 24px 20px;display:flex;gap:9px;align-items:center}
.persona .n{font-size:13px;font-weight:500;line-height:1.25}
.persona .d{font-size:11px;color:var(--ink-3);line-height:1.3}
.nav{padding:0 12px 20px;flex:1}
.nav-group{
  font-family:"DM Mono",monospace;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);padding:20px 12px 7px;
}
.nav-group:first-child{padding-top:4px}
.nav-item{
  display:flex;align-items:center;gap:8px;width:100%;padding:6px 12px;border:0;background:none;
  border-radius:6px;cursor:pointer;text-align:left;color:var(--ink-2);font-size:13.5px;
  position:relative;transition:color var(--t) var(--ease),background var(--t) var(--ease);
}
.nav-item:hover{color:var(--ink);background:var(--surface-2)}
.nav-item[aria-current="true"]{color:var(--ink);font-weight:500}
.nav-item[aria-current="true"]::before{
  content:"";position:absolute;left:-12px;top:7px;bottom:7px;width:2px;
  background:var(--accent);border-radius:0 2px 2px 0;
}
.nav-ic{display:none}                 /* 图标退场：分组与排版已经说清楚了层级 */
.nav-badge{
  margin-left:auto;font-family:"DM Mono",monospace;font-size:10px;font-variant-numeric:tabular-nums;
  color:var(--crit);font-weight:500;
}
.rail-foot{padding:16px 24px 24px;font-size:11px;color:var(--ink-3);line-height:1.6}

.main{min-width:0;display:flex;flex-direction:column;background:var(--surface)}
.topbar{
  position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);
  padding:0 40px;min-height:57px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;
}
.crumb{font-size:12.5px;color:var(--ink-3)}
.crumb b{color:var(--ink);font-weight:500}
.topbar-sp{flex:1}
.demo-tag{
  font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 8px;border-radius:4px;background:var(--surface-2);color:var(--ink-3);
}
.content{padding:36px 40px 88px;max-width:1520px;width:100%}
.view-head{margin-bottom:34px;max-width:78ch}
.view-head h1{font-size:29px;line-height:1.15;letter-spacing:-.03em;font-weight:600}
.view-head p{margin:9px 0 0;color:var(--ink-3);font-size:13.5px;line-height:1.65}

/* ── 控件 ─────────────────────────────────────────────────────── */
.sel,.inp{
  font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line-2);border-radius:6px;
  background:var(--surface);color:var(--ink);transition:border-color var(--t) var(--ease);
}
.sel{padding-right:26px}
.sel:hover,.inp:hover{border-color:var(--ink-3)}
.inp::placeholder{color:var(--ink-3)}
.seg{
  display:inline-flex;background:var(--surface-2);border-radius:7px;padding:2px;gap:2px;
}
.seg button{
  border:0;background:none;padding:4px 11px;font-size:12.5px;cursor:pointer;color:var(--ink-3);
  border-radius:5px;transition:all var(--t) var(--ease);white-space:nowrap;
}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(17,17,18,.07)}
:root[data-theme="dark"] .seg button[aria-pressed="true"],
:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{box-shadow:none;background:var(--surface-3)}
.seg button:not([aria-pressed="true"]):hover{color:var(--ink)}
.btn{
  border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:6px 12px;
  font-size:13px;cursor:pointer;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;
  transition:all var(--t) var(--ease);white-space:nowrap;
}
.btn:hover{background:var(--surface-2);color:var(--ink);border-color:var(--ink-3)}
.btn:active{transform:translateY(.5px)}
.btn-p{background:var(--ink);border-color:var(--ink);color:var(--surface);font-weight:500}
.btn-p:hover{background:var(--ink);border-color:var(--ink);color:var(--surface);opacity:.86}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.chip{
  border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:3px 11px;
  font-size:12px;cursor:pointer;color:var(--ink-2);transition:all var(--t) var(--ease);
}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip:not([aria-pressed="true"]):hover{border-color:var(--ink-3);color:var(--ink)}

/* ── 区块：发丝线与留白分区，不用盒子 ─────────────────────────── */
.card{background:none;border:0;border-radius:0;min-width:0}
.card-h{
  padding:0 0 12px;border-bottom:1px solid var(--line-2);
  display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
}
.card-h h3{font-size:15px;font-weight:600;letter-spacing:-.02em;white-space:nowrap;flex:none}
.card-h .sub{font-size:12px;color:var(--ink-3);flex:0 1 auto;min-width:0;overflow-wrap:anywhere}
.card-h .sp{flex:1}
.card-b{padding:18px 0 0}
.grid{display:grid;gap:28px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:1.9fr 1fr}
.g12{grid-template-columns:1fr 1.9fr}
.stack{display:flex;flex-direction:column;gap:22px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ── 指标：仪表盘刻度组，被竖线分隔的数字，不是磁贴 ───────────── */
.stat,.kpi{
  background:none;border:0;border-radius:0;padding:0 0 0 20px;text-align:left;width:100%;
  display:block;position:relative;min-width:0;
}
.grid > .stat:first-child,.grid > .kpi:first-child{padding-left:0}
.grid > .stat::before,.grid > .kpi::before{
  content:"";position:absolute;left:0;top:2px;bottom:2px;width:1px;background:var(--line);
}
.grid > .stat:first-child::before,.grid > .kpi:first-child::before{display:none}
.kpi{cursor:pointer;transition:opacity var(--t) var(--ease)}
.kpi:hover{opacity:.62}
.kpi-l,.stat .kpi-l{
  font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);display:flex;align-items:center;gap:5px;
}
.kpi-v{
  font-size:31px;font-weight:600;margin-top:9px;line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:-.04em;
}
.kpi-v small{font-size:14px;font-weight:400;color:var(--ink-3);margin-left:2px;letter-spacing:-.01em}
.stat .num{font-size:26px;letter-spacing:-.04em;line-height:1}
.stat .num small{font-weight:400;letter-spacing:-.01em}
.kpi-f{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:10px}
.kpi-d{font-size:12px;display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.kpi-note,.stat .note{font-size:11.5px;color:var(--ink-3);margin-top:4px;line-height:1.5}
.stat-hi .num{color:var(--accent)}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:0}
.mini > div{padding:0 0 0 22px;position:relative}
.mini > div:first-child{padding-left:0}
.mini > div + div::before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:1px;background:var(--line)}
.mini .v{font-size:23px;font-weight:600;line-height:1.05;margin-top:8px;font-variant-numeric:tabular-nums;letter-spacing:-.035em}

/* ── 状态：安静。颜色只在真正危急时抬高音量 ───────────────────── */
.pill{
  display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 7px;border-radius:5px;
  font-weight:500;white-space:nowrap;background:var(--surface-2);color:var(--ink-2);
  font-variant-numeric:tabular-nums;
}
.p-good{color:var(--good);background:var(--good-soft)}
.p-warn{color:var(--warn);background:var(--warn-soft)}
.p-crit{color:var(--crit);background:var(--crit-soft)}
.p-neut{color:var(--ink-2);background:var(--surface-2)}
.p-acc{color:var(--accent);background:var(--accent-soft)}
.dot{width:5px;height:5px;border-radius:99px;flex:none;display:inline-block}
.t-good{color:var(--good)} .t-warn{color:var(--warn)} .t-crit{color:var(--crit)} .t-mut{color:var(--ink-3)}
.stripe{position:absolute;left:0;top:10px;bottom:10px;width:2px;border-radius:2px}

/* ── 表格：无外框，发丝线分隔，数字列右对齐等宽 ───────────────── */
.tw{overflow-x:auto;margin:0 -2px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
th{
  text-align:left;font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);font-weight:400;padding:0 12px 9px;
  border-bottom:1px solid var(--line-2);white-space:nowrap;
  background:var(--surface);
}
th:first-child{padding-left:2px} th:last-child{padding-right:2px}
th.s{cursor:pointer;user-select:none;transition:color var(--t) var(--ease)}
th.s:hover{color:var(--ink)}
th .ar{opacity:.35;margin-left:3px}
th[aria-sort] .ar{opacity:1;color:var(--accent)}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;line-height:1.45}
td:first-child{padding-left:2px} td:last-child{padding-right:2px}
tbody tr:last-child td{border-bottom:0}
tfoot td{border-top:1px solid var(--line-2);border-bottom:0;padding-top:12px}
tr.clk{cursor:pointer}
tr.clk:hover td{background:var(--surface-2)}
tr.clk:first-child:hover td:first-child{border-radius:6px 0 0 6px}
tr.clk:hover td:last-child{border-radius:0 6px 6px 0}
.ta-r{text-align:right}
.tnum{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;letter-spacing:-.015em}
.t-main{font-weight:500}
.t-sub{font-size:11.5px;color:var(--ink-3);line-height:1.4}

/* ── 图表 ─────────────────────────────────────────────────────── */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.gridline{stroke:var(--line);stroke-width:1}
.axis-t{fill:var(--ink-3);font-size:10px;font-family:"DM Mono",monospace}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);align-items:center}
.legend i{width:14px;height:2px;border-radius:2px;display:inline-block;margin-right:7px;vertical-align:middle}
.tip{
  position:fixed;z-index:200;pointer-events:none;background:var(--ink);color:var(--surface);
  border-radius:8px;padding:9px 11px;font-size:12px;box-shadow:var(--pop);
  opacity:0;transition:opacity 90ms var(--ease);max-width:270px;
}
.tip.on{opacity:1}
.tip-t{
  font-family:"DM Mono",monospace;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  opacity:.55;margin-bottom:5px;
}
.tip-r{display:flex;align-items:center;gap:14px;justify-content:space-between;line-height:1.75}
.tip-r b{font-variant-numeric:tabular-nums;font-weight:600}
.tip-r span{opacity:.8}
.bartrack{background:var(--surface-2);border-radius:99px;overflow:hidden;position:relative}
.barfill{height:100%;border-radius:99px;transition:width 260ms var(--ease)}

/* ── 悬浮层：只有这里有卡片、圆角与投影 ───────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(12,12,14,.28);backdrop-filter:blur(2px);z-index:100;opacity:0;transition:opacity 180ms var(--ease)}
.scrim.on{opacity:1}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(600px,96vw);background:var(--surface);z-index:101;
  transform:translateX(100%);transition:transform 260ms var(--ease);
  display:flex;flex-direction:column;box-shadow:var(--pop);border-left:1px solid var(--line);
}
.drawer.on{transform:translateX(0)}
.drawer-h{padding:24px 28px 18px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:flex-start}
.drawer-b{padding:24px 28px 56px;overflow-y:auto;flex:1}
.modal{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-48%) scale(.985);z-index:101;
  width:min(500px,94vw);background:var(--surface);border-radius:12px;
  opacity:0;transition:opacity 160ms var(--ease),transform 160ms var(--ease);box-shadow:var(--pop);
  border:1px solid var(--line);
}
.modal.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.modal .drawer-h{padding:20px 22px 16px}
.x{
  border:0;background:none;cursor:pointer;color:var(--ink-3);font-size:15px;line-height:1;
  padding:5px 7px;border-radius:6px;transition:all var(--t) var(--ease);
}
.x:hover{background:var(--surface-2);color:var(--ink)}

/* ── 反馈 ─────────────────────────────────────────────────────── */
.toasts{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{
  background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:9px;font-size:13px;
  box-shadow:var(--pop);animation:tin 220ms var(--ease);display:flex;gap:9px;align-items:center;max-width:88vw;
}
.toast i{width:5px;height:5px;border-radius:99px;background:var(--good);flex:none}
.toast.warn i{background:var(--warn)} .toast.crit i{background:var(--crit)}
@keyframes tin{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}

/* ── 排版元件 ─────────────────────────────────────────────────── */
.section-t{
  font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 12px;
}
.hr{height:1px;background:var(--line);border:0;margin:22px 0}
.kv{display:grid;grid-template-columns:96px 1fr;gap:7px 16px;font-size:13px}
.kv dt{color:var(--ink-3);font-size:12px}
.kv dd{margin:0;font-variant-numeric:tabular-nums}
.empty{padding:36px 8px;text-align:center;color:var(--ink-3);font-size:12.5px}
.note{font-size:12px;color:var(--ink-3);line-height:1.65}
.formula{
  background:var(--surface-2);border-left:2px solid var(--accent);
  padding:14px 16px;font-family:"DM Mono",monospace;font-size:11.5px;color:var(--ink-2);
  line-height:1.85;overflow-x:auto;white-space:pre-wrap;border-radius:0 8px 8px 0;
}
.formula b{color:var(--ink);font-weight:500}
input[type=range]{width:100%;accent-color:var(--accent);height:20px;cursor:pointer}
.slider-h{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:3px;color:var(--ink-2)}
.slider-h b{font-variant-numeric:tabular-nums;font-size:13.5px;color:var(--ink);font-weight:600;letter-spacing:-.02em}
.field{margin-bottom:18px}
.cbx{display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer;font-size:13px;line-height:1.5}
.cbx input{margin:2px 0 0;accent-color:var(--accent);flex:none;width:15px;height:15px;cursor:pointer}
.cbx span{transition:color var(--t) var(--ease)}
.cbx.done span{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1px}

/* ── 角色与临床元件 ───────────────────────────────────────────── */
.who{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--ink-2)}
.avatar{

<script>
"use strict";
/* ════════ 工具 ════════ */
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const n1 = v=>v.toFixed(1), n0 = v=>Math.round(v).toLocaleString("zh-CN");
const pct = v=>(v*100).toFixed(1)+"%";
const wan = v=>v.toFixed(1);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sum = (a,f)=>a.reduce((t,x)=>t+f(x),0);
const days = (a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const site = id=>SITES.find(s=>s.id===id);
const staff = n=>STAFF.find(s=>s.n===n);
const label = ss=>`${ss.hosp}｜${S[ss.sid].short}`;

/* ════════ 派生指标（所有看板数字都由这里算出，口径唯一） ════════ */

/* 筛败费：合同里筛败例数单独计价，通常为入组单价的 30%–40%。
   漏掉这块，收入就是错的 —— 而以「算清单中心盈亏」为核心命题的系统，
   这个错误在源头上会让所有毛利结论失真。 */
const SF_FEE = 0.35;
function siteRev(ss){
  const f = (typeof FN==="function") ? FN(ss.id) : {sf:0};
  return (ss.startup||0) + ss.enrolled*ss.unit + (f.sf||0)*ss.unit*SF_FEE;
}
const revParts = ss=>{ const f=(typeof FN==="function")?FN(ss.id):{sf:0};
  return {startup:ss.startup||0, enr:ss.enrolled*ss.unit, sf:(f.sf||0)*ss.unit*SF_FEE}; };

function siteM(ss){
  const rev = siteRev(ss);
  const gp = rev - ss.cost;                              // 毛利（万元）
  const gm = rev > 0 ? gp/rev : null;                    // 毛利率
  const rate = ss.planToDate>0 ? ss.enrolled/ss.planToDate : null;  // 入组达成率
  const cpe = ss.enrolled>0 ? ss.cost/ss.enrolled : null;           // 每例入组成本
  const prog = ss.enrolled/ss.contracted;                // 合同完成度
  return {rev, gp, gm, rate, cpe, prog, mdPerPt: ss.enrolled>0 ? ss.md/ss.enrolled : null};
}
/* scope() / scopeIds() 定义在 04-nav：数据范围由登录身份决定 */

function rollup(list){
  const rev = sum(list,s=>siteRev(s)), cost = sum(list,s=>s.cost);
  const enr = sum(list,s=>s.enrolled), plan = sum(list,s=>s.planToDate);
  const ids = new Set(list.map(s=>s.id));
  const people = STAFF.filter(p=>p.role!=="PM"&&p.role!=="QA"&&p.sites.some(x=>ids.has(x)));
  const util = people.length? sum(people,p=>p.util)/people.length : 0;
  const open = ISSUES.filter(i=>i.st!=="已关闭" && ids.has(i.ss));
  const ar   = MILES.filter(m=>!m.paid && m.inv==="已开票" && ids.has(m.ss));
  const unbilled = MILES.filter(m=>m.inv==="待开票" && ids.has(m.ss));
  return {
    rev, cost, gp:rev-cost, gm: rev? (rev-cost)/rev : 0,
    enr, plan, rate: plan? enr/plan : 0,
    cpe: enr? cost/enr : 0, util, people:people.length,
    open, crit: open.filter(i=>i.sev!=="一般").length,
    arAmt: sum(ar,m=>m.amt), arOver: sum(ar.filter(m=>m.age>60),m=>m.amt),
    unbilledAmt: sum(unbilled,m=>m.amt), unbilled:unbilled.length,
    dso: ar.length? Math.round(sum(ar,m=>m.age)/ar.length)+62 : 0,
    active: list.filter(s=>s.st==="入组中").length, total:list.length
  };
}
/* 利用率 → 状态（这是 state，不是 magnitude：闲置与超载都不好） */
function utilState(u){
  if(u < 60) return {k:"warn", t:"产能闲置", c:"var(--warn)"};
  if(u > 88) return {k:"crit", t:"超载",     c:"var(--crit)"};
  return {k:"good", t:"健康",  c:"var(--good)"};
}
function rateState(r){
  if(r===null) return {k:"neut",t:"未启动",c:"var(--ink-3)"};
  if(r < 0.7)  return {k:"crit",t:"严重落后",c:"var(--crit)"};
  if(r < 0.9)  return {k:"warn",t:"落后",    c:"var(--warn)"};

let overlayEsc=null;
function openLayer(node, html){
  node.innerHTML=html; node.hidden=false; $("#scrim").hidden=false;

}
function closeLayer(){

    if(n.hidden) continue;

/* ════════════════════════════════════════════════════════════════════

/* 折线：计划 vs 实际，带十字准星 + 跟随提示 */
function lineChart(box,{x,series,yMax,yFmt=n0,h=200}){
  const W=box.clientWidth||640, P={t:12,r:14,b:26,l:44}, H=h;
  const iw=W-P.l-P.r, ih=H-P.t-P.b;
  const max = yMax || Math.max(...series.flatMap(s=>s.values))*1.12;
  const px=i=> P.l + (x.length>1 ? i*iw/(x.length-1) : iw/2);
  const py=v=> P.t + ih - (v/max)*ih;
  const ticks=4, gl=[], ax=[];
  for(let i=0;i<=ticks;i++){
    const v=max*i/ticks, y=py(v);
    gl.push(`<line class="gridline" x1="${P.l}" y1="${y.toFixed(1)}" x2="${W-P.r}" y2="${y.toFixed(1)}"/>`);
    ax.push(`<text class="axis-t" x="${P.l-7}" y="${(y+3.5).toFixed(1)}" text-anchor="end">${yFmt(v)}</text>`);
  }
  const step = x.length>8 ? 2 : 1;
  const xl = x.map((t,i)=> i%step===0||i===x.length-1
    ? `<text class="axis-t" x="${px(i).toFixed(1)}" y="${H-8}" text-anchor="middle">${esc(t)}</text>`:"").join("");
  const paths = series.map(s=>{
    const d = s.values.map((v,i)=>`${i?"L":"M"}${px(i).toFixed(1)},${py(v).toFixed(1)}`).join(" ");
    const area = s.fill ? `<path d="${d} L${px(x.length-1).toFixed(1)},${P.t+ih} L${px(0).toFixed(1)},${P.t+ih} Z" fill="${s.color}" opacity=".055"/>`:"";
    return area + `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"${s.dash?' stroke-dasharray="2 4" stroke-linecap="round"':""}/>`;
  }).join("");
  /* 选择性直标：只标终点 */
  const ends = series.map(s=>{
    const i=x.length-1, cx=px(i), cy=py(s.values[i]);
    return `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="3.5" fill="${s.color}" stroke="var(--surface)" stroke-width="2.5"/>`;
  }).join("");
  box.innerHTML =
   `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="计划与实际入组累计曲线">
      ${gl.join("")}${ax.join("")}${xl}
      <g id="cross" style="display:none"><line class="gridline" stroke="var(--ink-3)" stroke-dasharray="3 3" y1="${P.t}" y2="${P.t+ih}"/></g>
      ${paths}${ends}
      <rect x="${P.l}" y="${P.t}" width="${iw}" height="${ih}" fill="transparent" id="hit" style="cursor:crosshair"/>
    </svg>`;
  const svg=box.querySelector("svg"), cross=box.querySelector("#cross"), cl=cross.querySelector("line");
  const dots=[];
  series.forEach(s=>{ const c=document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("r","4"); c.setAttribute("fill",s.color);
    c.setAttribute("stroke","var(--surface)"); c.setAttribute("stroke-width","2.5");
    cross.appendChild(c); dots.push(c); });
  const hit=box.querySelector("#hit");
  hit.addEventListener("pointermove",e=>{
    const r=svg.getBoundingClientRect(), sx=(e.clientX-r.left)*W/r.width;
    let i=Math.round((sx-P.l)/(iw/(x.length-1||1))); i=clamp(i,0,x.length-1);
    cross.style.display=""; cl.setAttribute("x1",px(i)); cl.setAttribute("x2",px(i));
    dots.forEach((c,k)=>{c.setAttribute("cx",px(i));c.setAttribute("cy",py(series[k].values[i]));});
    const rows=series.map(s=>`<div class="tip-r"><span><i style="display:inline-block;width:12px;height:2px;border-radius:2px;background:${s.color};vertical-align:middle;margin-right:7px;opacity:.9"></i>${esc(s.name)}</span><b>${yFmt(s.values[i])}</b></div>`).join("");
    const diff = series.length===2 ? (()=>{const d=series[1].values[i]-series[0].values[i];
      return `<div class="tip-r" style="border-top:1px solid var(--line);margin-top:4px;padding-top:4px"><span>差额</span><b style="color:${d<0?"var(--crit)":"var(--ink)"}">${d>0?"+":""}${n0(d)}</b></div>`;})():"";
    showTip(`<div class="tip-t">${esc(x[i])}</div>${rows}${diff}`,e.clientX,e.clientY);
  });
  hit.addEventListener("pointerleave",()=>{cross.style.display="none";hideTip();});
}

/* 迷你走势线（KPI 磁贴内） */
function spark(vals,color,w=76,h=22){
  const mn=Math.min(...vals), mx=Math.max(...vals), r=(mx-mn)||1;
  const p=vals.map((v,i)=>`${i?"L":"M"}${(i*w/(vals.length-1)).toFixed(1)},${(h-2-((v-mn)/r)*(h-4)).toFixed(1)}`).join(" ");
  const lx=w, ly=(h-2-((vals.at(-1)-mn)/r)*(h-4)).toFixed(1);
  return `<svg width="${w}" height="${h}" aria-hidden="true" style="overflow:visible">
    <path d="${p}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity=".75"/>
    <circle cx="${lx}" cy="${ly}" r="2.6" fill="${color}"/></svg>`;
}

/* 横向条：基线锚定，只有数据端 4px 圆角 */
function hbars(box, rows, {max, fmt=n1, unit="", h=12, gap=11, band=null}={}){
  const M = max || Math.max(...rows.map(r=>Math.abs(r.v)))*1.05 || 1;
  box.innerHTML = rows.map(r=>{
    const w = clamp(Math.abs(r.v)/M*100, 2, 100);
    return `<div class="hb" data-tip="${esc(r.tip||"")}" style="display:grid;grid-template-columns:minmax(96px,158px) 1fr auto;gap:14px;align-items:center;margin-bottom:${gap}px;cursor:default">
      <div style="font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(r.label)}">${esc(r.label)}</div>
      <div class="bartrack" style="height:${h}px"><div class="barfill" style="width:${w}%;background:${r.color||"var(--accent)"};height:100%;position:relative"></div>${r.marker!=null?`<div style="position:absolute;left:${clamp(r.marker/M*100,0,100)}%;top:0;bottom:0;width:1.5px;background:var(--ink);opacity:.45"></div>`:""}${band?band.map(t=>`<div style="position:absolute;left:${clamp(t/M*100,0,100)}%;top:-3px;bottom:-3px;width:2px;background:var(--accent);border-radius:2px"></div>`).join(""):""}</div>
      <div class="tnum" style="font-size:12.5px;min-width:58px;font-weight:600;color:${r.vColor||"var(--ink)"}">${fmt(r.v)}${unit}</div>
    </div>`;
  }).join("");
  box.querySelectorAll(".hb").forEach(el=>{
    const t=el.dataset.tip; if(!t) return;
    el.addEventListener("pointermove",e=>showTip(t,e.clientX,e.clientY));
    el.addEventListener("pointerleave",hideTip);
  });
}

/* 堆叠条：段间留 2px 表面缝隙 */
function stacked(box, segs, {h=26, fmt=v=>wan(v)+" 万"}={}){
  if(!segs.length){ box.innerHTML=`<div class="empty" style="padding:16px">暂无数据</div>`; return; }
  const tot=sum(segs,s=>s.v)||1;
  /* 未指定颜色时按占比排名分配单色序列：深浅必须与量级一致 */
  const rank=[...segs].sort((a,b)=>b.v-a.v).map(x=>x.n);
  segs=segs.map(x=>({...x, c: x.c || `var(--s${Math.min(rank.indexOf(x.n)+1,5)})`}));
  box.innerHTML=`<div style="display:flex;height:${h}px;gap:2px;border-radius:6px;overflow:hidden">${
    segs.map(s=>`<div class="sg" data-n="${esc(s.n)}" data-v="${fmt(s.v)}" data-p="${pct(s.v/tot)}"
      style="width:${(s.v/tot*100).toFixed(2)}%;background:${s.c};min-width:2px"></div>`).join("")}</div>
    <div class="legend" style="margin-top:14px;gap:20px">${segs.map(s=>
      `<span><i style="background:${s.c};height:8px;width:8px;border-radius:2px"></i>${esc(s.n)} <b style="font-weight:600;font-variant-numeric:tabular-nums;margin-left:2px">${fmt(s.v)}</b> <span class="t-mut" style="font-variant-numeric:tabular-nums">${pct(s.v/tot)}</span></span>`).join("")}</div>`;
  box.querySelectorAll(".sg").forEach(el=>{
    el.addEventListener("pointermove",e=>showTip(
      `<div class="tip-t">${esc(el.dataset.n)}</div><div class="tip-r"><span>金额</span><b>${el.dataset.v}</b></div><div class="tip-r"><span>占比</span><b>${el.dataset.p}</b></div>`,e.clientX,e.clientY));
    el.addEventListener("pointerleave",hideTip);
  });
}

/* 双向条：零轴居中，正负两色 + 中性零点（极性编码） */
function diverging(box, rows, {fmt=v=>(v>0?"+":"")+n1(v), unit="万"}={}){
  const M=Math.max(...rows.map(r=>Math.abs(r.v)))*1.08||1;
  box.innerHTML = rows.map(r=>{
    const w=Math.abs(r.v)/M*50, pos=r.v>=0;
    return `<div class="dv" data-tip="${esc(r.tip||"")}" style="display:grid;grid-template-columns:minmax(102px,180px) 1fr 74px;gap:14px;align-items:center;margin-bottom:10px">
      <div style="font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(r.label)}">${esc(r.label)}</div>
      <div style="position:relative;height:11px;background:var(--surface-2);border-radius:99px">
        <div style="position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line-2)"></div>
        <div style="position:absolute;top:0;bottom:0;${pos?`left:50%;border-radius:0 99px 99px 0`:`right:50%;border-radius:99px 0 0 99px`};width:${w}%;background:${pos?"var(--ink-2)":"var(--crit)"}"></div>
      </div>
      <div class="tnum" style="font-size:12.5px;color:${pos?"var(--ink)":"var(--crit)"};font-weight:600">${fmt(r.v)}${unit}</div>
    </div>`;
  }).join("");
  box.querySelectorAll(".dv").forEach(el=>{
    const t=el.dataset.tip; if(!t) return;
    el.addEventListener("pointermove",e=>showTip(t,e.clientX,e.clientY));
    el.addEventListener("pointerleave",hideTip);
  });
}

  isf:["中心文件与物资","研究者文件夹、人员资质、药品效期与温控。核查现场翻的就是这几摞东西。"],
  approve:["待我审批","审批不是盖章。每条都附带风险提示 —— 批准之前先看它背后是不是一个该解决的管理问题。"],
  team:["我的团队","组员负载、派驻中心、本周排班与调配。看到超载与闲置同时存在，就该动手调人。"],
  intake:()=>PERSONA().k==="boss"
    ? ["立项审批","毛利率低于门槛的项目必须过这一关。在立项时就算账，而不是做完半年后财务才告诉你亏了。"]
    : ["立项与建档","系统的入口：项目怎么进来、中心怎么建档。测算口径与报价模型完全一致，不做两套账。"],
  capa:["我的整改","机构质控、内部监查、稽查发现最终都落到具体的人。整改回复要写清措施与证据，机构复核通过才算关闭。"],
  inst:["机构工作台","医院药物临床试验机构办公室视角。机构对本院承接的每一个项目负质量与合规的最终责任。"],
  instac:["立项受理","受托方递交 → 机构形式审查 → 受理并转伦理。材料不齐就受理，后面每个环节都带着这个缺口往下走。"],
  instqc:["机构质控","医院方对项目的质量反馈闭环：质控发现 → 出具意见 → 派发整改 → 受托方回复 → 机构复核关闭。"],
  instreg:["人员备案与准入","谁能进这家医院接触受试者源数据，是医院的责任，不是受托方能自行决定的事。"],
  screen:["筛选漏斗与筛败","入组数只是漏斗最后一格。「入组落后」没有行动价值，「为什么落后」才有 —— 而答案藏在前面三格。"],
  feas:["中心可行性调查","报价模型算「要花多少人天」，可行性库算「这家能不能出病人」。事后把亏损中心标红是最便宜也最没用的功能。"],
  material:["药品与样本","接收 − 发放 = 账面库存，实盘对不上就是严重发现；样本采集→离心→转运→回执，断一环即失效。"],
  pay:["受试者补偿","CRC 每周固定要花时间的事，也是稽查必查三件套：发放与访视是否对应、有无签收凭证、现金发放是否合规。"],
  pi:["研究者工作台","方案偏离要 PI 签字、SAE 由 PI 上报、授权分工表由 PI 签署 —— 研究者是法定责任人，不该只是系统里的一个字符串。"],
  audit:["内部稽查与 CAPA 有效性","机构质控是医院查我们，QA 是我们自己查自己。QA 真正的价值不是再发现一批问题，而是验证 CAPA 到底有没有防住复发。"]
};

const state = {view:"dash", persona:"boss", study:"all", enrStudy:"HJ-2024-017", dashRange:"12m",
  sortKey:"rate", sortDir:1, q:"", stFilter:new Set(), roleFilter:"all",
  sevFilter:new Set(), pnlSort:"gp", visitSel:0, tsWho:"吴桐", subjSel:null, qTab:"open"};

const PERSONA = ()=>P_OF[state.persona];

/* 数据范围由身份决定：看得到什么，取决于你是谁 */
function myScope(){
  const p = PERSONA();
  if(p.k==="boss") return SITES;
  if(p.k==="pm")   return SITES.filter(s=>TEAM.studies.includes(s.sid));
  if(p.k==="inst") return SITES.filter(s=>s.hosp===p.hosp);   // 机构只看本院
  if(p.k==="pi")   return SITES.filter(s=>s.pi===p.n);        // 研究者只看自己负责的中心
  if(p.k==="qa")   return SITES;                              // QA 覆盖全公司，但只有质量视图
  const me = staff(p.n);
  return SITES.filter(s=>me.sites.includes(s.id));
}
function scope(){
  const base = myScope();
  return state.study==="all" ? base : base.filter(s=>s.sid===state.study);
}
function scopeIds(){ return new Set(scope().map(s=>s.id)); }
function myTeam(){ return TEAM.members.map(staff); }

function renderNav(){
  const p = PERSONA();
  $("#nav").innerHTML = NAV_BY_ROLE[p.k].map(g=>
    `<div class="nav-group">${esc(g.g)}</div>` + g.items.map(it=>{
      const [k,badge] = Array.isArray(it)? it : [it,null];
      const b = badge? badge():0, d = N[k];
      return `<button class="nav-item" data-nav="${k}" aria-current="${state.view===k}">
        <svg class="nav-ic" viewBox="0 0 24 24">${d.ic}</svg><span>${esc(typeof d.t==="function"?d.t():d.t)}</span>
        ${b?`<span class="nav-badge">${b}</span>`:""}</button>`;
    }).join("")).join("");
  const per = $("#persona");
  if(per) per.innerHTML =
    `<div class="avatar">${esc(p.n.slice(0,1))}</div>
     <div><div class="n">${esc(p.n)}</div><div class="d">${esc(p.title)}</div></div>`;
}
const titleOf = v=>{ const t=TITLES[v]; return typeof t==="function"? t() : t; };
function renderTop(){
  const p = PERSONA(), [t] = titleOf(state.view);
  const studies = [...new Set(myScope().map(s=>s.sid))];
  $("#crumb").innerHTML = `恒济临床研究 / <b>${esc(t)}</b>`;
  $("#who").innerHTML =
    `<div class="avatar">${esc(p.n.slice(0,1))}</div>
     <div><b>${esc(p.n)}</b> <span class="r">${esc(p.role)}</span><br>
     <span class="r">${esc(p.scope)}</span></div>`;
  const rs = $("#grole");
  if(!rs.options.length) rs.innerHTML = PERSONAS.map(x=>
    `<option value="${x.k}">${esc(x.title)} · ${esc(x.n)}</option>`).join("");
  rs.value = state.persona;
  const sel = $("#gstudy");
  sel.innerHTML = `<option value="all">全部项目（${studies.length}）</option>` +
    studies.map(id=>`<option value="${id}">${esc(id)} · ${esc(S[id].short)}</option>`).join("");
  sel.value = studies.includes(state.study) ? state.study : "all";
  state.study = sel.value;
  sel.disabled = studies.length < 2;
}
const VIEWS = {};
function render(){
  if(!NAV_BY_ROLE[state.persona].some(g=>g.items.some(it=>(Array.isArray(it)?it[0]:it)===state.view)))
    state.view = HOME[state.persona];
  renderNav(); renderTop(); clearTimers();
  const [t,sub] = titleOf(state.view);
  $("#content").innerHTML = `<div class="view-head"><h1>${esc(t)}</h1><p>${esc(sub)}</p></div><div id="vbody"></div>`;
  VIEWS[state.view]($("#vbody"));
  scrollTo({top:0, behavior:"instant"});
}
function go(v,opts={}){ Object.assign(state,opts); state.view=v; render(); }

let timers=[];
const clearTimers=()=>{timers.forEach(clearInterval);timers=[];};

document.addEventListener("click",e=>{
  const nav=e.target.closest("[data-nav]");  if(nav){ go(nav.dataset.nav); return; }
  const gt =e.target.closest("[data-goto]"); if(gt){ const [v,k,val]=gt.dataset.goto.split(":");
    go(v, k?{[k]:val}:{}); return; }
  const cl =e.target.closest("[data-close]"); if(cl){ closeLayer(); return; }
});
$("#grole").addEventListener("change",e=>{
  state.persona = e.target.value; state.study="all"; state.view = HOME[state.persona];
  state.stFilter.clear(); state.sevFilter.clear(); state.q=""; state.subjSel=null;
  const p=PERSONA(); if(p.k==="cra"||p.k==="crc") state.tsWho=p.n;
  render(); toast(`已切换到 ${p.title} ${p.n} 的视角`);
});
$("#gstudy").addEventListener("change",e=>{ state.study=e.target.value;
  if(state.study!=="all") state.enrStudy=state.study; render(); });
addEventListener("resize",()=>{ clearTimeout(window.__rz);
  window.__rz=setTimeout(()=>{ if(["dash","enr","pm","cra"].includes(state.view)) render(); },250); });
</script>
<script>
"use strict";
/* ════════════════ 1 · 经营驾驶舱 ════════════════ */
const SPARK = {
  util:[71,74,72,77,79,76,80,78,81,79,80,78],
  gm:[24.1,25.6,24.9,26.8,27.4,26.2,28.1,27.3,26.5,25.9,26.8,27.6],
  rate:[102,99,97,95,94,92,90,89,88,87,86,87],
  cpe:[3.9,3.8,4.0,4.1,4.0,4.2,4.3,4.2,4.4,4.3,4.4,4.5],
  dso:[68,71,69,74,77,75,79,82,80,83,85,84]
};
VIEWS.dash = box=>{
  const list = scope(), R = rollup(list);
  const rng = {"6m":6,"12m":12,"all":99}[state.dashRange];
  const es = ENROLL[state.study==="all"?"HJ-2024-017":state.study];
  const cut = Math.max(0, es.x.length-rng);
  const ex = es.x.slice(cut), ep = es.plan.slice(cut), ea = es.act.slice(cut);

  /* 风险清单：由数据自动推导，不是手写 */
  const alerts = [];
  list.forEach(ss=>{
    const m=siteM(ss);
    if(m.rate!==null && m.rate<0.7) alerts.push({sev:"crit",t:`${ss.hosp} 入组仅达计划 ${pct(m.rate)}`,
      d:`已入组 ${ss.enrolled} / 应达 ${ss.planToDate} 例，缺口 ${ss.planToDate-ss.enrolled} 例`,go:"sites"});
    if(m.gm!==null && m.gm<0) alerts.push({sev:"crit",t:`${ss.hosp} 单中心亏损 ${n1(m.gp)} 万`,
      d:`收入 ${wan(m.rev)} 万 / 成本 ${wan(ss.cost)} 万，已消耗 ${n0(ss.md)} 人天`,go:"pnl"});
  });
  ISSUES.filter(i=>i.st!=="已关闭"&&i.sev!=="一般"&&(state.study==="all"||site(i.ss).sid===state.study))
    .forEach(i=>alerts.push({sev:"crit",t:`${i.sev}质量事件 ${i.id} · ${i.type}`,
      d:`${site(i.ss).hosp} · 责任人 ${i.own} · CAPA 到期 ${i.due}`,go:"qa"}));
  STAFF.filter(p=>p.util>88).forEach(p=>alerts.push({sev:"warn",t:`${p.n}（${p.role}）利用率 ${p.util}%`,
    d:`长期超过 88% 是质量事故与离职的先行指标，建议分流 1 个中心`,go:"staff"}));
  STAFF.filter(p=>days(TODAY,p.gcp)<70).forEach(p=>alerts.push({sev:"warn",t:`${p.n} GCP 证书 ${days(TODAY,p.gcp)} 天后到期`,
    d:`到期日 ${p.gcp} · 未及时换证将无法承担监查/协调工作`,go:"staff"}));
  const overdue = MILES.filter(m=>!m.paid&&m.inv==="已开票"&&m.age>60&&(state.study==="all"||site(m.ss).sid===state.study));
  if(overdue.length) alerts.push({sev:"warn",t:`${overdue.length} 笔应收账龄超 60 天，合计 ${wan(sum(overdue,m=>m.amt))} 万`,
    d:`最久一笔 ${Math.max(...overdue.map(m=>m.age))} 天 · ${site(overdue[0].ss).hosp}`,go:"bill"});

  const K = (l,v,u,note,sp,spc,delta,dc,to)=>`
    <button class="kpi" data-goto="${to}">
      <div class="kpi-l">${esc(l)}</div>
      <div class="kpi-v">${v}${u?`<small>${u}</small>`:""}</div>
      <div class="kpi-f"><div>
        <div class="kpi-d" style="color:${dc}">${delta}</div>
        <div class="kpi-note">${esc(note)}</div>
      </div>${sp?spark(sp,spc):""}</div>
    </button>`;
  const us = utilState(R.util);

  box.innerHTML = `
  <div class="grid g4" style="margin-bottom:12px">
    ${K("人员利用率", n1(R.util), "%", `健康区间 60–88%｜${R.people} 名一线`, SPARK.util, us.k==="good"?"var(--ink-3)":us.c,
        `<span class="dot" style="background:${us.c}"></span>${us.t}`, us.c, "staff")}
    ${K("综合毛利率", n1(R.gm*100), "%", `收入 ${wan(R.rev)} 万 · 成本 ${wan(R.cost)} 万`, SPARK.gm, "var(--ink-3)",
        "▲ 较上月 +0.8pt", "var(--good)", "pnl")}
    ${(()=>{ const g=R.enr-R.plan, c=g>=0?"var(--good)":R.rate<0.9?"var(--crit)":"var(--warn)";
      return K("入组达成率", n1(R.rate*100), "%", `实际 ${R.enr} 例 / 计划到今日 ${R.plan} 例`, SPARK.rate, c,
        `${g>=0?"▲ 领先":"▼ 落后"} ${Math.abs(g)} 例`, c, "enr"); })()}
    ${K("每例入组成本", n1(R.cpe), "万", `${R.active} 个中心在组｜共 ${R.total} 个中心`, SPARK.cpe, "var(--warn)",
        "▲ 较年初 +0.6 万", "var(--warn)", "pnl")}
  </div>
  <div class="grid g4" style="margin-bottom:12px">
    ${K("未关闭质量事件", R.open.length, "", `其中重大/严重 ${R.crit} 项`, null, null,
        `<span class="dot" style="background:${R.crit?"var(--crit)":"var(--ink)"}"></span>${R.crit?"需立即处理":"无高危"}`,
        R.crit?"var(--crit)":"var(--ink)", "qa")}
    ${K("应收未回款", wan(R.arAmt), "万", `账龄超 60 天 ${wan(R.arOver)} 万`, SPARK.dso, "var(--crit)",
        `DSO ${R.dso} 天`, R.dso>75?"var(--crit)":"var(--warn)", "bill")}
    ${K("待开票里程碑", wan(R.unbilledAmt), "万", `${R.unbilled} 笔已达成未开票`, null, null,
        "立即可开票", "var(--accent)", "bill")}
    ${K("在组中心", R.active, ` / ${R.total}`, `启动中 ${R.total-R.active} 个`, null, null,
        "点击查看台账", "var(--ink-3)", "sites")}
  </div>

  <div class="grid g21" style="margin-bottom:12px">
    <div class="card">
      <div class="card-h">
        <h3>入组累计：计划 vs 实际</h3>
        <span class="sub">${esc(state.study==="all"?"HJ-2024-017 艾瑞替尼 III（默认）":S[state.study].short)}</span>
        <span class="sp"></span>
        <div class="seg" id="rng">
          ${["6m","12m","all"].map(r=>`<button data-r="${r}" aria-pressed="${state.dashRange===r}">${r==="all"?"全周期":r.replace("m","个月")}</button>`).join("")}
        </div>
      </div>
      <div class="card-b">
        <div class="legend" style="margin-bottom:10px">
          <span><i style="background:var(--plan)"></i>计划累计</span>
          <span><i style="background:var(--s1)"></i>实际累计</span>
          <span class="t-mut" style="margin-left:auto">悬停查看逐月差额</span>
        </div>
        <div class="chart" id="c-enr"></div>
      </div>
    </div>
    <div class="card">
      <div class="card-h"><h3>风险预警</h3><span class="sp"></span>
        <span class="pill ${alerts.some(a=>a.sev==="crit")?"p-crit":"p-warn"}">${alerts.length} 项待处理</span></div>
      <div class="card-b" style="padding:0;max-height:330px;overflow-y:auto">
        ${alerts.length? alerts.map(a=>`
          <button data-goto="${a.go}" style="display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 14px 10px 16px;cursor:pointer;position:relative">
            <span class="stripe" style="background:var(--${a.sev==="crit"?"crit":"warn"})"></span>
            <div style="font-size:12.5px;font-weight:500;line-height:1.45">${esc(a.t)}</div>
            <div class="note" style="margin-top:2px">${esc(a.d)}</div>
          </button>`).join("") : `<div class="empty">当前范围内无预警</div>`}
      </div>
    </div>
  </div>

  <div class="grid g2">
    <div class="card">
      <div class="card-h"><h3>一线人员饱和度</h3><span class="sub">闲置与超载都是问题</span></div>
      <div class="card-b">
        <div style="position:relative;margin-bottom:10px">
          <div style="position:absolute;left:calc(90px + 10px + 60%*.6);right:0;top:0;bottom:0;pointer-events:none"></div>
        </div>
        <div id="c-util"></div>
        <div class="legend" style="margin-top:16px;border-top:1px solid var(--line);padding-top:12px">
          <span><i style="background:var(--accent);height:10px;width:2px;border-radius:2px;margin-right:4px"></i><i style="background:var(--accent);height:10px;width:2px;border-radius:2px"></i>健康区间刻度 60 / 88%</span>
          <span class="t-mut">数值着色：<b style="color:var(--warn);font-weight:600">闲置</b> · <b style="color:var(--crit);font-weight:600">超载</b>，健康即常态、不着色</span>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-h"><h3>单中心毛利</h3><span class="sub">正负极性，按毛利额排序</span>
        <span class="sp"></span><button class="btn" data-goto="pnl">查看 P&amp;L 明细 →</button></div>
      <div class="card-b"><div id="c-gp"></div></div>
    </div>
  </div>`;

  lineChart($("#c-enr"),{x:ex,series:[
    {name:"计划累计",color:"var(--plan)",values:ep,dash:true},
    {name:"实际累计",color:"var(--accent)",values:ea,fill:true}],h:230});

  const people = STAFF.filter(p=>p.role==="CRA"||p.role==="CRC").sort((a,b)=>b.util-a.util);
  hbars($("#c-util"), people.map(p=>{ const s=utilState(p.util);
    return {label:`${p.n} · ${p.role}`, v:p.util, color:"var(--ink-2)", vColor:s.k==="good"?"var(--ink)":s.c,
      tip:`<div class="tip-t">${esc(p.n)} · ${p.role}${p.lvl}</div>
        <div class="tip-r"><span>利用率</span><b>${p.util}%</b></div>
        <div class="tip-r"><span>状态</span><b style="color:${s.c}">${s.t}</b></div>
        <div class="tip-r"><span>带中心</span><b>${p.sites.length} 个</b></div>
        <div class="tip-r"><span>常驻</span><b>${p.city}</b></div>`};
  }), {max:100, fmt:v=>v, unit:"%", h:12, gap:10});

  const gp = list.filter(s=>siteRev(s)>0).map(s=>{const m=siteM(s);
    return {label:s.hosp.replace(/(大学|医学院|附属)/g,""), v:m.gp, tip:
      `<div class="tip-t">${esc(s.hosp)}</div>
       <div class="tip-r"><span>已确认收入</span><b>${wan(m.rev)} 万</b></div>
       <div class="tip-r"><span>已发生成本</span><b>${wan(s.cost)} 万</b></div>
       <div class="tip-r"><span>毛利率</span><b style="color:${m.gm<0?"var(--crit)":"var(--ink)"}">${pct(m.gm)}</b></div>
       <div class="tip-r"><span>已入组</span><b>${s.enrolled} / ${s.contracted} 例</b></div>`};
  }).sort((a,b)=>b.v-a.v);
  diverging($("#c-gp"), gp);

  $("#rng")?.addEventListener("click",e=>{const b=e.target.closest("[data-r]");
    if(b){state.dashRange=b.dataset.r;render();}});
};
</script>
<script>
"use strict";
/* ════════════════ 2 · 项目 · 中心台账 ════════════════ */
const COLS = [
  {k:"hosp", t:"中心 / 科室", s:false},
  {k:"sid",  t:"项目", s:true},
  {k:"st",   t:"状态", s:true},
  {k:"enrolled", t:"已入组", s:true, num:true},
  {k:"rate", t:"入组达成", s:true, num:true},
  {k:"gm",   t:"毛利率", s:true, num:true},
  {k:"md",   t:"已耗人天", s:true, num:true},
  {k:"team", t:"派驻", s:false}
];
VIEWS.sites = box=>{
  const all = scope();
  const sts = [...new Set(SITES.map(s=>s.st))].sort((a,b)=>FLOW.indexOf(a)-FLOW.indexOf(b));
  box.innerHTML = `
  <div class="card">
    <div class="card-h" style="flex-wrap:wrap;gap:8px">
      <input class="inp" id="q" placeholder="搜索医院 / PI / 城市 / 中心编号…" value="${esc(state.q)}" style="width:250px">
      <div class="row" style="gap:5px">
        ${sts.map(s=>`<button class="chip" data-st="${esc(s)}" aria-pressed="${state.stFilter.has(s)}">${esc(s)}</button>`).join("")}
      </div>
      <span class="sp"></span>
      <span class="sub" id="cnt"></span>
      <button class="btn" id="clr">重置</button>
    </div>
    <div class="tw"><table id="tbl">
      <thead><tr>${COLS.map(c=>`<th class="${c.s?"s":""} ${c.num?"ta-r":""}" data-k="${c.k}"
        ${state.sortKey===c.k?`aria-sort="${state.sortDir>0?"descending":"ascending"}"`:""}>${esc(c.t)}${c.s?`<span class="ar">${state.sortKey===c.k?(state.sortDir>0?"↓":"↑"):"↕"}</span>`:""}</th>`).join("")}</tr></thead>
      <tbody></tbody>
    </table></div>
  </div>
  <p class="note" style="margin-top:10px">点击任意一行打开中心详情 —— 状态机推进、入组曲线、派驻人员、未关闭质量事件与财务快照都在一处。</p>`;

  function draw(){
    const q = state.q.trim().toLowerCase();
    let rows = all.filter(s=>{
      if(state.stFilter.size && !state.stFilter.has(s.st)) return false;
      if(!q) return true;
      return [s.hosp,s.pi,s.city,s.id,s.dept,S[s.sid].short].some(v=>v.toLowerCase().includes(q));
    });
    const val = (s,k)=>{ const m=siteM(s);
      return k==="rate"? (m.rate??-1) : k==="gm"? (m.gm??-99) : k==="sid"? S[s.sid].short : s[k]; };
    rows.sort((a,b)=>{ const x=val(a,state.sortKey), y=val(b,state.sortKey);
      return (typeof x==="string"? x.localeCompare(y,"zh") : x-y) * -state.sortDir; });
    $("#cnt").textContent = `${rows.length} / ${all.length} 个中心`;
    $("#tbl tbody").innerHTML = rows.length? rows.map(s=>{
      const m=siteM(s), rs=rateState(m.rate);
      const iss = ISSUES.filter(i=>i.ss===s.id&&i.st!=="已关闭").length;
      return `<tr class="clk" data-ss="${s.id}">
        <td><div class="t-main">${esc(s.hosp)}${iss?` <span class="pill p-crit" title="未关闭质量事件">${iss}</span>`:""}</div>
            <div class="t-sub">${esc(s.dept)} · PI ${esc(s.pi)} · ${esc(s.city)} · ${s.id}</div></td>
        <td><div style="font-size:12px">${esc(S[s.sid].short)}</div><div class="t-sub">${esc(S[s.sid].phase)}</div></td>
        <td><span class="pill ${s.st==="入组中"?"p-acc":"p-neut"}">${esc(s.st)}</span></td>
        <td class="tnum">${s.enrolled}<span class="t-mut"> / ${s.contracted}</span></td>
        <td class="ta-r"><span class="pill p-${rs.k}">${m.rate===null?"—":pct(m.rate)}</span></td>
        <td class="tnum" style="color:${m.gm===null?"var(--ink-3)":m.gm<0?"var(--crit)":m.gm<0.2?"var(--warn)":"var(--ink)"};font-weight:500">${m.gm===null?"—":pct(m.gm)}</td>
        <td class="tnum">${n0(s.md)}</td>
        <td><div class="t-sub">CRA ${esc(s.cra)}</div><div class="t-sub">CRC ${esc(s.crc.join("、"))}</div></td>
      </tr>`;}).join("") : `<tr><td colspan="8"><div class="empty">没有匹配的中心，试试放宽筛选条件</div></td></tr>`;
  }
  draw();
  $("#q").addEventListener("input",e=>{state.q=e.target.value;draw();});
  box.addEventListener("click",e=>{
    const c=e.target.closest("[data-st]");
    if(c){ const v=c.dataset.st; state.stFilter.has(v)?state.stFilter.delete(v):state.stFilter.add(v);
      c.setAttribute("aria-pressed",state.stFilter.has(v)); draw(); return; }
    const th=e.target.closest("th.s");
    if(th){ const k=th.dataset.k;
      if(state.sortKey===k) state.sortDir*=-1; else {state.sortKey=k;state.sortDir=1;}
      render(); return; }
    if(e.target.closest("#clr")){ state.q="";state.stFilter.clear();render(); return; }
    const tr=e.target.closest("[data-ss]"); if(tr) openSite(tr.dataset.ss);
  });
};

/* ── 中心详情抽屉：含状态机推进 ── */
function openSite(id){
  const ss=site(id), st=S[ss.sid], m=siteM(ss);
  const i=FLOW.indexOf(ss.st), next=FLOW[i+1];
  const iss=ISSUES.filter(x=>x.ss===id&&x.st!=="已关闭");
  const ms =MILES.filter(x=>x.ss===id);
  const vs =VISITS.filter(x=>x.ss===id);
  const rs = rateState(m.rate);
  openLayer($("#drawer"),`
    <div class="drawer-h">
      <div style="flex:1">
        <div class="section-t" style="margin:0 0 3px">${esc(ss.id)} · ${esc(st.id)}</div>
        <h2 style="font-size:17px">${esc(ss.hosp)}</h2>
        <div class="note" style="margin-top:3px">${esc(ss.dept)} · PI ${esc(ss.pi)} · ${esc(ss.city)}｜${esc(st.short)} ${esc(st.phase)} · ${esc(st.indication)}</div>
      </div>
      <button class="x" data-close aria-label="关闭">✕</button>
    </div>
    <div class="drawer-b">

        <div title="${esc(f)}" style="flex:1;height:5px;border-radius:1px;background:${k<=i?"var(--accent)":"var(--surface-3)"}"></div>`).join("")}</div>
      <div class="row" style="justify-content:space-between;margin-bottom:12px">
        <div><span class="pill p-acc">${esc(ss.st)}</span>
          <span class="note" style="margin-left:6px">第 ${i+1} / ${FLOW.length} 节点</span></div>
        ${next?`<button class="btn btn-p" id="adv">推进到「${esc(next)}」</button>`
              :`<span class="pill p-good">流程已完成</span>`}
      </div>
      <div class="grid g2" style="gap:0;margin-bottom:26px">
        <div class="stat">
          <div class="kpi-l">入组达成</div>
          <div class="num" style="font-size:26px;margin-top:8px;color:${rsC}">${m.rate===null?"—":pct(m.rate)}</div>
          <div class="note">实际 ${ss.enrolled} / 计划到今日 ${ss.planToDate}｜合同 ${ss.contracted} 例</div>
        </div>
        <div class="stat">
          <div class="kpi-l">单中心毛利</div>
          <div class="num" style="font-size:20px;margin-top:3px;color:${m.gp<0?"var(--crit)":"var(--ink)"}">${m.gp>0?"+":""}${n1(m.gp)} 万</div>
          <div class="note">毛利率 ${m.gm===null?"—":pct(m.gm)}｜每例成本 ${m.cpe?n1(m.cpe)+" 万":"—"}</div>

      </div>
      <div class="section-t">关键日期</div>
      <dl class="kv" style="margin-bottom:14px">
        <dt>伦理批件</dt><dd>${esc(ss.ethics)}</dd>
        <dt>SIV 启动</dt><dd>${esc(ss.siv)}</dd>
        <dt>首例入组</dt><dd>${esc(ss.fpi)}${ss.siv!=="—"&&ss.fpi!=="—"?` <span class="t-mut">（启动→FPI ${days(ss.siv,ss.fpi)} 天）</span>`:""}</dd>
        <dt>单例单价</dt><dd>${n1(ss.unit)} 万 / 例</dd>
        <dt>已耗人天</dt><dd>${n0(ss.md)} 人天${m.mdPerPt?` <span class="t-mut">（${n1(m.mdPerPt)} 人天/例）</span>`:""}</dd>
      </dl>
      <div class="section-t">派驻人员</div>
      <div class="stack" style="gap:6px;margin-bottom:14px">
        ${[[ss.cra,"CRA"],...ss.crc.map(c=>[c,"CRC"])].map(([n,r])=>{
          const p=staff(n), s=utilState(p.util);
          return `<div class="row" style="justify-content:space-between;border:1px solid var(--line);border-radius:8px;padding:7px 10px">
            <div><b style="font-weight:500">${esc(n)}</b> <span class="t-sub">${r} · ${esc(p.lvl)} · ${esc(p.city)}</span></div>
            <span class="pill p-${s.k}">利用率 ${p.util}% · ${s.t}</span></div>`;}).join("")}
      </div>
      ${iss.length?`<div class="section-t">未关闭质量事件（${iss.length}）</div>
      <div class="stack" style="gap:6px;margin-bottom:14px">${iss.map(x=>`
        <button data-goto="qa" style="text-align:left;border:1px solid var(--line);border-left:2px solid ${SEV[x.sev].c};background:none;border-radius:0 8px 8px 0;padding:8px 10px;cursor:pointer;width:100%">
          <div class="row" style="gap:6px"><span class="pill p-${SEV[x.sev].k}">${esc(x.sev)}</span>
            <b style="font-size:12.5px;font-weight:500">${esc(x.type)}</b><span class="t-sub">${esc(x.id)}</span></div>
          <div class="note" style="margin-top:3px">责任人 ${esc(x.own)} · CAPA 到期 ${esc(x.due)} · ${esc(x.st)}</div>
        </button>`).join("")}</div>`:""}
      ${ms.length?`<div class="section-t">里程碑与结算</div>
      <div class="tw" style="margin-bottom:14px"><table style="min-width:0">
        <tbody>${ms.map(x=>`<tr><td style="padding-left:0">${esc(x.name)}<div class="t-sub">达成 ${esc(x.hit)}</div></td>
          <td class="tnum">${n1(x.amt)} 万</td>
          <td class="ta-r" style="padding-right:0"><span class="pill ${x.paid?"p-good":x.inv==="待开票"?"p-warn":"p-neut"}">${esc(x.paid?"已回款":x.inv)}</span></td></tr>`).join("")}</tbody>
      </table></div>`:""}
      ${vs.length?`<div class="section-t">监查排期</div>
      <div class="stack" style="gap:5px">${vs.map(v=>`<div class="row" style="justify-content:space-between;font-size:12.5px">
        <span><span class="mono">${esc(v.d)}</span> · ${esc(v.kind)} · ${esc(v.who)}</span>

    </div>`);
  $("#adv")?.addEventListener("click",()=>{
    ss.st=next;
    if(next==="入组中"&&ss.fpi==="—"){ ss.fpi=TODAY; toast(`${ss.hosp} 首例入组（FPI）日期已记录：${TODAY}`); }
    if(next==="SIV启动"&&ss.siv==="—"){ ss.siv=TODAY;
      MILES.unshift({id:"M-0"+(50+MILES.length),ss:ss.id,name:"中心启动 SIV",amt:14.0,hit:TODAY,inv:"待开票",due:"—",paid:false,age:0});
      toast(`SIV 里程碑已达成，14.0 万自动进入待开票队列`); }

/* ════════════════ 3 · 入组进度 ════════════════ */
VIEWS.enr = box=>{
  const sid = state.study==="all" ? state.enrStudy : state.study;
  const st = S[sid], e = ENROLL[sid];
  const sites = SITES.filter(s=>s.sid===sid);
  const gap = e.act.at(-1) - e.plan.at(-1);
  const mp = e.plan.map((v,i)=>i?v-e.plan[i-1]:v), ma = e.act.map((v,i)=>i?v-e.act[i-1]:v);
  const monthly = state.enrMode==="m";

  box.innerHTML = `
  <div class="card" style="margin-bottom:12px">
    <div class="card-h" style="flex-wrap:wrap">
      <div class="seg" id="stab">${STUDIES.map(s=>
        `<button data-s="${s.id}" aria-pressed="${sid===s.id}">${esc(s.short)}</button>`).join("")}</div>
      <span class="sp"></span>
      <div class="seg" id="emode">
        <button data-m="c" aria-pressed="${!monthly}">累计</button>
        <button data-m="m" aria-pressed="${monthly}">月度新增</button>
      </div>
    </div>
    <div class="card-b">
      <div class="grid g4" style="gap:10px;margin-bottom:16px">
        ${[["合同计划例数",st.planned,"例",""],
           ["累计实际入组",e.act.at(-1),"例",`占计划 ${pct(e.act.at(-1)/st.planned)}`],
           ["较计划曲线",(gap>0?"+":"")+gap,"例",gap<0?"落后":"领先"],
           ["参研中心",st.sites,"个",`本系统在管 ${sites.length} 个`]].map(([l,v,u,n],i)=>`
          <div>
            <div class="kpi-l">${esc(l)}</div>
            <div class="num" style="font-size:23px;margin-top:3px;${i===2?`color:${gap<0?"var(--crit)":"var(--ink)"}`:""}">${v}<small style="font-size:12px;color:var(--ink-3);margin-left:2px">${u}</small></div>
            <div class="note">${esc(n)}</div>
          </div>`).join("")}
      </div>
      <div class="legend" style="margin-bottom:10px">
        <span><i style="background:var(--plan)"></i>计划${monthly?"月增":"累计"}</span>
        <span><i style="background:var(--s1)"></i>实际${monthly?"月增":"累计"}</span>
        <span class="t-mut" style="margin-left:auto">${esc(st.id)} · ${esc(st.sponsor)} · ${esc(st.indication)}</span>
      </div>
      <div class="chart" id="c-main"></div>
    </div>
  </div>
  <div class="section-t">逐中心入组（小倍数）—— 同一项目内，中心之间差异往往是数倍</div>
  <div class="grid g4">
    ${sites.map(s=>{ const m=siteM(s), rs=rateState(m.rate);
      return `<button class="card" data-ss2="${s.id}" style="text-align:left;cursor:pointer;padding:0;border-color:${m.rate!==null&&m.rate<0.7?"color-mix(in srgb,var(--crit) 40%,var(--line))":"var(--line)"}">
        <div style="padding:11px 13px 9px">
          <div class="row" style="justify-content:space-between;align-items:flex-start">
            <div><div style="font-size:12.5px;font-weight:500;line-height:1.35">${esc(s.hosp)}</div>
              <div class="t-sub">${esc(s.city)} · PI ${esc(s.pi)}</div></div>
            <span class="pill p-${rs.k}">${rs.t}</span>
          </div>
          <div class="num" style="font-size:21px;margin-top:8px">${s.enrolled}<span style="font-size:12px;color:var(--ink-3)"> / ${s.contracted} 例</span></div>
          <div class="bartrack" style="height:6px;margin-top:6px;position:relative">
            <div class="barfill" style="width:${clamp(m.prog*100,0,100)}%;background:${rs.c};height:100%"></div>
            ${s.planToDate?`<div style="position:absolute;left:${clamp(s.planToDate/s.contracted*100,0,100)}%;top:-2px;bottom:-2px;width:2px;background:var(--ink-3);opacity:.7"></div>`:""}
          </div>
          <div class="note" style="margin-top:5px">计划到今日 ${s.planToDate} 例（灰线）· 达成 ${m.rate===null?"—":pct(m.rate)}</div>
        </div>
      </button>`;}).join("")}
  </div>`;

  lineChart($("#c-main"),{x:e.x,series:[
    {name:monthly?"计划月增":"计划累计",color:"var(--plan)",values:monthly?mp:e.plan,dash:true},
    {name:monthly?"实际月增":"实际累计",color:"var(--accent)",values:monthly?ma:e.act,fill:!monthly}],h:250});

  box.addEventListener("click",e2=>{
    const t=e2.target.closest("[data-s]"); if(t){ state.enrStudy=t.dataset.s;
      if(state.study!=="all"){state.study="all";} render(); return; }
    const m2=e2.target.closest("[data-m]"); if(m2){ state.enrMode=m2.dataset.m; render(); return; }
    const c=e2.target.closest("[data-ss2]"); if(c) openSite(c.dataset.ss2);
  });
};
</script>
<script>
"use strict";
/* ════════════════ 4 · 派工与产能 ════════════════ */
VIEWS.staff = box=>{
  const roles=["all","CRA","CRC","PM","QA"];
  const list = STAFF.filter(p=>state.roleFilter==="all"||p.role===state.roleFilter);
  const line = STAFF.filter(p=>p.role==="CRA"||p.role==="CRC");

  const craSites = sum(STAFF.filter(p=>p.role==="CRA"),p=>p.sites.length)/5;

  box.innerHTML=`
  <div class="grid g4" style="margin-bottom:12px">
    ${[["平均利用率",n1(avg)+"%",`健康区间 60–88%`,utilState(avg).k==="good"?"var(--ink)":utilState(avg).c],

       ["CRA / CRC 人均带中心",n1(craSites)+" / "+n1(crcSites),"CRA 行业经验值 8–12 个","var(--ink-3)"]
     ].map(([l,v,n,c])=>`<div class="stat">
        <div class="kpi-l">${esc(l)}</div>
        <div class="num" style="font-size:24px;margin-top:4px;color:${c}">${esc(v)}</div>
        <div class="note" style="margin-top:2px">${esc(n)}</div></div>`).join("")}
  </div>
  <div class="card">
    <div class="card-h" style="flex-wrap:wrap">
      <h3>人员派工矩阵</h3>
      <div class="seg" id="rf">${roles.map(r=>`<button data-r="${r}" aria-pressed="${state.roleFilter===r}">${r==="all"?"全部":r}</button>`).join("")}</div>
      <span class="sp"></span>
      <button class="btn btn-p" id="newas">+ 新增派工</button>
    </div>
    <div class="tw"><table style="min-width:820px">
      <thead><tr><th>人员</th><th>常驻</th><th>GCP 证书</th><th class="ta-r">带中心</th><th style="width:36%">利用率 · 状态</th><th>当前派驻中心</th></tr></thead>
      <tbody>${list.map(p=>{

        const gcpCls = left<70?"p-crit":left<180?"p-warn":"p-neut";
        return `<tr class="clk" data-p="${esc(p.n)}">
          <td><div class="t-main">${esc(p.n)}</div><div class="t-sub">${esc(p.role)} · ${esc(p.lvl)}</div></td>
          <td class="t-sub">${esc(p.city)}</td>

          <td>
            <div style="display:flex;align-items:center;gap:9px">
              <div class="bartrack" style="height:8px;flex:1;position:relative">
                <div class="barfill" style="width:${clamp(p.util,0,100)}%;background:var(--ink-2);height:100%"></div>
                <div style="position:absolute;left:60%;top:-3px;bottom:-3px;width:2px;background:var(--accent);border-radius:2px"></div>
                <div style="position:absolute;left:88%;top:-3px;bottom:-3px;width:2px;background:var(--accent);border-radius:2px"></div>
              </div>
              <span class="tnum" style="width:38px;font-size:12.5px;font-weight:600;color:${s.k==="good"?"var(--ink)":s.c}">${p.util}%</span>
              <span class="pill p-${s.k==="good"?"neut":s.k}" style="width:64px;justify-content:center">${s.t}</span>
            </div>
          </td>
          <td class="t-sub">${p.sites.length
            ? p.sites.slice(0,2).map(id=>site(id).hosp).join("、") + (p.sites.length>2?` 等 ${p.sites.length} 个`:"")

        </tr>`;}).join("")}</tbody>
    </table></div>
  </div>
  <p class="note" style="margin-top:10px">蓝色刻度 = 健康区间边界 60% 与 88%。点击人员查看派工明细与冲突检测。派工变更会即时重算利用率，并回写到驾驶舱与工时模块。</p>`;

  box.addEventListener("click",e=>{
    const r=e.target.closest("[data-r]"); if(r){state.roleFilter=r.dataset.r;render();return;}
    if(e.target.closest("#newas")){ assignModal(); return; }
    const p=e.target.closest("[data-p]"); if(p) openStaff(p.dataset.p);

function openStaff(name){
  const p=staff(name), s=utilState(p.util);
  const rows=p.sites.map(id=>{const ss=site(id);return {ss,m:siteM(ss)};});
  const cities=[...new Set(rows.map(r=>r.ss.city))];
  const conflict = cities.length>1 && p.role==="CRC";
  openLayer($("#drawer"),`
    <div class="drawer-h">
      <div style="flex:1"><div class="section-t" style="margin:0 0 3px">${esc(p.role)} · ${esc(p.lvl)}</div>
        <h2 style="font-size:17px">${esc(p.n)}</h2>
        <div class="note" style="margin-top:3px">常驻 ${esc(p.city)}｜GCP 证书有效期至 ${esc(p.gcp)}（剩余 ${days(TODAY,p.gcp)} 天）</div></div>
      <button class="x" data-close aria-label="关闭">✕</button>
    </div>
    <div class="drawer-b">
      <div class="card" style="padding:12px;margin-bottom:14px">
        <div class="row" style="justify-content:space-between;margin-bottom:8px">
          <span class="kpi-l">当前利用率</span><span class="pill p-${s.k==="good"?"neut":s.k}">${s.t}</span></div>
        <div class="num" style="font-size:30px;line-height:1;color:${s.c}">${p.util}<small style="font-size:14px">%</small></div>
        <div class="bartrack" style="height:8px;margin-top:14px;position:relative">
          <div class="barfill" style="width:${clamp(p.util,0,100)}%;background:var(--ink-2);height:100%"></div>
          <div style="position:absolute;left:60%;top:-3px;bottom:-3px;width:2px;background:var(--accent);border-radius:2px"></div>

      <hr class="hr">

function assignModal(){
  openLayer($("#modal"),`
    <div class="drawer-h"><h3 style="flex:1;font-size:15px">新增派工</h3><button class="x" data-close aria-label="关闭">✕</button></div>
    <div style="padding:16px 18px 18px">
      <div class="field"><div class="slider-h"><label for="as-p">人员</label></div>
        <select class="sel" id="as-p" style="width:100%">${STAFF.filter(p=>p.role==="CRA"||p.role==="CRC")
          .map(p=>`<option value="${esc(p.n)}">${esc(p.n)} · ${p.role} · ${p.city} · 当前 ${p.util}%</option>`).join("")}</select></div>
      <div class="field"><div class="slider-h"><label for="as-s">项目中心</label></div>
        <select class="sel" id="as-s" style="width:100%">${SITES.map(s=>
          `<option value="${s.id}">${esc(s.hosp)}（${esc(S[s.sid].short)}）· ${esc(s.city)}</option>`).join("")}</select></div>
      <div class="field"><div class="slider-h"><label for="as-f">投入 FTE</label><b id="as-fv">30%</b></div>
        <input type="range" id="as-f" min="5" max="60" step="5" value="30"></div>
      <div id="as-warn" style="margin-bottom:12px"></div>
      <div class="row" style="justify-content:flex-end"><button class="btn" data-close>取消</button>
        <button class="btn btn-p" id="as-ok">确认派工</button></div>
    </div>`);
  const check=()=>{
    const p=staff($("#as-p").value), ss=site($("#as-s").value), f=+$("#as-f").value;
    $("#as-fv").textContent=f+"%";
    const nu=clamp(p.util+f*0.8,0,140), s=utilState(nu);
    const msgs=[];
    if(nu>88) msgs.push(["crit",`派工后利用率将达 ${n1(nu)}%，进入超载区间（>88%）`]);
    if(p.city!==ss.city&&p.role==="CRC") msgs.push(["warn",`${p.n} 常驻 ${p.city}，该中心在 ${ss.city} —— CRC 跨城驻场会产生大量不可计费通勤工时`]);
    if(days(TODAY,p.gcp)<70) msgs.push(["crit",`${p.n} 的 GCP 证书 ${days(TODAY,p.gcp)} 天后到期，需先安排换证`]);
    if(p.sites.includes(ss.id)) msgs.push(["warn",`${p.n} 已派驻该中心，本次将叠加投入`]);
    $("#as-warn").innerHTML = msgs.length? msgs.map(([k,t])=>
      `<div style="border-left:2px solid var(--${k});background:var(--${k}-soft);padding:7px 10px;margin-bottom:6px;font-size:12px;color:var(--ink-2)">${esc(t)}</div>`).join("")
      : `<div style="border-left:2px solid var(--good);background:var(--good-soft);padding:7px 10px;font-size:12px;color:var(--ink-2)">派工后利用率 ${n1(nu)}%（${s.t}），无冲突</div>`;
  };
  ["#as-p","#as-s","#as-f"].forEach(s=>$(s).addEventListener("input",check));
  check();
  $("#as-ok").addEventListener("click",()=>{
    const p=staff($("#as-p").value), ss=site($("#as-s").value), f=+$("#as-f").value;
    p.util=Math.round(clamp(p.util+f*0.8,0,140));
    if(!p.sites.includes(ss.id)) p.sites.push(ss.id);
    if(p.role==="CRC"&&!ss.crc.includes(p.n)) ss.crc.push(p.n);
    closeLayer(); toast(`已派工：${p.n} → ${ss.hosp}（${f}% FTE），利用率更新为 ${p.util}%`,
      p.util>88?"warn":""); setTimeout(render,220);
  });
}

/* ════════════════ 5 · 工时与差旅 ════════════════ */
VIEWS.time = box=>{
  const ids = scopeIds(), me = PERSONA();
  /* 员工只看得到自己的填报；PM 与经营层看范围内全部 */
  const mineOnly = me.k==="cra" || me.k==="crc";
  const inScope = t=>ids.has(t.ss) && (!mineOnly || t.who===me.n);
  const rows = TIMESHEET.filter(inScope);
  const bill = rows.filter(t=>WORKTYPES.find(w=>w.k===t.type).bill);
  const nb   = rows.filter(t=>!WORKTYPES.find(w=>w.k===t.type).bill);
  const bd=sum(bill,t=>t.h)/8, nd=sum(nb,t=>t.h)/8, td=bd+nd;
  const tv=sum(rows,t=>t.travel);

  box.innerHTML=`
  <div class="grid g12" style="gap:14px">
    <div>
      <div class="section-t">移动端填报（模拟）</div>
      <div style="border:9px solid var(--ink);border-radius:26px;background:var(--surface);overflow:hidden;box-shadow:var(--shadow);max-width:330px">
        <div style="background:var(--ink);color:var(--ground);padding:3px 14px 7px;display:flex;justify-content:space-between;font-size:10px" class="mono">
          <span>9:41</span><span>中心台 · CRC 端</span></div>
        <div style="padding:14px">
          <div class="field"><div class="slider-h"><label for="ts-w">填报人</label></div>
            <select class="sel" id="ts-w" style="width:100%" ${mineOnly?"disabled":""}>${
              (mineOnly?[staff(me.n)]:STAFF.filter(p=>p.role==="CRA"||p.role==="CRC"))
              .map(p=>`<option ${p.n===(mineOnly?me.n:state.tsWho)?"selected":""}>${esc(p.n)}</option>`).join("")}</select></div>
          <div class="field"><div class="slider-h"><label for="ts-s">项目中心</label></div>
            <select class="sel" id="ts-s" style="width:100%"></select></div>
          <div class="field"><div class="slider-h"><label>工作类型</label></div>
            <div class="row" style="gap:4px" id="ts-t">${WORKTYPES.map((w,i)=>
              `<button class="chip" data-t="${esc(w.k)}" aria-pressed="${i===0}" style="font-size:10.5px;padding:2px 7px">${esc(w.k)}</button>`).join("")}</div></div>
          <div id="ts-bill" style="margin:-4px 0 12px"></div>
          <div class="field"><div class="slider-h"><label for="ts-h">工时</label><b id="ts-hv">8.0 小时</b></div>
            <input type="range" id="ts-h" min="0.5" max="12" step="0.5" value="8"></div>
          <div class="field"><label class="cbx"><input type="checkbox" id="ts-tv"><span>发生差旅费用</span></label>
            <div id="ts-tvw" hidden style="margin-top:5px"><input class="inp" id="ts-tva" type="number" step="0.01" min="0" value="0.28" style="width:100%"><div class="note" style="margin-top:3px">单位：万元</div></div></div>
          <button class="btn btn-p" id="ts-go" style="width:100%;justify-content:center;padding:9px">提交（本次约 12 秒）</button>
          <div class="note" style="text-align:center;margin-top:7px">弱网自动离线暂存，恢复后补传</div>
        </div>
      </div>
      <div class="formula" style="margin-top:12px">
成本归集口径
人天 = 工时 ÷ 8
成本 = 人天 × 费率(CRC ${RATE.crcDay}／CRA ${RATE.craDay} 万) + 差旅
→ 自动落到该 StudySite
      </div>
    </div>
    <div class="stack">
      <div class="grid g4" style="gap:10px">
        ${[[mineOnly?"我的总人天":"本期总人天",n1(td),"人天","含全部类型"],
           ["可计费人天",n1(bd),"人天",`占比 ${td?pct(bd/td):"—"}`],
           ["不可计费人天",n1(nd),"人天",`占比 ${td?pct(nd/td):"—"} · 毛利蒸发口`],
           ["差旅费用",n1(tv),"万元",`${rows.filter(t=>t.travel>0).length} 笔`]
         ].map(([l,v,u,n],i)=>`<div class="stat">
            <div class="kpi-l">${esc(l)}</div>
            <div class="num" style="font-size:23px;margin-top:3px;${i===2&&td&&nd/td>0.15?"color:var(--crit)":""}">${v}<small style="font-size:11px;color:var(--ink-3);margin-left:2px">${u}</small></div>
            <div class="note">${esc(n)}</div></div>`).join("")}
      </div>
      <div class="card">
        <div class="card-h"><h3>计费 / 不计费构成</h3><span class="sub">不区分，利用率就是假的</span></div>
        <div class="card-b"><div id="c-bill"></div>
          <div class="note" style="margin-top:10px;border-top:1px solid var(--line);padding-top:9px">
            不可计费工时占比若持续高于 15%，通常意味着合同外「帮忙」、返工或投标支持被计入了项目 —— 这是隐性毛利流失最常见的出口。</div>
        </div>
      </div>
      <div class="card">
        <div class="card-h"><h3>最近填报</h3><span class="sp"></span><span class="sub" id="ts-n">${rows.length} 条</span></div>
        <div class="tw"><table style="min-width:600px">
          <thead><tr><th>日期</th><th>填报人</th><th>项目中心</th><th>工作类型</th><th class="ta-r">工时</th><th class="ta-r">差旅</th><th class="ta-r">归集成本</th><th></th></tr></thead>
          <tbody id="ts-tb"></tbody>
        </table></div>
      </div>
    </div>
  </div>`;

  const fillSites=()=>{ const who=$("#ts-w").value, p=staff(who);
    const opts = (p.sites.length?p.sites:SITES.map(s=>s.id));
    $("#ts-s").innerHTML = opts.map(id=>{const s=site(id);
      return `<option value="${id}">${esc(s.hosp)}（${esc(S[s.sid].short)}）</option>`;}).join(""); };
  const billNote=()=>{ const t=box.querySelector('#ts-t [aria-pressed="true"]')?.dataset.t;
    const w=WORKTYPES.find(x=>x.k===t);
    $("#ts-bill").innerHTML = w.bill
      ? `<span class="pill p-good">✓ 可计费 — 计入合同范围</span>`
      : `<span class="pill p-crit">✗ 不可计费 — 由公司承担，不进项目收入</span>`; };
  const drawRows=()=>{
    const rs = TIMESHEET.filter(inScope).slice().sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id);
    $("#ts-tb").innerHTML = rs.map(t=>{
      const w=WORKTYPES.find(x=>x.k===t.type), p=staff(t.who);
      const cost=t.h/8*(p.role==="CRA"?RATE.craDay:RATE.crcDay)+t.travel;
      return `<tr><td class="mono" style="font-size:11.5px">${esc(t.d)}</td>
        <td>${esc(t.who)} <span class="t-sub">${p.role}</span></td>
        <td style="font-size:12px">${esc(site(t.ss).hosp)}</td>
        <td><span class="pill ${w.bill?"p-neut":"p-crit"}">${esc(t.type)}</span></td>
        <td class="tnum">${n1(t.h)} h</td>
        <td class="tnum">${t.travel?n1(t.travel)+" 万":"—"}</td>
        <td class="tnum">${n1(cost)} 万</td>
        <td class="ta-r"><button class="x" data-del="${t.id}" title="撤销">✕</button></td></tr>`;}).join("")
      || `<tr><td colspan="8"><div class="empty">${mineOnly?"你还没有填报记录，用左侧手机端提交一条":"当前项目范围内暂无填报记录"}</div></td></tr>`;
    $("#ts-n").textContent = rs.length+" 条";
  };
  const drawBill=()=>{
    const rs=TIMESHEET.filter(inScope);
    const b=sum(rs.filter(t=>WORKTYPES.find(w=>w.k===t.type).bill),t=>t.h)/8;
    const n=sum(rs.filter(t=>!WORKTYPES.find(w=>w.k===t.type).bill),t=>t.h)/8;
    stacked($("#c-bill"),[{n:"可计费",v:b},{n:"不可计费",v:n}],{fmt:v=>n1(v)+" 人天"});
  };
  fillSites(); billNote(); drawRows(); drawBill();
  $("#ts-w").addEventListener("change",e=>{state.tsWho=e.target.value;fillSites();});
  $("#ts-h").addEventListener("input",e=>$("#ts-hv").textContent=(+e.target.value).toFixed(1)+" 小时");
  $("#ts-tv").addEventListener("change",e=>$("#ts-tvw").hidden=!e.target.checked);
  $("#ts-t").addEventListener("click",e=>{const b=e.target.closest("[data-t]"); if(!b)return;
    box.querySelectorAll("#ts-t .chip").forEach(c=>c.setAttribute("aria-pressed",c===b));billNote();});
  $("#ts-go").addEventListener("click",()=>{
    const who=$("#ts-w").value, ss=$("#ts-s").value;
    const type=box.querySelector('#ts-t [aria-pressed="true"]').dataset.t;
    const h=+$("#ts-h").value, tv=$("#ts-tv").checked? +$("#ts-tva").value||0 : 0;
    TIMESHEET.unshift({id:tsSeq++, d:TODAY, who, ss, type, h, travel:tv});
    const p=staff(who), c=h/8*(p.role==="CRA"?RATE.craDay:RATE.crcDay)+tv;
    const s=site(ss); s.cost=+(s.cost+c).toFixed(1); s.md+=Math.round(h/8*10)/10;
    const w=WORKTYPES.find(x=>x.k===type);
    toast(`已记录 ${who} ${n1(h)} 小时 · ${w.bill?"可计费":"不可计费"} · 成本 ${n1(c)} 万已归集到 ${s.hosp}`, w.bill?"":"warn");
    render();
  });
  box.addEventListener("click",e=>{const d=e.target.closest("[data-del]"); if(!d)return;
    const i=TIMESHEET.findIndex(t=>t.id===+d.dataset.del); if(i<0)return;
    const t=TIMESHEET[i], p=staff(t.who), s=site(t.ss);
    s.cost=+(s.cost-(t.h/8*(p.role==="CRA"?RATE.craDay:RATE.crcDay)+t.travel)).toFixed(1);
    s.md=Math.max(0,s.md-Math.round(t.h/8*10)/10);
    TIMESHEET.splice(i,1); toast("已撤销该条填报，成本同步回滚"); render();});
};

<script>
"use strict";
/* ════════════════ 6 · 成本与毛利 ════════════════ */
VIEWS.pnl = box=>{
  const list=scope().filter(s=>siteRev(s)>0||s.cost>0), R=rollup(scope());
  const sorts={gp:"毛利额",gm:"毛利率",cpe:"每例成本",rev:"收入"};
  const key=state.pnlSort;
  const val=(s)=>{const m=siteM(s);return key==="gp"?m.gp:key==="gm"?(m.gm??-9):key==="cpe"?(m.cpe??999):m.rev;};
  const rows=list.slice().sort((a,b)=>val(b)-val(a));
  const loss=rows.filter(s=>siteM(s).gp<0);

  /* 成本构成：按人力/差旅/分摊拆解（与工时模块口径一致） */
  const craMd=sum(list,s=>s.md*0.34), crcMd=sum(list,s=>s.md*0.66);
  const craC=craMd*RATE.craDay, crcC=crcMd*RATE.crcDay;
  const travel=sum(list,s=>s.md*0.011*RATE.travel*8);
  const oh=(craC+crcC)*RATE.overhead;

  box.innerHTML=`
  <div class="grid g4" style="margin-bottom:12px">
    ${[["已确认收入",wan(R.rev),"万","按里程碑与入组例数确认"],
       ["已发生成本",wan(R.cost),"万","人力 + 差旅 + 职能分摊"],
       ["毛利",(R.gp>0?"+":"")+wan(R.gp),"万",`毛利率 ${pct(R.gm)}`],
       ["亏损中心",loss.length,"个",loss.length?`合计失血 ${n1(Math.abs(sum(loss,s=>siteM(s).gp)))} 万`:"无"]
     ].map(([l,v,u,n],i)=>`<div class="stat">

        <div class="note">${esc(n)}</div></div>`).join("")}
  </div>
  <div class="grid g21" style="margin-bottom:12px">
    <div class="card">
      <div class="card-h" style="flex-wrap:wrap"><h3>单中心毛利额</h3>
        <span class="sub">零轴居中 · 绿盈红亏</span><span class="sp"></span>
        <div class="seg" id="ps">${Object.entries(sorts).map(([k,t])=>
          `<button data-k="${k}" aria-pressed="${key===k}">${esc(t)}</button>`).join("")}</div></div>
      <div class="card-b"><div id="c-dv"></div></div>
    </div>
    <div class="card">

CRC 人力 = ${n0(crcMd)} 人天 × ${RATE.crcDay} 万
CRA 人力 = ${n0(craMd)} 人天 × ${RATE.craDay} 万
差旅     = 现场监查次数 × ${RATE.travel} 万
职能分摊 = 直接人力 × ${pct(RATE.overhead)}
        </div>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-h"><h3>单中心 P&amp;L 明细</h3><span class="sp"></span>
      <span class="sub">「项目毛利 ${pct(R.gm)}」没有经营价值 — 下表才有</span></div>
    <div class="tw"><table style="min-width:900px">
      <thead><tr><th>中心</th><th>项目</th><th class="ta-r">已入组</th><th class="ta-r">收入</th><th class="ta-r">成本</th>

        return `<tr class="clk" data-ss3="${s.id}">
          <td><div class="t-main">${esc(s.hosp)}</div><div class="t-sub">${esc(s.city)} · PI ${esc(s.pi)}</div></td>
          <td class="t-sub">${esc(S[s.sid].short)}</td>
